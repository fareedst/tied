default_roots:
  - "project_root"
  - "TIED_BASE_PATH"
follow_symlinks: "false"
ignore_file: ".tiedignore"
roots: []
token_scan:
  include_extensions:
    - ".ts"
    - ".tsx"
    - ".js"
    - ".mjs"
    - ".rb"
    - ".md"
    - ".yaml"
    - ".yml"
    - ".json"
  max_file_bytes: "250000"
  max_files: "5000"
# Optional Plumb-style traceability gap report (mode: traceability_gap_report).
# This is a configurable structural traceability check, not runtime quality proof.
traceability_gap:
  dimensions:
    req_without_test: "true"
    req_without_implementation: "true"
    impl_without_test: "true"
  test_file:
    path_contains:
      - "__tests__"
      - "/tests/"
      - "/test/"
    basename_suffixes:
      - ".test.ts"
      - ".test.tsx"
      - ".test.js"
      - ".test.mjs"
      - ".spec.ts"
      - ".spec.js"
      - ".spec.mjs"
      - "_test.go"
      - "_test.rb"
  methodology_path_markers:
    - "tied/methodology/"
  non_production_path_markers:
    - "templates/"
    - "examples/"
    - "testdata/"
  exclude_methodology_only_records: "true"
  strict: "false"
