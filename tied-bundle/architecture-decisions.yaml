ARCH-EVIDENCE_CHAIN_REPORT:
  cross_references:
    - ARCH-EVIDENCE_CHAIN_PROFILE
    - REQ-EVIDENCE_CHAIN_PROFILE
    - REQ-EVIDENCE_CHAIN_REPORT
  decision: >-
    Ship a TIED-source offline aggregator that reads an evidence-chain-report-inputs.v1 manifest and already-generated
    evidence-chain-profile.v1 files, partitions compatible client cohorts, and emits evidence-chain-statistics-report.v1
    YAML plus a deterministic Markdown projection. Do not traverse client repositories or write project YAML.
  detail_file: architecture-decisions/ARCH-EVIDENCE_CHAIN_REPORT.yaml
  name: Evidence chain statistics report architecture
  rationale:
    benefits:
      - Stable identity via hashed project_id with optional client alias
      - Testable aggregator versus generator boundary
    problems_solved:
      - Deferred cross-project tool had no contract
      - Risk of mixing incompatible depths or inventing scores
    why: Aggregation is a different actor and proof boundary from one-client profile generation.
  status: Accepted
