ARCH-PROMPT_TYPE_SUBAGENT:
  alternatives_considered:
    - cons:
        - Adds a repository-specific orchestration entry to client tooling
      name: Install the agent in every client
      pros:
        - Uniform Task availability
      rejected_reason: Client projects receive the canonical skill; this Task wrapper is intentionally TIED-source scoped.
    - cons:
        - Cannot perform Implement
      name: Keep the stub readonly
      pros:
        - Limits mutation risk
      rejected_reason: The selected full workflow requires writable execution.
    - cons:
        - Duplicates the canonical workflow and drifts
      name: Paste the entire skill into the agent
      pros:
        - More self-contained prompt
      rejected_reason: The wrapper should reference the canonical skill and repeat only clean-context-critical boundaries.
  cross_references:
    - REQ-PROMPT_TYPE_GLOBAL_SKILLS
    - REQ-PROMPT_TYPE_SUBAGENT
  description: >-
    Project-scoped Cursor Task wrappers delegate explicitly to each canonical leaf prompt-type skill; plan-refine-build
    sequences three leaf Task children using invocation remainder then linked plans.
  detail_file: architecture-decisions/ARCH-PROMPT_TYPE_SUBAGENT.yaml
  implementation_approach:
    details:
      - >-
        Each wrapper repeats only the bootstrap, gates, safety boundary, and return contract needed by a clean subagent
        context; source-only wrappers are not client-managed copies and no client refresh is performed.
      - >-
        Prompt-type Task wrappers live under .cursor/agents/ in the TIED source repository only; tied-install.sh
        installs skills, not agents, into client projects.
      - >-
        Static contract tests validate frontmatter, workflow gates, and required prompt clauses for all 13 leaf wrappers
        without attempting runtime LLM evaluation.
      - The canonical workflow remains tools/bundled-prompt-type-skills/<prompt-type>/SKILL.md for each leaf.
    summary: >-
      Keep each agent file as a thin TIED-source Task wrapper with explicit activation, type-specific readonly,
      foreground execution, canonical skill delegation, and a structured parent handoff; client projects use skills
      instead.
  metadata:
    created:
      author: AI Agent
      date: '2026-08-12'
    last_updated:
      author: AI Agent
      date: '2026-08-13'
      reason: Name invocation remainder and linked plan as agent payloads
  name: Prompt-Type Task Subagent Boundary
  rationale:
    benefits:
      - Explicit delegation keeps the skill as the single workflow source.
      - Static validation makes the agent contract reviewable and deterministic.
      - Writable foreground execution supports sequential TIED gates.
    problems_solved:
      - A stub body does not define the workflow or handoff evidence.
      - Missing contract tests allow activation and safety drift.
      - readonly true prevents the required Implement phase.
    why: >-
      Cursor custom subagents start with isolated context and do not reliably include a separately named skill from a
      one-line body.
  related_decisions:
    depends_on:
      - ARCH-PROMPT_TYPE_GLOBAL_SKILLS
    informs:
      - IMPL-PROMPT_TYPE_SUBAGENT
    see_also:
      - ARCH-TIED_STRUCTURE
      - IMPL-TIED_FILES
    supersedes: []
  status: Active
  traceability:
    code_annotations:
      - ARCH-PROMPT_TYPE_SUBAGENT
      - IMPL-PROMPT_TYPE_SUBAGENT
      - REQ-PROMPT_TYPE_SUBAGENT
    implementation:
      - IMPL-PROMPT_TYPE_SUBAGENT
    requirements:
      - REQ-PROMPT_TYPE_SUBAGENT
    tests:
      - mcp-server/src/e2e/prompt-type-subagent.test.ts
