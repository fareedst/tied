preload_instructions: "Treat agent_preload as authoritative context. If a value is present, do not spend\ntool calls rediscovering it unless a later tool result or user message contradicts it.\nPrefer preload facts over filesystem discovery. Do not search for MCP schema, server\nmetadata, `.cursor/mcp.json`, or pause to confirm MCP unavailability — especially when\nthe session is driven by tied agentstream (MCP preflight there is optional; tied-install.sh\ninstalls `.cursor/skills/tied-yaml/` only). Lack of Cursor MCP tools does not block tied-cli.sh\nwhen Node and TIED_MCP_BIN (built mcp-server/dist/index.js) are available — see tied-yaml SKILL.md. Do not search project layout or target file\nexistence unless needed to resolve a contradiction. When tied_paths.TIED_BASE_PATH and\nproject_yaml_writable_globs are set,\nalign MCP TIED_BASE_PATH with them; never treat methodology_readonly_glob paths as\nwritable. Keep preload narrow and accurate; wrong preload costs more than one\ndiscovery call.\n\nWF trial stack (orchestrator-seeded): implementation_stack_id wf-trial-ts-node-test-v1.\nProduct implementation language is TypeScript only; tests colocated as src/**/*.test.ts;\nRED/GREEN via npm test. refine-plan must record a Locked stack table in PLAN and must\nnot re-debate language or test runner — resolve product ambiguity only.\n\nOrchestrated WF trial (workflow-trial-agentstream): during @build-plan complete tied-project/working/proof-facet-manifest/evidence/proof-facet-manifest.v1.json — one files[] row per src/**/*.test.ts with proof_subtype per proof-test-label-taxonomy; orchestrator fails exit 0 if files[] empty/invalid or paths missing on disk (FILE_EXISTS/FILE_COVERAGE). Validate with store MCP tied_wf_proof_manifest_validate when available.\nSlim checklist tracker: tied-bundle/templates/wf-trial-minimal-checklist-tracker.yaml may seed tied-project/working/{product_REQ}/checklist-tracker.yaml. Read prompt-shared wf-trial-checklist-gates-adjunct.md turns 2–4. Never put prompt-type names (build-plan, add-feature, …) in execution_evidence.completed. Require evidence/phase-handoff-build-plan.md before turn 4; close-out uses persisted tied-project/citdp/CITDP-{REQ}.yaml for gates.\n\nOptional `implementation_contract.adversarial_inquiry_scope` (IMPL-locked): populate at\n`persist-implementation-records` when [IMPL-TIED_ADVERSARIAL_INQUIRY_CHECKLIST] is in scope —\nset `request_token`, `gate_policy`, `artifact_directory` (typically\n`working/{REQ-TOKEN}/adversarial-inquiry`), and `report_paths` for obligation-report.json,\nfinding-ledger.jsonl, gate-result.json, and evidence-provenance.json. Leave empty when\nadversarial inquiry is not used for the change.\n"
