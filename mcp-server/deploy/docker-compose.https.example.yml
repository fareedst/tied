# [REQ-MCP_HTTPS_REMOTE_ACCESS] Example: dual MCP over HTTPS (Caddy TLS → plain HTTP backends).
# Usage: copy .env.example to .env, set TIED_MCP_HTTP_BEARER_TOKEN, mount client tied-project/.

services:
  tied-mcp-core:
    image: node:22-bookworm
    working_dir: /app/mcp-server
    command: ["node", "dist/http-entry.js"]
    environment:
      TIED_MCP_TOOL_PROFILE: core
      TIED_MCP_HTTP_HOST: 0.0.0.0
      TIED_MCP_HTTP_PORT: 8787
      TIED_MCP_HTTP_BEARER_TOKEN: ${TIED_MCP_HTTP_BEARER_TOKEN:?set bearer token}
      TIED_CLIENT_PROJECT_PATH: /corpus/tied-project
      TIED_CLIENT_BUNDLE_PATH: /corpus/tied-bundle
    volumes:
      - ../..:/app:ro
      - ${TIED_CLIENT_ROOT:?set client repo root}:/corpus:rw
    expose:
      - "8787"

  tied-mcp-optin:
    image: node:22-bookworm
    working_dir: /app/mcp-server
    command: ["node", "dist/http-entry.js"]
    environment:
      TIED_MCP_TOOL_PROFILE: optin
      TIED_MCP_HTTP_HOST: 0.0.0.0
      TIED_MCP_HTTP_PORT: 8788
      TIED_MCP_HTTP_BEARER_TOKEN: ${TIED_MCP_HTTP_BEARER_TOKEN:?set bearer token}
      TIED_CLIENT_PROJECT_PATH: /corpus/tied-project
      TIED_CLIENT_BUNDLE_PATH: /corpus/tied-bundle
    volumes:
      - ../..:/app:ro
      - ${TIED_CLIENT_ROOT:?set client repo root}:/corpus:rw
    expose:
      - "8788"

  caddy:
    image: caddy:2-alpine
    ports:
      - "443:443"
      - "8443:8443"
    volumes:
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - tied-mcp-core
      - tied-mcp-optin

volumes:
  caddy_data:
