first_vertical_slice:
  modules:
    - block: "PROJECT_MANIFEST"
      boundary: "Resolve project root, absolute TIED base path, versions, languages, classifiers, and ignore rules."
      id: "project_manifest"
      validation: "Unit tests with malformed paths, wrong base path, missing manifest fields, and explicit ignore rules."
    - block: "APPEND_CANDIDATE_FINDING"
      boundary: "Create and append one versioned candidate finding with lifecycle, severity, confidence, visibility, deduplication, and evidence references."
      id: "finding_capture"
      validation: "Unit tests for valid, malformed, duplicate, and lifecycle-transition inputs."
    - block: "SNAPSHOT_CHANGE"
      boundary: "Capture one revisioned change and its prior/current specification without mutating the audited project."
      id: "change_snapshot"
      validation: "Contract tests for revision identity, missing evidence, and read-only boundaries."
    - block: "ANALYZE_SPECIFICATION_STATE"
      boundary: "Classify approved prior/current behavior as specification change, implementation lag, missing specification, or unresolved."
      id: "specification_state"
      validation: "Decision-table tests covering each classification and ambiguous evidence."
    - block: "RUN_STRUCTURAL_ANALYSIS"
      boundary: "Invoke existing TIED structural checks and retain their proof boundaries."
      id: "structural_analysis_adapter"
      validation: "Composition tests proving trigger, tool call, arguments, result capture, and structural-only labeling."
    - block: "AUDIT_IMPL_FIDELITY"
      boundary: "Inventory IMPL blocks and produce pseudo-code-to-evidence and evidence-to-pseudo-code matrices."
      id: "fidelity_analysis_adapter"
      validation: "Unit tests for missing loci, unreliable statements, completeness gaps, and block verdicts."
    - block: "ANALYZE_BINDING_EVIDENCE"
      boundary: "Evaluate one binding inventory row and UI-free composition evidence separately from unit behavior."
      id: "binding_analysis_adapter"
      validation: "Composition tests for trigger, channel, callee, arguments, effects, ordering, and failure behavior."
    - block: "PROMOTE_CONFIRMED_CASE"
      boundary: "Promote one confirmed finding to a case report without automatic product TIED mutation."
      id: "case_promotion"
      validation: "Unit and contract tests for promotion policy, unresolved classifications, and read-only enforcement."
    - block: "VERIFY_DETERMINISTIC_RERUN"
      boundary: "Repeat the slice and link duplicate observations without changing defect denominators."
      id: "deterministic_rerun"
      validation: "Replay tests with stable revisions, hashes, ordering, and duplicate links."
    - block: "RUN_FIRST_SLICE"
      boundary: "Connect all validated modules through one read-only composition seam."
      id: "first_slice_composition"
      validation: "Composition test proves the nine-stage trigger-to-result order without UI invocation."
    - block: "RUN_FIDELITY_RESEARCH_PILOT"
      boundary: "Connect concrete validated adapters through RUN_FIRST_SLICE and emit bounded research-dataset records."
      id: "fidelity_research_pilot"
      validation: "Integration test proves concrete module execution, read-only safety, and research-dataset output."
  scope: "One project and one IMPL/module boundary; read-only analysis plus research-dataset writes only."
gates:
  before_req_arch_impl: "Approve this change definition, module boundary map, risk applicability, and first-slice acceptance criteria."
  before_tests_or_code: "Author token-commented IMPL pseudo-code, run structural pseudo-code validation, and persist project REQ/ARCH/IMPL records."
  research_safety: "Keep audited-project analysis read-only; only the separate research dataset may receive append-only observations."
