change_definition:
  current_behavior: "Before this change, no implemented fidelity-research vertical slice existed in this repository."
  desired_behavior: "Define and later implement one-project, one-IMPL/module-boundary research that captures a candidate finding, snapshots one change and its prior/current specification, runs structural checks, audits pseudo-code fidelity, evaluates composition evidence, promotes one confirmed case report, and verifies deterministic rerun and duplicate linking."
  non_goals:
    - "Automatic REQ, ARCH, IMPL, code, test, or LEAP remediation."
    - "Centralizing unrestricted source content or secrets."
    - "Cross-project aggregation or statistical comparison."
    - "Treating every agent observation as a confirmed product defect."
  success_criteria:
    - "A candidate finding remains distinguishable from confirmed, dismissed, deferred, remediated, and verified states."
    - "A deterministic rerun produces the same result and duplicate observations link without inflating counts."
    - "Every finding and case report retains revision, command, artifact, and evidence provenance."
    - "Specification change, implementation lag, missing specification, and implementation defect remain distinct classifications."
    - "The first slice has independently testable module boundaries and explicit proof boundaries."
  unchanged_behavior:
    - "Existing TIED validators, LEAP proposal lifecycle, and project development workflows remain unchanged."
    - "Structural validation remains distinct from runtime correctness."
    - "The research pass does not modify audited project source, tests, project YAML, methodology YAML, or approved specifications."
