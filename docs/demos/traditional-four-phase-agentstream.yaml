# Traditional four-phase workflow trial — feature-spec batch for `tied agentstream -b`.
# Placeholders {{FEATURE_REMAINDER}}, {{MODEL_CONFIG}}, {{MODEL_SLUG}}, {{MODEL_EFFORT}} are expanded by
# scripts/run-traditional-four-phase-agentstream.sh (not by --checklist-var on batch text).
features:
  - order: 1
    feature_name: "Phase 1 — add-feature"
    goal: |
      Explicitly follow `{{SKILL_ROOT}}/add-feature/SKILL.md` (/add-feature).
      Write `tied-project/working/{REQ-TOKEN}/PLAN.md` with header lines:
      **Trial:** (from product remainder or PROMPT-WF id),
      **Model config:** {{MODEL_CONFIG}},
      **Model slug:** {{MODEL_SLUG}},
      **Model effort:** {{MODEL_EFFORT}} (empty when unset),
      **Workflow:** add-feature → refine-plan → build-plan → close-out.
      Scaffold REQ/CITDP/PLAN/tracker only — no production code or RED tests this turn.
      Seed `evidence/trial-workflow-interaction-inventory.v1.json` with
      `analysis_label`: `traditional-workflow-trial.v1`,
      `implementation_stack_id`: `wf-trial-ts-node-test-v1` when orchestrator seeded stack,
      `harness`: `{{HARNESS}}-agentstream-four-phase`,
      `harness_notes`: `run-traditional-four-phase-agentstream.sh` (four feature-spec batch turns; new agent session per turn),
      `model_config`: {{MODEL_CONFIG}}, `model_slug`: {{MODEL_SLUG}}, `model_effort`: {{MODEL_EFFORT}} when non-empty.
      After `tied_config_get_base_path`, call MCP `server_info` (or `tied-cli.sh server_info '{}'` when IDE MCP unavailable).
      Read `extensions.tied.methodology.version` and `source`; write
      `evidence/tied-methodology-version.session.v1.json` (`schema`: `tied-methodology-version.session.v1`;
      `capture_path`: `mcp_server_info` or `tied_cli_server_info`; ISO `captured_at`; optional `turn`: `add-feature`).
      Mirror `tied_methodology_version` and `tied_methodology_version_source` on the interaction inventory when present.
      Read prompt-shared trial-session-methodology-version-capture.md for capture procedure.
      Write `evidence/phase-handoff-add-feature.md` under `tied-project/working/{product_REQ}/` (RESOLVE, session semver path, next `@refine-plan`).
      Machine-readable product token required: `request_token: REQ-…` line **or** markdown table row `| REQ token |` / `| REQ |` with backticked token (folder basename `REQ-*` is fallback).
    behavior: |
      Product requirement (invocation remainder):
      {{FEATURE_REMAINDER}}

  - order: 2
    feature_name: "Phase 2 — refine-plan"
    goal: |
      Explicitly follow `{{SKILL_ROOT}}/refine-plan/SKILL.md` (/refine-plan).
      Use the linked PLAN from phase 1 under `tied-project/working/{REQ-TOKEN}/PLAN.md`.
      Refine PLAN, CITDP notes, and tracker; still no product implementation commits.
      Read prompt-shared wf-trial-refine-plan-stack.md: stack pre-locked from preload + package.json;
      add PLAN **Locked stack** table; do not re-debate language or test runner.
      Read prompt-shared wf-trial-checklist-gates-adjunct.md (numbered gate script; slim tracker under working/{product_REQ}/checklist-tracker.yaml).
      Write `evidence/phase-handoff-refine-plan.md` (locked decisions, gate receipts, next `@build-plan`).
    behavior: |
      Optional sponsor refine notes may appear in the phase-1 PLAN or working folder.
      Do not start RED tests or production code.

  - order: 3
    feature_name: "Phase 3 — build-plan"
    goal: |
      Explicitly follow `{{SKILL_ROOT}}/build-plan/SKILL.md` (/build-plan).
      Execute the linked PLAN (post-refine) from `tied-project/working/{REQ-TOKEN}/`.
      Greenfield minimal path when depth_tier is minimal: create REQ/ARCH/IMPL + IMPL pseudo-code before RED;
      set sub-adversarial-inquiry-pass to not_applicable before RED; no sponsor questions in batch mode.
      RED → GREEN product code/tests under `src/`; verification via `npm test` when stack seeded.
      When composition-integration applies, read prompt-shared tied-composition-test-naming-adjunct.md before RED composition tests.
      Follow prompt-shared wf-trial-build-plan-handoff.md and wf-trial-checklist-gates-adjunct.md (RED archive, tracker slugs, verification receipt).
      Read prompt-shared wf-trial-proof-manifest-adjunct.md: complete
      `tied-project/working/proof-facet-manifest/evidence/proof-facet-manifest.v1.json`
      (one `files[]` row per test file) before `evidence/phase-handoff-build-plan.md`.
      Write `evidence/phase-handoff-build-plan.md` before deferring `@close-out`.
    behavior: |
      Linked plan is the authoritative input; do not re-run add-feature or refine-plan scope.

  - order: 4
    feature_name: "Phase 4 — close-out"
    goal: |
      Explicitly follow `{{SKILL_ROOT}}/close-out/SKILL.md` (/close-out).
      Read prompt-shared wf-trial-four-phase-close-out-playbook.md and wf-trial-checklist-gates-adjunct.md step 4 (persist CITDP YAML, sync when verification receipt exists; traceable-commit only when close_out allowed).
      Write `evidence/phase-handoff-close-out.md` with three completion signals.
      Git context (paste-in only; do not run git unless the skill allows at close-out):
      When no staged or unstaged product changes exist, do not assert that staged changes are ready—run close-out gates and handoff only.
      When changes exist, consider git diff or stage before traceable-commit.
      When close_out gates allow, run traceable-commit per prompt-shared traceable-commit-close-out.md.
      Deliver CHANGELOG, three completion signals, and traceable commit when gates allow.
    behavior: |
      Read `depth_tier` and `gate_policy` from working `CITDP-draft.yaml` / `CITDP-*.yaml`
      (`risk_analysis.adversarial_inquiry` or `record_identity`). Before close_out gates: call MCP
      `request_evidence_envelope_build` with those values (or rely on CITDP-aware inference when omitted).
      For minimal depth: ensure `not-applicable-receipt.v1.json` exists via `request_evidence_envelope_backfill`
      with `write_receipts: true` (or documented manual step) before `request_evidence_envelope_validate` with
      `fail_on_error_gaps: true`. Optionally run `tools/bootstrap/templates/run-close-out-gates.mjs`
      `--envelope-blocking --reconcile` when sponsor policy allows (WF trial: reconcile without
      `--sync-dispositions` when sub-adversarial is N/A).
      Invoke checklist gates with **`tied_gate_check`** using `citdp_path` + `tracker_path` so the validator
      receives the **inner** CITDP body (not a wrapped stub)—inline partial `citdp` objects yield
      `malformed_citdp:adversarial_inquiry`.
      Append or update `tied-project/working/{REQ-TOKEN}/evidence/trial-workflow-interaction-inventory.v1.json`:
      keep `harness`: `{{HARNESS}}-agentstream-four-phase` and `harness_notes` for this wrapper (not manual IDE @skills);
      record all four sponsor_turns with ordinals 1–4; set close_out turn gate receipt when close-out completes.
