ARCH-TIED_FIDELITY_RESEARCH:
  alternatives_considered:
    - cons:
        - "Findings can pollute approved project intent."
        - "Pre-remediation evidence can be lost."
      name: "Write findings directly into project TIED YAML"
      pros:
        - "Immediate project visibility"
      rejected_reason: "Research observations require triage and adjudication before changing intent."
    - cons:
        - "Weak provenance and block-level mapping"
      name: "Use transcript-only natural-language findings"
      pros:
        - "Low initial implementation cost"
      rejected_reason: "Findings must be emitted at discovery boundaries with structured evidence."
  cross_references:
    - "REQ-TIED_FIDELITY_RESEARCH"
  decision: "Separate read-only research analysis and append-only evidence from audited project TIED data and remediation workflows."
  implementation_approach:
    details:
      - "Confirm the absolute TIED base path independently for each analyzed project."
      - "Establish prior/current approved specification state before interpreting behavior evidence."
      - "Keep research records outside audited project project YAML."
      - "Require explicit promotion before any REQ, ARCH, or IMPL mutation."
      - "Separate structural, fidelity, and binding evidence with explicit proof boundaries."
    summary: "Use bounded manifests, immutable snapshots, append-only findings, evidence adapters, and separate case reports."
  metadata:
