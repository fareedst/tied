  decision: "Deliver evidence-chain-profile.v1 as a client-controlled non-canonical artifact generated by a depth-gated MCP/CLI orchestrator. Profile depths are integrated and human_research. Generation is read-only: never mutate project or methodology YAML, never append findings, never promote cases, and never emit a maturity score."
  implementation_approach:
    details:
      - "Cross-project percentile aggregation is a deferred separate read-only tool"
      - "Cross-project statistics aggregation is a TIED-source-only offline CLI, not this generator token"
      - "Fail closed when TIED base path does not match the confirmed project tied directory"
      - "human_research without change_context succeeds with change_fidelity not_measured or not_applicable"
      - "integrated depth must not invoke fidelity, binding, or specification adapters"
    key_components:
      - "Depth-gated orchestrator"
      - "evidence-chain-profile.v1 schema"
      - "Manual Path B contract"
      - "Opt-in sanitized metrics fields"
    summary: "Register evidence_chain_profile_generate; compose PROJECT_MANIFEST, structural analysis, optional human-research adapters, quality partition, and a deterministic normalizer."
  name: "Evidence chain profile architecture"
  rationale:
    benefits:
      - "Explicit proof-boundary partition"
      - "Manual Path B with generator manual"
    problems_solved:
      - "Scattered validators"
      - "Wholesale first-slice side effects"
    why: "Chain completeness must be comparable and fail closed on the wrong TIED base path without conflating structural evidence with runtime correctness."
  related_requirements:
    - "REQ-EVIDENCE_CHAIN_PROFILE"
    - "REQ-QUALITY_ASSURANCE_EVIDENCE"
    - "REQ-TIED_FIDELITY_RESEARCH"
