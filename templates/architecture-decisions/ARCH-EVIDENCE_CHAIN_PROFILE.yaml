ARCH-EVIDENCE_CHAIN_PROFILE:
  alternatives_considered:
    - cons:
        - "Unsupported rollup"
      name: "Universal maturity score"
      pros:
        - "Simple ranking"
      rejected_reason: "Locked non-goal."
    - cons:
        - "Pollutes intent"
      name: "Write profiles into project YAML"
      pros:
        - "Always visible"
      rejected_reason: "Profiles are evidence, not approved intent."
  cross_references:
    - "ARCH-QUALITY_ASSURANCE_PROFILES"
    - "IMPL-EVIDENCE_CHAIN_PROFILE"
    - "PROC-QUALITY_EVIDENCE_PROVENANCE"
