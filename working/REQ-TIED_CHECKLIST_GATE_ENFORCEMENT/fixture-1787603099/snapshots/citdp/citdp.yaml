change_definition:
  current_behavior: "No application code; only inherited TIED methodology under tied/methodology/."
  desired_behavior: "Standalone Go CLI binary `portreport` enumerates local listening TCP and UDP sockets\n(bind address + port + protocol) and prints a JSON envelope to stdout.\n"
  non_goals:
    - "Connection tracking (ESTABLISHED and other non-LISTEN states)"
    - "Human-readable table output mode"
    - "Port-range or address filtering beyond --protocol tcp|udp|all"
    - "Process/PID lookup"
    - "Remote host enumeration"
  success_criteria:
    - "Each listener entry includes protocol, address, and port (integer 1–65535)"
    - "Exit code 0 on success; non-zero on fatal collection or JSON encode errors"
    - "Output is stably sorted by protocol, address, port"
    - "Running the binary on macOS prints valid JSON listing every listening TCP and UDP socket visible to gopsutil without root"
    - "Unit tests lock LISTEN filtering, protocol filter, dedupe/sort, and JSON shape without root"
  unchanged_behavior: "Inherited methodology YAML under tied/methodology/ remains read-only."
