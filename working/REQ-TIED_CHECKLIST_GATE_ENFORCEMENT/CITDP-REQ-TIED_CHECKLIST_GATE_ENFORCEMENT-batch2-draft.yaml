CITDP-REQ-TIED_CHECKLIST_GATE_ENFORCEMENT-batch2:
  change_definition:
    current_behavior: "Integrated depth pairing works only when callers pass an activation payload and optional required_step_slugs; the validator does not derive phase-aware slug sets, read completion_criteria.activation at verification/close_out, reject cross-phase run_id reuse, or require a depth-change waiver. Agents can select integrated depth and still pass gates by omitting activation.\n"
    desired_behavior: "When depth_tier is integrated, or strict_candidate at verification/close_out, tied_checklist_gate_validate fails closed without paired activation and the phase-aware slug set. Caller required_step_slugs unions with auto slugs and cannot subtract. completion_criteria.activation is validated on gate read at verification and close_out. Depth downgrade from integrated or strict_candidate to minimal requires prior_depth_tier plus a depth-change waiver. A verification-phase receipt cannot be submitted as close_out activation; a close-out inquiry waiver documents skip of a new close_out run_id only.\n"
    non_goals:
      - "Add a second checklist process token"
      - "Force integrated depth on every REQ"
      - "Retroactively fail closed on completed minimal clients such as 1787503424"
      - "Universal strict-approved blocking pilots"
      - "Ship tied_checklist_activation_collect in Slice 1"
      - "Complete H5 integrated pilot in Slice 1"
    success_criteria:
      - "SLICE 1: INTEGRATED_REQUIRED_SLUGS and phase-aware slug sets enforced inside validateChecklistGate when depth is integrated."
      - "SLICE 1: Caller required_step_slugs unions with the auto set; omitted auto slugs fail closed."
      - "SLICE 1: completion_criteria.activation required on gate read at verification and close_out when depth is integrated, or when depth is strict_candidate at those phases."
      - "SLICE 1: Depth downgrade without depth-change waiver fails with depth_downgrade_requires_waiver when prior_depth_tier is integrated or strict_candidate."
      - "SLICE 1: Receipt phase must equal gate phase; cross-phase reuse fails with receipt_identity_mismatch:phase."
      - "SLICE 1: strict_candidate requires integrated pairing at verification and close_out."
      - "SLICE 2 (not Slice 1 acceptance): optional collector returns gate-ready activation or diagnostics."
      - "SLICE 3 (not Slice 1 acceptance): H5 pilot records paired metric and four artifacts under working/."
    unchanged_behavior:
      - "Advisory gate_policy remains non-blocking after valid evidence."
      - "Minimal depth counterexample contract unchanged; auto slugs and pairing are not required at minimal."
      - "Observed inquiry findings do not trigger LEAP."
      - "Batch 1 pairing-when-supplied behavior remains the regression baseline."
