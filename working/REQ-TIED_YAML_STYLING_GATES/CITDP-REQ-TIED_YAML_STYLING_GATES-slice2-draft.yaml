CITDP-REQ-TIED_YAML_STYLING_GATES-slice2:
  change_definition:
    current_behavior: "Checklist sub-client-yaml-styling documents optional client_formatter invocation, semantic-equivalence, and styling_status evidence, but yaml-style-config.ts resolves scalar_style only; no executable hook runner, schema validation, or MCP/CLI surface exists."
    requested_change: "Extend .tied-yaml.yaml with optional client_formatter (command, args, version); implement fail-closed hook runner with path guards and yaml_semantic_compare acceptance; expose styling_status metadata; add fixture-backed tests for idempotence, preservation, and rejection cases."
    scope_in:
      - "mcp-server/fixtures/client-formatter/**"
      - "mcp-server/README.md"
      - "mcp-server/src/tools/index.ts (read-only styling apply tool)"
      - "mcp-server/src/yaml-client-formatter.test.ts"
      - "mcp-server/src/yaml-client-formatter.ts (new module boundary)"
      - "mcp-server/src/yaml-style-config.ts"
      - "tied/architecture-decisions/ARCH-TIED_YAML_STYLE_RESOLUTION.yaml (LEAP decision extension)"
      - "tied/implementation-decisions/IMPL-TIED_YAML_STYLE_RESOLVER-pseudocode.md"
      - "tied/implementation-decisions/IMPL-TIED_YAML_STYLE_RESOLVER.yaml (code_locations extension)"
      - "tied/requirements/REQ-TIED_YAML_STYLE_CONFIGURATION.yaml (LEAP satisfaction criteria extension)"
      - "tools/bundled-tied-yaml-skill/SKILL.md (client_formatter documentation)"
    scope_out:
      - "Automatic hook invocation inside every MCP writer (checklist-governed post-write only in Slice 2)"
      - "Checklist YAML/MD changes (Slice 1 shipped)"
      - "New REQ/ARCH/IMPL tokens (extend existing style-configuration stack)"
      - "tied/methodology/**"
    target_behavior: "When client_formatter is declared in repository .tied-yaml.yaml, tied-cli/MCP can run the hook on a single project-owned ./tied/ path after baseline canonical bytes exist; reject path escape, methodology paths, spawn/timeout failures, invalid YAML output, semantic drift, and non-idempotent second passes; record styling_status configured with command/version evidence or not_configured when absent."
  completion_criteria:
    - "IMPL pseudo-code blocks RESOLVE_CLIENT_FORMATTER, RUN_CLIENT_FORMATTER_HOOK, GUARD_PROJECT_TIED_PATH pass pseudocode_validate"
    - "LEAP extensions to REQ-TIED_YAML_STYLE_CONFIGURATION, ARCH-TIED_YAML_STYLE_RESOLUTION, IMPL-TIED_YAML_STYLE_RESOLVER recorded"
    - "lint_yaml on changed YAML; tied_validate_consistency ok"
    - "Optional MCP tied_client_yaml_styling_apply returns styling_status and fail-closed errors"
    - "Persist merged CITDP to tied/citdp/ at close-out (Slice 1 + Slice 2)"
    - "resolveClientFormatter and runClientFormatterHook unit/fixture tests pass"
  impact_analysis:
    architecture:
      - "ARCH-TIED_YAML_CANONICAL_PROFILE"
      - "ARCH-TIED_YAML_STYLE_RESOLUTION"
    implementation_decisions:
      - "IMPL-TIED_YAML_CANONICALIZER"
      - "IMPL-TIED_YAML_STYLE_RESOLVER"
    processes:
      - "PROC-AGENT_REQ_CHECKLIST"
      - "PROC-YAML_EDIT_LOOP"
    requirements:
      - "REQ-TIED_YAML_CANONICALIZATION"
      - "REQ-TIED_YAML_STYLE_CONFIGURATION"
  record_identity:
    citdp_id: "CITDP-REQ-TIED_YAML_STYLING_GATES-slice2"
    created_at: "2026-08-24"
    parent_citdp: "CITDP-REQ-TIED_YAML_STYLING_GATES"
    status: "draft"
    title: "Executable client_formatter hook for client YAML styling gates"
    updated_at: "2026-08-24"
  risk_analysis:
    adversarial_inquiry:
      assurance_profile: "baseline-functional"
      counterexamples:
        - "A hook preserves parseability but changes ordered-list or scalar-type semantics."
        - "A hook succeeds once but emits different bytes on a second pass, breaking idempotence assumptions."
        - "A malicious or misconfigured hook rewrites files outside project-owned ./tied/."
        - "Agents invoke a hook without repository declaration because MCP exposes an implicit default formatter."
      depth_tier: "minimal"
      disconfirming_observations:
        - "Invalid client_formatter schema fails at resolve time without running the hook."
        - "not_configured path performs zero spawns."
        - "Path guard tests reject methodology paths and paths outside tiedBasePath."
        - "yaml_semantic_compare runs between pre-hook snapshot and post-hook bytes before acceptance."
      evidence_references:
        - "mcp-server/fixtures/client-formatter/"
        - "mcp-server/src/yaml-client-formatter.test.ts"
        - "scripts/yaml_semantic_compare.rb"
      falsification_questions:
        - "Can a second hook pass change bytes while still semantically equivalent?"
        - "Can semantic drift pass when post-hook YAML parses cleanly?"
        - "Can the hook run on tied/methodology/** when declared?"
      gate_policy: "advisory"
      prior_depth_tier: "minimal"
      profile_depth: "not_measured"
      rationale: "Executable hook adds process-spawn boundary; Slice 1 checklist contract already governs agent invocation order. Minimal depth remains appropriate; integrated inquiry deferred unless hook scope expands to automatic writer integration."
      research_profile: "integrated-agent"
    risks:
      - description: "Hook command executes arbitrary process declared in repository config."
        id: "RISK-STYLE-GATE-005"
        mitigation: "spawn with shell:false; cwd locked to client project root; argv from config only; timeout and output bounds; path allowlist under tiedBasePath excluding methodology."
      - description: "scalar_style validation breaks repositories that declare client_formatter only."
        id: "RISK-STYLE-GATE-006"
        mitigation: "When .tied-yaml.yaml exists, treat missing scalar_style as unwrapped default if client_formatter is present; reject unknown keys and malformed client_formatter mapping."
      - description: "MCP auto-invokes hook on every write, bypassing checklist evidence timing."
        id: "RISK-STYLE-GATE-007"
        mitigation: "Slice 2 exposes explicit tied_client_yaml_styling_apply; MCP writers remain baseline-canonical only until a future slice approves writer integration."
  test_strategy:
    cases:
      - expectation: "styling_status not_configured; no process spawn"
        id: "FMT-NOT-CONFIGURED"
      - expectation: "Deterministic post-hook bytes across repeated runs on canonical input"
        id: "FMT-STABLE-OUTPUT"
      - expectation: "Second hook pass leaves bytes unchanged"
        id: "FMT-IDEMPOTENT"
      - expectation: "Boolean, number, and null nodes remain semantically equal"
        id: "FMT-SCALAR-TYPES"
      - expectation: "Sequence order preserved per yaml_semantic_compare"
        id: "FMT-ORDERED-LISTS"
      - expectation: "Block-scalar bodies preserved for IMPL sidecar-like fixtures"
        id: "FMT-BLOCK-SCALARS"
      - expectation: "Post-hook lint/parse failure rejects with fail-closed error"
        id: "FMT-INVALID-YAML"
      - expectation: "yaml_semantic_compare non-zero exit rejects acceptance"
        id: "FMT-SEMANTIC-DRIFT"
      - expectation: "Paths outside tiedBasePath rejected before spawn"
        id: "FMT-PATH-ESCAPE"
      - expectation: "tied/methodology/** paths rejected before spawn"
        id: "FMT-METHODOLOGY-BLOCK"
      - expectation: "Malformed client_formatter mapping fails at resolve"
        id: "FMT-INVALID-CONFIG"
      - expectation: "Absent client_formatter preserves Slice 1 baseline behavior"
        id: "FMT-DISABLED-DEFAULT"
    matrix_notes:
      - "Deferred: end-to-end tied-cli checklist sub-procedure automation"
      - "Fixture stub formatters: noop, stable-indent, break-semantics, invalid-yaml, non-idempotent"
      - "MCP composition smoke for tied_client_yaml_styling_apply registration"
      - "RED-first: yaml-client-formatter.test.ts before production module"
      - "Reuse scripts/yaml_semantic_compare.rb via child_process spawn from Node tests"
      - "Schema tests in yaml-style-config.test.ts for client_formatter parsing"
    summary: "Unit and fixture tests for resolver, hook runner, path guards, semantic compare, and idempotence; MCP tool registration test; LEAP index updates validated by tied_validate_consistency."
