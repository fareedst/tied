    scope_in:
      - "mcp-server/fixtures/client-formatter/**"
      - "mcp-server/README.md"
      - "mcp-server/src/checklist-yaml-styling-contract.test.ts"
      - "mcp-server/src/tools/index.ts (tied_client_yaml_styling_apply)"
      - "mcp-server/src/tools/yaml-client-styling-mcp.test.ts"
      - "mcp-server/src/yaml-client-formatter.test.ts"
      - "mcp-server/src/yaml-client-formatter.ts"
