      - expectation: "Deterministic post-hook bytes across repeated runs on canonical input"
        id: "FMT-STABLE-OUTPUT"
      - expectation: "Second hook pass leaves bytes unchanged"
        id: "FMT-IDEMPOTENT"
      - expectation: "Boolean, number, and null nodes remain semantically equal"
        id: "FMT-SCALAR-TYPES"
      - expectation: "Sequence order preserved per yaml_semantic_compare"
        id: "FMT-ORDERED-LISTS"
      - expectation: "Block-scalar bodies preserved for IMPL sidecar-like fixtures"
        id: "FMT-BLOCK-SCALARS"
      - expectation: "Post-hook lint/parse failure rejects with fail-closed error"
        id: "FMT-INVALID-YAML"
      - expectation: "yaml_semantic_compare non-zero exit rejects acceptance"
        id: "FMT-SEMANTIC-DRIFT"
      - expectation: "Paths outside tiedBasePath rejected before spawn"
        id: "FMT-PATH-ESCAPE"
      - expectation: "tied/methodology/** paths rejected before spawn"
        id: "FMT-METHODOLOGY-BLOCK"
      - expectation: "Malformed client_formatter mapping fails at resolve"
        id: "FMT-INVALID-CONFIG"
      - expectation: "Absent client_formatter preserves Slice 1 baseline behavior"
        id: "FMT-DISABLED-DEFAULT"
