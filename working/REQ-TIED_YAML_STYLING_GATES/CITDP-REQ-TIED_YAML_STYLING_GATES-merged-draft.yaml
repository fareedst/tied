  risk_analysis:
    adversarial_inquiry:
      assurance_profile: "baseline-functional"
      counterexamples:
        - "A future formatter changes scalar types or ordered-list semantics while preserving parseability."
        - "A hook preserves parseability but changes ordered-list or scalar-type semantics."
        - "A hook succeeds once but emits different bytes on a second pass, breaking idempotence assumptions."
        - "A malicious or misconfigured hook rewrites files outside project-owned ./tied/."
        - "Agents invoke a hook without repository declaration because MCP exposes an implicit default formatter."
        - "An agent treats an absent client_formatter as permission to choose an implicit formatter."
        - "Verification records pre-style bytes instead of the final post-style on-disk artifact."
      depth_tier: "minimal"
      disconfirming_observations:
        - "Checklist contract tests require post-style evidence at verification-gate, sync-tied-stack, and traceable-commit."
        - "Checklist contract tests require the styling sub-procedure to be called only from sub-yaml-edit-loop."
        - "Invalid client_formatter schema fails at resolve time without running the hook."
        - "not_configured path performs zero spawns."
        - "Path guard tests reject methodology paths and paths outside tiedBasePath."
        - "yaml_semantic_compare runs between pre-hook snapshot and post-hook bytes before acceptance."
      evidence_references:
        - "/Users/fareed/.cursor/plans/client_yaml_styling_gates_0fc380c5.plan.md"
        - "mcp-server/fixtures/client-formatter/"
        - "mcp-server/src/checklist-yaml-styling-contract.test.ts"
        - "mcp-server/src/tools/yaml-client-styling-mcp.test.ts"
        - "mcp-server/src/yaml-client-formatter.test.ts"
        - "scripts/yaml_semantic_compare.rb"
        - "tied/docs/agent-req-implementation-checklist.yaml"
      falsification_questions:
        - "Can a client formatter be invoked without a client declaration?"
        - "Can a hook change YAML meaning while passing syntax validation?"
        - "Can a second hook pass change bytes while still semantically equivalent?"
        - "Can post-style evidence be accepted before the final file is linted and consistency-checked?"
        - "Can semantic drift pass when post-hook YAML parses cleanly?"
        - "Can the hook run on tied/methodology/** when declared?"
      gate_policy: "advisory"
      prior_depth_tier: "minimal"
      profile_depth: "not_measured"
      rationale: "Checklist Slice 1 plus executable hook Slice 2; fixture matrix and static contract tests bound presentation seam risk at minimal depth."
      research_profile: "integrated-agent"
    risks:
      - description: "Agents treat optional client_formatter as implicit agent-chosen formatting."
        id: "RISK-STYLE-GATE-001"
        mitigation: "Explicit styling_status not_configured default; hook runs only when .tied-yaml.yaml declares client_formatter."
      - description: "Presentation hook changes YAML semantics."
        id: "RISK-STYLE-GATE-002"
        mitigation: "Require yaml_semantic_compare before acceptance; fail closed and return to owning step."
      - description: "Hook command executes arbitrary process declared in repository config."
        id: "RISK-STYLE-GATE-005"
        mitigation: "spawn with shell:false; cwd locked to client project root; argv from config only; timeout and output bounds; path allowlist under tiedBasePath excluding methodology."
      - description: "scalar_style validation breaks repositories that declare client_formatter only."
        id: "RISK-STYLE-GATE-006"
        mitigation: "When .tied-yaml.yaml exists, treat missing scalar_style as unwrapped default if client_formatter is present; reject unknown keys and malformed client_formatter mapping."
      - description: "MCP auto-invokes hook on every write, bypassing checklist evidence timing."
        id: "RISK-STYLE-GATE-007"
        mitigation: "Slice 2 exposes explicit tied_client_yaml_styling_apply; MCP writers remain baseline-canonical only until a future slice approves writer integration."
