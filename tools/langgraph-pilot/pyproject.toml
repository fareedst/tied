[project]
name = "tied-langgraph-pilot"
version = "0.1.0"
description = "Experimental LangGraph orchestration pilot for TIED MCP integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tied_langgraph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: optional live fixture client (LANGGRAPH_FIXTURE_CLIENT_ROOT)",
]
