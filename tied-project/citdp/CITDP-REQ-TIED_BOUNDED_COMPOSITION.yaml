CITDP-REQ-TIED_BOUNDED_COMPOSITION:
  change_definition:
    current_behavior: "Harness²-inspired bounded composition opportunities in docs/comparisons/tied-vs-harness2.md are Recommendation-only. The repository has no default-off pilot-budget schema, local trajectory manifest layout, read-only divergence analyzer, explicit lesson-draft distillation, advisory shadow comparison, or formalized injectable AgentDriver seam beyond partial agentstream/feature-orchestration wiring."
    desired_behavior: "Six opt-in, TIED-native modules under mcp-server/src/bounded-composition/ (and agentstream seam alignment) with token-commented IMPL sidecars, envelope artifact kinds, local raw trajectories under tied-bundle/working/{REQ-TOKEN}/trajectories/, compact manifests/reports in committed working roots, explicit draft-only Kaizen/experiment routing, advisory shadow reports with selection_authority none, and injectable client-owned AgentDriver contract—subordinate to checklist gates, tied_verify, and sponsor costly-choice authority."
    non_goals:
      - "Vendor or import Harness²; reproduce Harness² benchmark score claims as TIED outcomes"
      - "Ship OpenCode/Codex or other concrete external executor binaries in the methodology repo"
      - "Automatic IMPL/REQ mutation, LEAP from shadow/divergence tools, or gate authority for blind selection"
      - "Edit docs/comparisons/methodology-composition-matrix.md in this request"
      - "Live external subprocess proof in CI/E2E (operator smoke only)"
    success_criteria:
      - "SC-BC-BUDGET — pilot-budget.v1 validates k/mode/seed/namespace/ceilings/stop criteria; R=4k/P=3k documented as accounting formula only"
      - "SC-BC-TRAJ — trajectory manifest + local placement; no unrestricted prompt bodies in committed envelope"
      - "SC-BC-DIV — deterministic read-only divergence report; no finding-ledger or YAML writes"
      - "SC-BC-LESSON — draft-only feedback/vocab/experiment outputs; explicit operator bridge calls only"
      - "SC-BC-SHADOW — shadow-comparison.v1 advisory; selection_authority none; gate regression test"
      - "SC-BC-DRIVER — injectable AgentDriver seam; cursor/claude/dry_run unchanged; task-graph adapter composition green"
      - "SC-BC-CLOSE — binding inventory, integrated inquiry artifacts, envelope fail_on_error_gaps, tied_verify, tied_validate_consistency"
    unchanged_behavior:
      - "tied_checklist_gate_validate authority and fail-closed defaults when bounded tools not invoked"
      - "Existing agentstream cursor/claude/dry_run profiles and legacy feature-spec ordering"
      - "Methodology tied-bundle/ read-only in client installs"
      - "Verification-gated REQ/IMPL status via tied_verify only"
