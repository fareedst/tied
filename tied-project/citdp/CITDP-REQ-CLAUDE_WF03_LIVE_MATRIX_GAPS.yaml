change_definition:
  current_behavior: |
    After REQ-AGENTSTREAM_CLAUDE_WF_PARITY (b0c7e854) and REQ-WF_TRIAL_AGENTSTREAM_DISPOSABLE_TAG (ef1fe2db),
    a live Claude wf-03 matrix run (client 1793810114-wf-agentstream-wf-03-claude-claudehaiku55,
    MODEL_SLUG=claude-haiku-5-5) reaches GREEN product tests but fails machine close_out and reports
    tied-claude-client-validation.v1 ok:false (TIED_BASE_PATH missing in .mcp.json env).
    Preflight continues with DIAGNOSTIC only. Turn 4 gate reports malformed_citdp:adversarial_inquiry
    and hydration_envelope_gaps_missing despite pre_implementation allowed earlier in the same client.
  desired_behavior: |
    Disposable Claude wf-03 bootstrap passes canonical MCP JSON validation; matrix orchestrator can
    fail-closed on preflight when parity is the experiment goal; four-phase batch close-out turn uses
    tied_gate_check (inner CITDP) and produces envelope + tracker dispositions; Claude live driver
    keeps cwd on disposable client root; manual live run can match WF03_CURSOR_GOLD close_out fingerprint.
  non_goals:
    - Fixing LLM model capability when harness surface matches Cursor
    - Changing WF03_CURSOR_GOLD disposable contents
    - Default CI live dual-harness LLM runs
  success_criteria:
    - assertMcpJsonHarnessContract accepts TIED_CLIENT_PROJECT_PATH pointing at tied-project/ (legacy TIED_BASE_PATH optional)
    - workflow-trial-agentstream documents or enforces preflight ok when HARNESS=claude and WF_TRIAL_STRICT_PREFLIGHT=1
    - Four-phase close-out turn documents tied_gate_check + request_evidence_envelope_build sequence
    - Unit tests cover validation + orchestrator flag without live LLM
    - Manual re-run of wf-03 Claude cell achieves close_out allowed:true on disposable client (operator proof)
  unchanged_behavior: Cursor harness wf-03 path and fixture-gated agentstream CI remain green.
