CITDP-REQ-WF_TRIAL_MATRIX_CLAUDE_EFFORT_TIERS:
  change_definition:
    current_behavior: "Comparison matrix has 11 columns; Claude Sonnet/Haiku @high keys missing from manifest; toolsetKeyFromMasterRow falls back to baseline effort=low when @medium/@high column absent, mis-placing high/medium readouts (e.g. WF-10 Sonnet 1794411691 under effort=low)."
    desired_behavior: "13-column manifest with claudeEffortColumnSpecs() (low/medium/high × haiku + sonnet); @high columns in header row; medium/high rows map only to matching @ keys or omit cell; WF-10 and WF-09 high cells under effort=high headers."
  impact_analysis:
    modules_or_boundaries: "tools/bootstrap/lib/wf-trial-comparison-matrix.mjs; wf-trial-comparison-matrix.test.mjs; build-wf-trial-comparison-matrix.mjs; traditional-workflow-trial-runs-registry.md; PLAN-WF-TRIAL-COMPARISON-MATRIX/PLAN.md; tied-project/CHANGELOG.md"
    tied_tokens_new: []
  non_goals:
    - "Cursor MODEL_EFFORT @high columns"
    - "Registry-driven dynamic column insertion without manifest"
    - "Store REQ/ARCH/IMPL YAML promotion"
