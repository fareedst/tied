      gate_policy: "facilitator_doc_only"
    depth_tier: "minimal"
    gate_policy: "facilitator_doc_only"
    rationale: "Facilitator matrix manifest and pivot only; no product code."
    risk_assessment:
      depth_tier: "minimal"
      gate_policy: "facilitator_doc_only"
  success_criteria:
    - "Registry spot checks WF-09/10 @high columns"
    - "SC-WF-CMX-11, 22–26 in PLAN.md"
  test_strategy:
