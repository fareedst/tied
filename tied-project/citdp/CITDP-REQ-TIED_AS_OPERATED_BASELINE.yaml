CITDP-REQ-TIED_AS_OPERATED_BASELINE:
  change_definition:
    current_behavior: "Replacement Discovery Baseline (phases 0–7) exists as a generic runbook and store dogfood under DOC-TIED-RDB-ANALYSIS without a TIED REQ/PROC or checklist facet. VRAI (tied-project REQ/ARCH/IMPL) and as-operated reality are not machine-separated at composition or verification gates."
    desired_behavior: "Enroll [REQ-TIED_AS_OPERATED_BASELINE], [ARCH-TIED_AS_OPERATED_BASELINE], [IMPL-TIED_AS_OPERATED_BASELINE], and [PROC-TIED_AS_OPERATED_BASELINE] in tied-project/; checklist Tracker facet as_operated_baseline branches follow_up_only vs active; when active, validate Snapshot-A at composition-integration and Snapshot-B before verification-gate using RDB layout and registry minimums inherited from dogfood."
    non_goals:
      - "Dedicated RDB MCP authoring tools in v1"
      - "Promoting RDB CAP/CON rows into REQ indexes without BFIE sponsor elevation"
      - "Replacing EDPC or BFIE ledgers with duplicate registry copies"
      - "Runbook phases 8–11 or artifacts 10–13 as satisfaction criteria"
    success_criteria:
      - "SC-AOB-ENROLL — REQ/ARCH/IMPL/PROC enrolled with runbook and checklist gate cross-links"
      - "SC-AOB-MODE — facet mode follow_up_only default; active enforces snapshots"
      - "SC-AOB-NO-PHASE-8-11 — REQ/PROC text forbids replacement-program completion"
      - "SC-AOB-SNAPSHOT-COMPOSITION — Snapshot-A minimums gate composition-integration when active"
      - "SC-AOB-SNAPSHOT-PREVERIFY — Snapshot-B (G-0–G-7, G-9) gates verification-gate when active"
      - "SC-AOB-VALIDATOR — checklist-validator unit tests for both modes and both slugs"
      - "SC-AOB-VRAI-BOUNDARY — documented separation; BFIE report_only default on RDB dispositions"
    unchanged_behavior:
      - "[REQ-TIED_BROWNFIELD_INTENT_ELEVATION] elevation semantics"
      - "[REQ-TIED_CHECKLIST_GATE_ENFORCEMENT] advisory gate_policy unless sponsor tightens"
      - "Generic runbook v1.0 body under docs/methodologies/ (not overwritten by PROC prose)"
  completion_criteria:
