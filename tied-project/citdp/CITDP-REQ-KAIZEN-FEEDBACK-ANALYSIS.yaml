CITDP-REQ-KAIZEN-FEEDBACK-ANALYSIS:
  change_definition:
    current_behavior: "Feedback entries append locally via capture and operational adapters with promotion grouping helpers, but there is no deterministic read-only digest projection with denominators, cohort compatibility, or versioned feedback-analysis.v1 export for human review.\n"
    desired_behavior: "A feedback-analysis module loads entries read-only, selects compatible cohorts by compatibility_key and denominator_fingerprint, groups duplicates for recurrence, computes named numerators and denominators with explicit unknown and excluded counts, cites promotion_status and LEAP status from existing boundaries, and emits a stable-projection digest plus optional Markdown briefing without mutating feedback.yaml or project TIED YAML.\n"
    non_goals:
      - "Canonical REQ/ARCH/IMPL writes from analysis"
      - "Outcome loop baselines (Phase 6)"
      - "Review bridge or automatic LEAP proposal creation (Phase 5)"
      - "Universal scoring or hidden rate without denominators"
    success_criteria:
      - "Digest schema_version feedback-analysis.v1 matches linked plan contract"
      - "Golden fixtures pass for recurrence, denominator mismatch, missing evidence, incompatible cohorts, empty window, identical rerun identity"
      - "Immutability tests prove feedback store unchanged after digest build"
    unchanged_behavior:
      - "groupDuplicateFeedback and createReviewedLeapProposal review boundary"
      - "No upstream transport (Phase 3 deferred)"
      - "Phase 1–2 capture and normalization contracts"
      - "tied_feedback_add, tied_feedback_capture_observation, tied_feedback_export"
  completion_criteria:
    activation:
      phase: "pre_implementation"
      request_token: "REQ-KAIZEN-FEEDBACK-ANALYSIS"
      run_id: "kaizen-p4-preimpl-20261007"
    focused_tests: "feedback-analysis.test.ts"
    lint: "npx tsc -b in mcp-server"
    persist_policy: "Persist to tied-project/citdp/ at close-out after build-plan"
    verification: "tied_validate_consistency; integrated close_out gates after build-plan"
  impact_analysis:
    depends_on:
      - "REQ-FEEDBACK_TO_TIED"
      - "REQ-KAIZEN-OBSERVATION-CAPTURE"
      - "REQ-KAIZEN-SOURCE-NORMALIZATION"
      - "REQ-TIED_OPERATIONAL_FEEDBACK_PROMOTION"
    files:
      - "mcp-server/src/feedback-analysis.test.ts (proposed)"
      - "mcp-server/src/feedback-analysis.ts (proposed)"
      - "mcp-server/src/feedback-promotion.ts (status cite only)"
      - "mcp-server/src/feedback.ts (read-only consumer)"
      - "mcp-server/test/fixtures/kaizen-feedback-analysis/ (proposed)"
    modules:
      - "feedback (read load path)"
      - "feedback-analysis (proposed)"
      - "feedback-promotion (read-only status helpers)"
    tags:
