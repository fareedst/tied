CITDP-PLAN-TIED-QMM-W4-IMPLEMENT:
  change_definition:
    current_behavior: >-
      Evidence-chain statistics report CLI and tests exist; QMM W4 lacks reconciled demonstrations, working evidence,
      and wave close-out under the program envelope.
    desired_behavior: >-
      W4 implement pass reconciles `[REQ-EVIDENCE_CHAIN_REPORT]` stack against the child plan, runs existing and
      gap-closing tests, produces deterministic v1/v2 cohort readouts with privacy proof, and closes with
      verification/close_out gates without minting a new report REQ.
    non_goals:
      - Mint duplicate REQ/ARCH/IMPL report tokens
      - Live client discovery or repository traversal
      - Project YAML mutation, finding-ledger append, case promotion
      - Maturity score, universal ranking, SPC/DORA, derived-value averaging
      - shareable_hashed export without named owner and expiry
      - tied-bundle methodology edits
    success_criteria:
      - Unit and CLI tests for evidence-chain-report pass; gaps fixed only with LEAP-aligned TIED updates
      - W4 demonstration matrix evidenced under working/PLAN-TIED-QMM-W4-EVIDENCE-CHAIN-REPORT/evidence/
      - operator_local outputs show basenames only; Markdown matches authoritative YAML
      - tied_verify and tied_validate_consistency pass when project TIED touched
      - Orchestrator W4 implement_status complete with wave close-out receipts
    unchanged_behavior: Profile generation, W1 experiment MCP, W2/W3 deliverables, and opt-in metrics remain independent.
  impact_analysis:
    depends_on:
      - REQ-EVIDENCE_CHAIN_REPORT
      - REQ-METHODOLOGY-LEARNING-EXPERIMENT
    files:
      - mcp-server/src/fidelity-research/evidence-chain-report.ts
      - mcp-server/src/cli/evidence-chain-report.ts
      - mcp-server/src/fidelity-research/evidence-chain-report.test.ts
      - mcp-server/src/fidelity-research/evidence-chain-report.cli.test.ts
      - tied-project/working/evidence-chain/
      - tied-project/working/evaluation/
    tied_tokens_affected:
      - REQ-EVIDENCE_CHAIN_REPORT
      - ARCH-EVIDENCE_CHAIN_REPORT
      - IMPL-EVIDENCE_CHAIN_REPORT
    tied_tokens_new: []
  record_identity:
