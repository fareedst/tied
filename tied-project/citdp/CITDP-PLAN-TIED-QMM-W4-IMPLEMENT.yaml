    change_request_id: PLAN-TIED-QMM-W4-EVIDENCE-CHAIN-REPORT
    date: '2026-10-10'
    depth_tier: integrated
    gate_policy: per_citdp
    implementation_depth_tier: integrated
    prior_depth_tier: minimal
    profile_depth: integrated
    record_status: complete
    title: QMM W4 evidence-chain cohort readouts implement
  risk_analysis:
    abuse_cases:
      - malformed-oversized-input
      - path-traversal-file-access
      - secret-sensitive-data
    adversarial_inquiry:
      assurance_profile: baseline-functional
      counterexamples:
        - Absolute client paths leak into default operator_local report output.
        - Incompatible cohorts rolled up because denominator fingerprints differ.
        - Missing or malformed profile inputs coerced to zero counts.
        - Plan-only gate receipt reused as W4 implement activation.
      depth_tier: integrated
      disconfirming_observations:
        - Generated Markdown contains statistics absent from authoritative YAML.
        - strict mode writes outputs when any input is rejected.
        - Intent TIED YAML mutated by report CLI.
      eligibility_triggers_matched:
        - external_input
        - cli_boundary
      evidence_references:
        - docs/tied-qmm-w4-evidence-chain-report-plan.md
        - tied-project/working/PLAN-TIED-QMM-METHODOLOGY-LEARNING/evidence/sponsor-authority-w4-implement-20261010.md
        - tied-project/citdp/CITDP-REQ-EVIDENCE_CHAIN_REPORT.yaml
      falsification_questions:
        - Does default output ever include absolute filesystem paths?
        - Do v2 subcohorts ever merge incompatible denominator fingerprints?
        - Are W1–W3 receipts cited as W4 activation evidence?
      gate_policy: per_citdp
      prior_depth_tier: minimal
      rationale: >-
        CLI reads external profile artifacts and manifests; path privacy and malformed-input handling are
        security-adjacent.
      research_profile: integrated-agent
      strict_eligibility_prerequisites: []
      sub_adversarial_inquiry_pass: completed
    quality_profiles:
      - baseline-functional
      - external-input-security
    risks:
