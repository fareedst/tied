CITDP-REQ-TIED_CONTEXT_ADAPTIVE_ENGINEERING:
  change_definition:
    current_behavior: "TIED enforces a fixed [PROC-AGENT_REQ_CHECKLIST], CITDP, REQ→ARCH→IMPL, TDD order, gates, and request-evidence envelope. The CASE research proposal (docs/methodologies/context-adaptive-software-engineering.md) describes practice contracts and rule-based selection but there is no versioned practice library, context profile, deterministic selector, reassessment receipts, or method-effectiveness readout integrated with existing MCP tools. EASAR recovery ([REQ-TIED_EASAR_RECOVERY]) runs as a fixed Mode C orchestration without an optional rule-selected practice overlay."
    desired_behavior: "Optional, opt-in context-adaptive layer: 5–8 seed practice contracts mapped to existing TIED procedures/tools; context-profile.v1 with explicit UNKNOWN handling; deterministic selection-receipt.v1; reassessment-receipt.v1 that routes changed risk through existing CITDP/gate/LEAP paths; evaluation-link adapter to methodology-learning and conformance–effectiveness pairing. MCP tools remain read-only/deterministic by default and do not mutate project TIED YAML or checklist status. First dogfood: Condition B vs fixed baseline on comparable EASAR recovery slices using existing receipts—not a parallel recovery runtime."
    non_goals:
      - "AI-generated or unrestricted method selection/override"
      - "Default checklist activation or normative gate/assurance-profile behavior changes in v1"
      - "Full OMG Essence compliance or 10–15+ practice catalog"
      - "LangGraph or other orchestration framework as runtime dependency"
      - "Portable EASAR export (Slice 6) bundled into this REQ"
      - "Replacing TIED as center of gravity or claiming methodology-composition-matrix behavioral equivalence"
      - "Universal 0–100 grade, SPC/control charts, CMMI maturity claims, DORA product metrics as blocking scores"
    success_criteria:
      - "SC-CAE-CONTRACTS — closed practice-contract.v1 library (5–8) with TIED PROC/tool bindings and proof boundaries; loader/validator tests green"
      - "SC-CAE-DOGFOOD — EASAR baseline vs rule-selected pilot records + method-effectiveness readout without causal improvement claim"
      - "SC-CAE-MCP — composition tests before thin MCP wrappers; no silent TIED YAML or checklist mutation"
      - "SC-CAE-PROFILE — context-profile.v1 validator/normalizer; UNKNOWN criticality never downgraded to LOW in selection"
      - "SC-CAE-REASSESS — immutable prior snapshots; auditable delta and explicit loop-back action"
      - "SC-CAE-REGRESS — existing EASAR/gate/envelope/quality/methodology-learning suites remain green"
      - "SC-CAE-SELECT — identical inputs → identical selection-receipt.v1; hard constraints dominate preferences"
    unchanged_behavior:
      - "[REQ-TIED_EASAR_RECOVERY] receipt builders and PROC sequence when engagement is easar_full without CASE overlay"
      - "Mandatory checklist steps and gate fail-closed defaults when selector is not invoked"
      - "Methodology read-only tied-bundle/ boundary"
      - "Verification-gated status via tied_verify only"
