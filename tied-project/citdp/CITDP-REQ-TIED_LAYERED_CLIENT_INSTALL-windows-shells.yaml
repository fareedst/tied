CITDP-REQ-TIED_LAYERED_CLIENT_INSTALL-windows-shells:
  change_definition:
    current_behavior: "Linked install reachable from Git Bash and CMD; no PowerShell shims; install-layers legacy hard-codes copy_files.sh on Windows."
    desired_behavior: "Three install surfaces (.sh / .cmd / .ps1) delegate to tied-install-dispatch.mjs; full .ps1 shim suite mirrors .cmd; Windows smoke covers linked install and factory."
    non_goals:
      - "Porting build-commands.sh to PowerShell"
      - "Script signing or changing layer semantics"
    success_criteria:
      - "tied-install-dispatch and windows-shims tests pass in test-bootstrap-layered-install"
      - "windows-bootstrap-smoke.cmd phases 4-5 and pwsh tied-install.ps1 step green"
