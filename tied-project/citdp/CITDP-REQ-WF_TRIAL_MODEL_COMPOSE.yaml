CITDP-REQ-WF_TRIAL_MODEL_COMPOSE:
  title: "WF trial compose family + effort CLI"
  metadata:
    created:
      author: "refine-plan"
      date: "2026-11-10"
  related_tokens:
    - "REQ-WF_TRIAL_MODEL_CATALOG_RESOLVE"
    - "REQ-WF_TRIAL_MODEL_EFFORT"
    - "REQ-WF_TRIAL_MODEL_SPEC_CLI"
    - "REQ-WF_TRIAL_MODEL_COMPOSE"
  current_behavior: |
    workflow_trial_range accepts tier-embedded MODEL_REF (luna-low, gpt-5.6-luna-low-fast) and a separate EFFORT positional.
    Operators can specify contradictory tiers (slug low + effort medium).
    Usage examples show gpt-5.6-luna-low-fast with medium effort.
  desired_behavior: |
    Compose families (luna, grok47, sol) build gpt-*-{effort}-fast from MODEL_REF + EFFORT.
    Tiered matrix ids remain for legacy with EFFORT=- only, or effort must match embedded tier.
    Fail closed on tier mismatch with hint to use family + effort.
  change_definition:
    success_criteria:
      - "SC-COMPOSE-LUNA"
      - "SC-COMPOSE-CONFLICT"
      - "SC-COMPOSE-LEGACY"
      - "SC-COMPOSE-USAGE"
  satisfaction_criteria:
    - "SC-COMPOSE-LUNA"
    - "SC-COMPOSE-CONFLICT"
    - "SC-COMPOSE-LEGACY"
    - "SC-COMPOSE-GROK47"
    - "SC-COMPOSE-USAGE"
  risk_assessment:
    - risk: "Breaking luna-low plus non-matching effort scripts"
      reversibility: "reversible"
      mitigation: "PLAN migration; error message names compose form"
    - risk: "Catalog missing composed slug after agent models change"
      reversibility: "reversible"
      mitigation: "Catalog gate + sync-wf-trial-model-catalog.mjs"
  test_strategy:
    unit:
      - "tools/bootstrap/lib/wf-trial-model-compose.test.mjs"
      - "tools/bootstrap/lib/wf-trial-model-spec.test.mjs"
    composition:
      - "tools/bootstrap/workflow-trial-agentstream-sh.test.mjs"
