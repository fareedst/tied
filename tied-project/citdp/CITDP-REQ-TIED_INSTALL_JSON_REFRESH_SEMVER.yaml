CITDP-REQ-TIED_INSTALL_JSON_REFRESH_SEMVER:
  change_definition:
    current_behavior: "tied-install --refresh ends with writeInstallManifest but only sets tied_version from client AGENTS.md before store; store_methodology_version is never written. resolveTiedMethodologyVersion and server_info walk client root VERSION before install.json, so greenfield create-if-absent VERSION freezes an old semver after store bumps."
    desired_behavior: "Every install/refresh writes store_methodology_version (and aligned tied_version/installer_version) from store VERSION or store AGENTS.md. MCP and CLI resolvers prefer install.json pin over client root VERSION. server_info extensions.tied.methodology agrees with refresh witness on clients."
    non_goals:
      - "Methodology release version bump by itself"
      - "Overwrite client root VERSION on refresh"
    success_criteria:
      - "SC-IJRS-MANIFEST, SC-IJRS-RESOLVER pass per working test-strategy.md"
    unchanged_behavior: "Store mode without client install.json still resolves from store VERSION walk. linked/full layer orchestration unchanged aside from manifest fields."
  evidence:
    command_seq:
      - "node --test tools/bootstrap/lib/store-methodology-version.test.mjs"
      - "cd mcp-server && npm test -- tied-methodology-version.test.ts"
  impact_analysis:
    impl_inventory:
      - "IMPL-TIED_INSTALL_JSON_REFRESH_SEMVER"
    modules_or_boundaries: "tools/bootstrap/lib/install-layers-core.mjs; store-methodology-version.mjs; mcp-server/src/tied-methodology-version.ts; scripts/lib/read-tied-methodology-version.mjs"
    tied_tokens_affected:
      - "REQ-TIED_CLIENT_OPERATOR_TOOLING"
      - "REQ-TIED_LAYERED_CLIENT_INSTALL"
      - "REQ-TIED_TWO_FOLDER_LAYOUT"
    tied_tokens_new:
      - "ARCH-TIED_INSTALL_JSON_REFRESH_SEMVER"
      - "IMPL-TIED_INSTALL_JSON_REFRESH_SEMVER"
      - "REQ-TIED_INSTALL_JSON_REFRESH_SEMVER"
  record_status: "implemented"
  request_token: "REQ-TIED_INSTALL_JSON_REFRESH_SEMVER"
  risk_analysis:
    adversarial_inquiry:
      assurance_profile: "baseline-functional"
      counterexamples:
        - "Client VERSION newer than store pin — wrong semver if install.json ignored"
        - "Refresh updates bundle indexes but manifest pin left stale — server_info still old"
      depth_tier: "minimal"
      disconfirming_observations:
        - "Operator refresh with jq shows matching store_methodology_version and server_info"
      evidence_references:
        - "tied-project/working/REQ-TIED_INSTALL_JSON_REFRESH_SEMVER/evidence/not-applicable-receipt.v1.json"
