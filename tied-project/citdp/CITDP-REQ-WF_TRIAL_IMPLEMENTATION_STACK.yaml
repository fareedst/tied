  non_goals:
    - "Changing chainFromPrevious or four-turn skill names"
    - "Locking product ambiguity (WF-02 duplicate policy, WF-07 null semantics)"
    - "Mandatory stack on manual test-new-tied-client without orchestrator"
    - "Vitest or Python as alternate matrix runners in v1"
  success_criteria:
    - "Orchestrated wf-03 disposable has package.json + preload language TypeScript before turn 1"
    - "SC-WF-STACK-SEED through SC-WF-STACK-TEST in REQ detail (authored at build-plan)"
  unchanged_behavior: "materialize_disposable_preload_contract for non-WF paths; gold clients; methodology YAML read-only\nin clients; four-phase handoff and process log behavior unchanged.\n"
