CITDP-REQ-TIED_PROCESS_CERTIFICATION_READINESS:
  change_definition:
    current_behavior: "The certification study (docs/methodologies/certification-of-workflows.md) recommends an EDSE certifiability path (stages 1–5, 7) but the repository has no versioned EDSE process specification, 12207/330xx-style assessment artifacts, executable clause conformance, independent assessor agreement tooling, or adaptive-effectiveness harness bound to existing TIED evidence. [REQ-TIED_CONTEXT_ADAPTIVE_ENGINEERING] ships CASE practice selection and receipts; it does not evaluate EDSE-001…007 clause conformance or produce assessor-ready readiness packs."
    desired_behavior: "Read-only **process certification readiness** layer: pinned bundle resources (EDSE spec, 12207 mapping, 330xx-style capability model, conformance catalog); deterministic evaluation of EDSE-001…007; seven-dimension capability profiles without aggregate scores; independent assessor validation and agreement reports; bounded fixed/rule-selected/adaptive experiment harness with held-out provenance; composed certifiability-readiness.v1 and assessor-pack.v1 outputs wired into request-evidence-envelope discovery. Stages 6 and 8 documented as future human-owned external appraisal—no `certified` or ISO/CMMI compliance claims."
    non_goals:
      - "Aggregate maturity or universal 0–100 readiness scores"
      - "Copying ISO/IEC standard text or asserting 12207/330xx compliance from reference mappings alone"
      - "Mutating project TIED YAML, checklist step authority, or normative CASE selector behavior"
      - "Replacing [REQ-TIED_CONTEXT_ADAPTIVE_ENGINEERING] selector or EASAR recovery runtime"
      - "Third-party certification, accredited scheme operation, or organizational ISO 9001/42001 certification"
      - "UI/E2E for assessor workflows (callable MCP/CLI + composition tests only)"
    success_criteria:
      - "SC-PCR-ADAPT — three-arm experiment fixtures: perturbation changes selection receipt; held-out retains provenance; no superiority claim"
      - "SC-PCR-CAP — seven dimensions reported separately with proof boundaries"
      - "SC-PCR-COMPOSE — readiness aggregates CASE/gate/envelope/quality/adversarial evidence read-only; MCP + CLI + envelope types registered"
      - "SC-PCR-CONF — conformance matrix deterministic; catalog links every clause to validator + evidence kind + TIED surface"
      - "SC-PCR-HANDOFF — assessor pack + study status update; stages 6/8 explicitly future/external"
      - "SC-PCR-IND — independence failures and assessor disagreement paths covered by fixtures"
      - "SC-PCR-MAP — 12207 and capability model resources validate; reference_mapping_only and no forbidden score fields"
      - "SC-PCR-SPEC — edse-process-spec.v1 pinned with EDSE-001…007; loader rejects malformed/duplicate/stale clauses"
    unchanged_behavior:
      - "CASE selector advisory-only authority ([PROC-CONTEXT_ADAPTIVE_PRACTICE])"
      - "Mandatory checklist gates and fail-closed defaults when readiness tools are not invoked"
      - "Methodology read-only tied-bundle/ boundary in client installs (store repo authors under tied-bundle/resources/)"
      - "Verification-gated REQ/IMPL status via tied_verify only"
  completion_criteria:
    activation:
      phase: "verification"
      request_token: "REQ-TIED_PROCESS_CERTIFICATION_READINESS"
      run_id: "pcr-verify-20261018"
    envelope_blocking: "fail_on_error_gaps true at plan-close-out"
