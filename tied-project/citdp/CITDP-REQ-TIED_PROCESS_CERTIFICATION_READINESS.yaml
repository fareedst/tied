    focused_tests: "mcp-server/src/process-certification-readiness/**/*.test.ts; process-certification*.mcp.test.ts"
    lint: "npm run lint:ts --prefix mcp-server"
    verification: "tied_validate_consistency; tied_checklist_gate_validate pre_implementation|verification|close_out"
  evidence:
