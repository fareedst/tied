CITDP-REQ-KAIZEN-REVIEW-BRIDGE:
  change_definition:
    current_behavior: "Phase 4 emits feedback-analysis.v1 digests with findings keyed by observation_group (duplicate_group) and cites promotion_status read-only. createReviewedLeapProposal exists on operational entries but no module links digest findings to entry ids and orchestrates reviewed handoff with stale-evidence and canonical-write guards.\n"
    desired_behavior: "A review-bridge module resolves digest findings to existing feedback entry ids, validates review decisions and optional projection_hash freshness, delegates approved paths to createReviewedLeapProposal on the existing LEAP proposal queue, returns proposal_link and promotion status, and rejects canonical YAML write attempts without a second promotion queue.\n"
    non_goals:
      - "Automatic canonical REQ/ARCH/IMPL YAML writes from review"
      - "Outcome loop baselines (Phase 6)"
      - "Second promotion mechanism or parallel queue"
      - "Upstream transport (Phase 3 closed)"
    success_criteria:
      - "Bridge reuses ARCH-TIED_FEEDBACK_PROMOTION_BOUNDARY; no duplicate queue"
      - "Golden fixtures pass for review required, reject, approve, canonical-write attempt, stale evidence, and proposal link"
      - "Immutability tests prove feedback.yaml and tied-project YAML unchanged after bridge operations"
    unchanged_behavior:
      - "buildFeedbackDigest read-only digest projection (Phase 4)"
      - "createReviewedLeapProposal and reportPromotionStatus in feedback-promotion.ts"
      - "leap-proposals queue lifecycle (single queue)"
      - "Phase 3 transport deferred; local append and export only"
  completion_criteria:
