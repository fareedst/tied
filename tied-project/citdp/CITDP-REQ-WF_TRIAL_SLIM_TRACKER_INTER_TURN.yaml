citdp:
  change_definition:
    in_scope:
      - "Interleaved four-phase agentstream shell driver with post-turn-1 slim tracker reconcile"
      - "LEAP SC-WF-CLP-05 inter-turn wording"
      - "WF trial turn-1 batch + add-feature tracker adjunct"
      - "wf-trial-tracker-shape.mjs and bootstrap tests SC-WF-IST-01..04"
    out_of_scope:
      - "Auto-repair execution_evidence.completed slugs on disposable clients"
      - "MCP verification gate adversarial field policy changes"
      - "WF-METER-01 orchestrator path unless trivially shared"
    summary: "After turn 1 of workflow_trial_agentstream, replace malformed disposable checklist trackers with the slim template before turns 2-4 so tied_checklist_gate_validate does not fail with malformed_tracker:steps."
  prompt_type: "refine-plan"
  request_token: "REQ-WF_TRIAL_SLIM_TRACKER_INTER_TURN"
  risk_assessment:
    gate_policy: "advisory"
    mitigations:
      - "Abort later turns on non-zero agentstream exit"
      - "Backup agent tracker to evidence before replace"
      - "WF_TRIAL_SKIP_INTERLEAVED_TRACKER_SEED escape hatch"
    profile_depth: "minimal"
    risks:
      - "Four agentstream starts increase wall-clock and session fragility"
      - "Reconcile overwrites valid sponsor-custom slim trackers if shape check too loose"
      - "Resume session_id parse fails mid-batch"
  status: "draft"
  test_strategy:
    cases:
      - "interleaved hook runs between order 1 and 2"
      - "legacy wrapper fixture classifies invalid"
      - "reconcile seeds slim and writes backup"
      - "skip env restores monolithic batch"
    command: "node --test tools/bootstrap/lib/wf-trial-tracker-shape.test.mjs && node --test tools/bootstrap/workflow-trial-agentstream-sh.test.mjs"
    framework: "node:test"
    red_phase: "deferred to build-plan"
