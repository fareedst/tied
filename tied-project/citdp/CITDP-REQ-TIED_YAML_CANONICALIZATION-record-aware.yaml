CITDP-REQ-TIED_YAML_CANONICALIZATION-record-aware:
  change_definition:
    current_behavior: "The shared typed canonicalizer (mcp-server/src/yaml-canonicalizer.ts) sets string_list_rule to \"sort all-string lists except ordered-list keys\" and preserves object-list and mixed-list order (see canonicalizeValue list branch). No record-list registry exists. The Ruby yaml_list_sorter --sort-lists path sorts any 2+ consecutive '- ' lines by full line text (scripts/yaml_list_sorter.rb), which can reorder single-line satisfaction_criteria items but detaches multi-line record blocks. Post-sort validation sets unordered_arrays: groups_modified.positive? (yaml_list_sorter.rb validate_sorted_content!), masking intentional record reordering. REQ index/detail drift confirmed: index status Implemented with 6 satisfaction_criteria vs detail status Planned with 7 criteria including compatibility sorting criterion; index criterion 3 uses \"recursive lexical map ordering\" vs detail case-insensitive-primary wording."
    requested_change: "Extend tied-yaml-canonical-v1 with an explicit recognized record-list registry. Sort complete mapping records (including optional fields) by the first configured stable field present across all items, using case-insensitive-primary ordering with original-value and canonical-record tie-breaks. Apply the same policy in TypeScript default canonicalization and Ruby --sort-lists. Fix semantic-compare validation so recognized record-list sorts are accepted without false-green masking of unrelated array drift."
    scope_in:
      - "ARCH-TIED_YAML_CANONICAL_PROFILE record-list registry and revised list-ordering decision"
      - "CHANGELOG.md"
      - "IMPL-TIED_YAML_CANONICALIZER pseudo-code blocks RECOGNIZE_RECORD_LIST, SORT_RECORD_LIST, CANONICALIZE_YAML_VALUE extension"
      - "mcp-server/src/yaml-canonicalizer.ts and yaml-canonicalizer.test.ts"
      - "REQ-TIED_YAML_CANONICALIZATION satisfaction_criteria LEAP update and index/detail drift resolution"
      - "scripts/yaml_list_sorter.rb, yaml_list_sorter_test.rb (YamlSemanticCompare cases), yaml_semantic_compare.rb"
      - "scripts/yaml_tool.sh help text for default vs --sort-lists record-list behavior"
      - "tied/docs/detail-files-schema.md, tied/docs/processes.md"
      - "tied/vocab/tied-methodology.md, tied/vocab/tied-yaml-mcp.md"
    scope_out:
      - "Automatic client_formatter hook integration (REQ-TIED_YAML_STYLING_GATES slice2)"
      - "Changing ordered-list key semantics (order, order_*, *_order, *_order_*)"
      - "Changing scalar-type preservation, opaque text, or atomic failure behavior"
      - "Sorting arbitrary unregistered mapping arrays"
      - "tied/methodology/** edits"
      - "Unrelated working-tree changes"
    target_behavior: "Default lint and MCP writes sort recognized record lists deterministically while preserving unrecognized object lists, mixed lists, and ordered-list keys. Ruby --sort-lists performs whole-block record sorting aligned with TypeScript. Semantic validation accepts recognized record-list reordering and still rejects true semantic drift."
  completion_criteria:
    - "IMPL pseudo-code blocks pass pseudocode_validate with token comments on every new/changed block"
    - "Index and detail REQ-TIED_YAML_CANONICALIZATION status, satisfaction_criteria count (6 vs 7), and criterion 3 wording aligned before record-list criterion added"
    - "lint_yaml on changed TIED YAML; tied_validate_consistency ok"
    - "Persist merged CITDP to tied/citdp/ at close-out"
    - "Record-list registry documented in ARCH and detail-files-schema.md"
    - "RED/GREEN tests pass for TS, Ruby, and yaml_tool paths including single-line and multi-line fixtures"
  impact_analysis:
