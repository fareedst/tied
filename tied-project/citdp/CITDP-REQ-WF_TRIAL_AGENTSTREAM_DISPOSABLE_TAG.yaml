change_definition:
  current_behavior: |
    workflow-trial-agentstream bootstraps disposable clients with --tag wf-agentstream-{wf-id}
    only (e.g. 1793760220-wf-agentstream-wf-03). Harness (cursor vs claude) and model bucket
    (MODEL_CONFIG) are not encoded in the directory name, so parallel matrix cells can collide
    under TIED_TEST_ROOT and are hard to correlate with facilitator readouts.
  desired_behavior: |
    Default bootstrap tag is wf-agentstream-{wf-id}-{harness}-{modelBucket} where modelBucket
    is derived from MODEL_CONFIG (fallback MODEL_SLUG): lowercase, strip dots and hyphens
    (composer-2.5 -> composer25). Full client id: {epoch}-{tag}. --workspace bypass unchanged.
    workflow_trial_agentstream in build-commands.sh remains a delegator; tag logic lives in
    workflow-trial-agentstream.sh and scripts/lib/wf-trial-disposable-tag.inc.sh.
  non_goals:
    - Renaming or migrating existing gold/disposable clients on disk
    - Changing validateDisposableTag rules in new-tied-client.mjs
    - Per-record model fields in feature-spec batch YAML
  success_criteria:
    - build_wf_trial_disposable_tag produces wf-agentstream-wf-03-cursor-composer25 for defaults
    - HARNESS=claude with same MODEL_CONFIG yields distinct tag suffix vs cursor
    - Tag passes DISPOSABLE_TAG_PATTERN (letters, digits, hyphens)
    - workflow-trial-agentstream-sh.test.mjs covers tag helper cases
  unchanged_behavior: |
    Gold path WF03_GOLD_CLIENT (1793760220-wf-agentstream-wf-03) and dual-harness smoke default
    unchanged; manual --workspace skips bootstrap tag.
