CITDP-REQ-MCP-SERVER-INFO:
  change_definition:
    current_behavior: "Agents rely on ad-hoc `tied_config_get_base_path` and `tied_config_report` for preflight; no versioned machine-readable server identity, compatibility, or health snapshot; MCP tools return text JSON only without `structuredContent` or `outputSchema`."
    desired_behavior: "Read-only `server_info` MCP tool returns server_info response contract v1 with `structuredContent` and mirrored text JSON; reusable `server-info` module wired on tied-yaml stdio; core profile always registers tool for agent preflight."
    non_goals:
      - "`server_diagnostics` tool or full `tied_validate_consistency` on each call"
      - "Automatic agentstream preflight invoking `server_info`"
      - "Deprecating `tied_config_get_base_path` or `tied_config_report`"
      - "Migrating all MCP tools to `structuredContent`"
    success_criteria:
      - "`cd mcp-server && npm test` passes"
      - "`server_info` registered in core tool profile and returns schema-valid v1 payload"
      - "`supported_operations` lists read, validate, write, verify"
      - "`tied_validate_consistency` passes after REQ/ARCH/IMPL on disk"
      - "Configuration section never exposes secrets catalog values"
      - "Health distinguishes corpus missing vs introspection degraded"
    unchanged_behavior:
      - "Existing config and path MCP tools"
      - "Project YAML write isolation and identity binding rules"
      - "Tool profile opt-in split semantics"
  completion_criteria:
    activation:
      phase: "verification"
      request_token: "REQ-MCP_SERVER_INFO"
    focused_tests: "mcp-server/src/server-info/server-info.test.ts; npm test --prefix mcp-server"
    lint: "cd mcp-server && npm test"
    persist_policy: "persist CITDP to tied-project/citdp/ on close-out"
    verification: "tied_validate_consistency; tied_verify when gated"
  impact_analysis:
    audited_project_mutation: "mcp-server server-info module; tools/index registration; types.ts; index.ts startup metadata; contracts/; TIED tokens; vocab tied-yaml-mcp.md; README"
    files:
      - "mcp-server/contracts/server_info/"
      - "mcp-server/README.md"
      - "mcp-server/src/index.ts"
      - "mcp-server/src/server-info/"
      - "mcp-server/src/tools/index.ts"
      - "mcp-server/src/types.ts"
      - "tied-project/architecture-decisions.yaml"
      - "tied-project/implementation-decisions.yaml"
      - "tied-project/requirements.yaml"
      - "tied-project/semantic-tokens.yaml"
      - "tied-project/vocab/tied-yaml-mcp.md"
    modules:
      - "mcp_structured_tool_result"
      - "server_info_builder"
      - "server_info_mcp_handler"
    tags:
      - "agent-preflight"
      - "mcp-introspection"
  record_identity:
    author: "refine-plan"
    batch: "mcp-server-info-v1"
    change_request_id: "REQ-MCP_SERVER_INFO"
    date: "2026-11-06"
    record_status: "open"
    title: "MCP server_info read-only introspection tool"
  risk_analysis:
    adversarial_inquiry:
      assurance_profile: "baseline-functional"
      counterexamples:
        - "Health reports ready when writable corpus is missing"
        - "server_info leaks JEV_API_KEY or connection strings"
      depth_tier: "minimal"
      disconfirming_observations:
        - "Corpus missing yields unavailable health state"
        - "Redaction test asserts no secret keys in snapshot JSON"
      evidence_references:
        - "tied-project/working/REQ-MCP-SERVER-INFO/evidence/not-applicable-receipt.v1.json"
      falsification_questions:
        - "Does configuration mapping ever include secrets catalog values?"
      gate_policy: "advisory"
      prior_depth_tier: null
    risks:
      - description: "Accidental secret leakage via config report mapping."
        id: "RISK-SI-003"
        likelihood: "Low"
        mitigation: "Dedicated configuration mapper; redaction tests with JEV_API_KEY set."
        severity: "High"
      - description: "Health checks duplicate expensive validation."
        id: "RISK-SI-002"
        likelihood: "Low"
        mitigation: "Cap at requirements index syntax check; no consistency graph."
        severity: "Medium"
      - description: "outputSchema drift from builder output breaks SDK validation at runtime."
        id: "RISK-SI-001"
        likelihood: "Medium"
        mitigation: "Single JSON schema source; Ajv tests on every builder output path."
        severity: "High"
  test_strategy:
    module_validation:
      - boundary: "MCP adapter dual payload"
        module: "server_info_mcp_handler"
        tests: "server-info-mcp.composition.test.ts or handler unit"
      - boundary: "pure snapshot builder"
        module: "server_info_builder"
        tests: "server-info.test.ts"
    summary: "RED unit tests first per PROC-TIED_DEV_CYCLE; schema conformance battery; optional composition; full npm test gate."
