CITDP-REQ-EVIDENCE_CHAIN_REPORT:
  change_definition:
    current_behavior: "Clients can generate evidence-chain-profile.v1; [REQ-EVIDENCE_CHAIN_PROFILE] lists cross-project cohort aggregation as a non-goal and no TIED-side batch report exists."
    desired_behavior: "A TIED-source offline CLI reads an evidence-chain-report-inputs.v1 manifest and already-generated profile artifacts, partitions client cohorts by schema_version and profile_depth, and writes evidence-chain-statistics-report.v1 YAML plus a deterministic Markdown projection."
    non_goals:
      - "Generate or regenerate evidence-chain-profile.v1"
      - "Promote [REQ-EVIDENCE_CHAIN_REPORT] into templates/"
      - "Read or mutate client repositories, project YAML, finding ledgers, or case reports"
      - "Sum or average derived-field values in v1"
      - "Treat TIED_MCP_COLLECT_METRICS as evidence-chain results"
      - "Universal maturity score or cross-cohort numeric rollup"
    success_criteria:
      - "Byte-stable YAML and Markdown for fixed inputs and clock"
      - "Forbidden maturity and score fields reject the artifact"
      - "Incompatible depths remain separate client cohorts"
      - "Missing evidence is never coerced to zero"
      - "strict mode writes no outputs when any input is rejected"
    unchanged_behavior: "Profile generation, fidelity first-slice, quality manifests, and opt-in usage metrics remain independent."
  completion_criteria:
    verification_gate_notes: "Unit, CLI composition, and bootstrap tests passed; tied_verify set REQ-EVIDENCE_CHAIN_REPORT Implemented and IMPL-EVIDENCE_CHAIN_REPORT Active. CHANGELOG updated after green tests."
  evidence:
    commands:
      - "node --test dist/e2e/bootstrap-and-load.test.js"
      - "node --test dist/fidelity-research/evidence-chain-report.test.js dist/fidelity-research/evidence-chain-report.cli.test.js dist/fidelity-research/evidence-chain-profile.test.js"
      - "npx tsc -b --pretty false"
      - "ruby scripts/validate_vocab_index.rb ."
      - "tied-cli.sh pseudocode_validate IMPL-EVIDENCE_CHAIN_REPORT"
      - "tied-cli.sh tied_validate_consistency"
      - "tied-cli.sh tied_verify REQ-EVIDENCE_CHAIN_REPORT IMPL-EVIDENCE_CHAIN_REPORT"
    manifest_reference: "working/evidence-chain/example-report-inputs.yaml"
    profile_reference: "working/evidence-chain/example-profile.json; working/evidence-chain/stdd-integrated.json; working/evidence-chain/stdd-human_research.json"
    proof_boundaries:
      - "executable_behavior"
      - "human_decision"
      - "pseudo_code_structure"
      - "traceability_structure"
  impact_analysis:
    impl_inventory_notes: "evidence-chain-report.ts and mcp-server/src/cli/evidence-chain-report.ts. Reuses normalizeEvidenceChainProfile only. Does not call generateEvidenceChainProfile, runFirstSlice, or live client-root walk."
    modules_or_boundaries: "mcp-server/src/fidelity-research/evidence-chain-report.ts; mcp-server/src/cli/evidence-chain-report.ts; copy_files.sh DOCS_TO_COPY; templates PROFILE promotion; tied/docs/evidence-chain-profile.md report section"
    tied_tokens_affected:
