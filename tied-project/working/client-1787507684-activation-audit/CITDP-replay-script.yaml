    adversarial_inquiry:
      counterexamples:
        - "Gate step omits tracker or CITDP from client working folder"
        - "Script silently skips MCP calls without --dry-run label"
      depth_tier: "minimal"
      disconfirming_observations:
        - "npm test tied-cli-metrics-client passes after package.json wiring"
        - "replay-integrated-activation.sh --dry-run labels dry_run=1 and prints commands without executing MCP"
      evidence_references:
        - "mcp-server/test/tied-cli-metrics-client.test.cjs"
        - "working/client-1787507684-activation-audit/replay-integrated-activation.sh"
      falsification_questions:
        - "Would a missing PROJECT_ROOT pass --check?"
        - "Would npm test omit tied-cli-metrics-client?"
