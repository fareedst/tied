CITDP-CLIENT-1787507684-REPLAY-SCRIPT:
  change_definition:
    desired_behavior: "Ship an operator-facing replay script for the 1787507684 integrated activation\npath and wire tied-cli-metrics-client into npm test.\n"
    non_goals:
      - "CI integration of the replay script"
      - "H5 live pilot execution or findings-report.yaml updates"
      - "New MCP tools or validator changes"
    success_criteria:
      - "npm test includes tied-cli-metrics-client and passes"
      - "replay-integrated-activation.sh supports --dry-run and --check"
      - "Three phases run inquiry, collect, and gate with distinct run_ids"
  evidence:
    commands:
      - "./working/client-1787507684-activation-audit/replay-integrated-activation.sh --check"
      - "./working/client-1787507684-activation-audit/replay-integrated-activation.sh --dry-run"
      - "bash -n working/client-1787507684-activation-audit/replay-integrated-activation.sh"
