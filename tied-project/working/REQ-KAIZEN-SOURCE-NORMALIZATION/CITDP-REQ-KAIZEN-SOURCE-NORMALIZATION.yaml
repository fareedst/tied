CITDP-REQ-KAIZEN-SOURCE-NORMALIZATION:
  change_definition:
    current_behavior: "normalizeOperationalSource maps user_report to feature_request and other operational sources to bug_report without observation_kind, workflow, workaround, or baseline refs. captureOperationalObservation accepts optional observation_kind but defaults entry_type to methodology_improvement when omitted, without kind-based inference. Operational adapters do not share one inference table with capture.\n"
    desired_behavior: "One shared normalization module maps operational source_type to default observation_kind, infers feedback entry type from observation kind when the caller omits entry_type (caller type always wins), persists additive context fields (workflow, workaround, baseline_ref), keeps source provenance, and rejects non-operator_local privacy at adapter boundaries. user_report remains a friction observation (methodology_improvement by default), not an automatic feature_request.\n"
    non_goals:
      - "Closed-set validation of every observation kind value (validate known kinds; unknown passes as stored string for analysis)"
      - "Feedback analysis, digest projection, or promotion workflow changes"
      - "Fourth feedback entry type or shareable_hashed export paths"
      - "Rewriting raw observation title/description text"
    success_criteria:
      - "Composition tests for tied_feedback_operational_add and capture paths using shared inference"
      - "Fixtures for incident, metric, test_failure, and user_report with provenance preserved"
      - "Privacy rejection when adapter payload declares a non-operator_local tier"
      - "Tests lock caller-supplied entry_type override and kind-to-type inference table"
    unchanged_behavior:
      - "groupDuplicateFeedback and createReviewedLeapProposal review boundary"
      - "No upstream transport (Phases 1–2 sponsor decision)"
      - "Phase 1 capture receipt shape and idempotency semantics"
      - "tied_feedback_add and tied_feedback_export"
