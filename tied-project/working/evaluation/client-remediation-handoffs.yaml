bootstrap_before_client_work:
  - "Confirm tied_config_get_base_path resolves to the target client's tied/ directory."
  - "Keep tied/methodology/ read-only; write only project-owned TIED YAML."
  - "Open a per-client agent-req-implementation-checklist copy under working/{REQ-TOKEN}/ in the client repo."
  - "PRELOAD routed glossaries from tied/vocab/routing.md before reading project YAML or source."
  - "Use Section F of the source document as the completion checklist for each tranche."
clients:
  indescript:
    baseline_profile: "working/evaluation/profiles/indescript.v1.json"
    client_alias: "indescript"
    execution_site: "indescript client repository"
    follow_up_profile: "Pin post-P0 commit; regenerate profile at integrated depth with compatible denominators."
    hashed_project_id: "af185e7e62bb1bfb"
    in_repo_plan: "docs/tied-3.0-alignment-sync-plan.md"
    language: "Swift"
    p0:
      - acceptance: "one explicit intended behavior with aligned tests and no unresolved contradictory-spec finding"
        id: "persistent-shell-contradictions"
        summary: "Resolve persistent-shell specification contradictions before behavior changes."
        targets:
          - "shell-related tests"
          - "tied/architecture-decisions/"
          - "tied/implementation-decisions/"
          - "tied/requirements/"
      - acceptance: "strict pseudocode_validate passes with SHAPE-003 through SHAPE-006 resolved"
        id: "contract-precision"
        summary: "Expand PRE/POST/EFFECTS and applicable Layer-B clauses across changed Active blocks."
        targets:
          - "tied/implementation-decisions/"
          - "tied/implementation-decisions/IMPL-*-pseudocode.md"
    p1:
      - acceptance: "traceability_gap_report improves; every composition-testable row has a UI-free composition test"
        id: "backlinks-and-composition"
        summary: "Complete REQ/IMPL test backlinks and expand binding inventory for shell, package, and harness seams."
    p2:
      - acceptance: "paired inquiry metric and four identity-bound artifacts, or documented advisory result and residual risk"
        id: "adversarial-inquiry"
        summary: "Run integrated REQ-TIED_ADVERSARIAL_INQUIRY on shell and remote boundaries."
      - acceptance: "quality.command_results observed with command provenance rather than not_measured"
        id: "verification-manifest"
        summary: "Attach verification evidence manifest on next behavior-changing profile."
    pinned_commit: "76a3060026c81c4d1e42bcd26aba4a05b16fb246"
    residual_risks:
      - "Structural success does not establish shell correctness, remote reliability, security, or user-facing behavior."
    tracker_status: "not_opened"
  nsync:
    baseline_profile: "working/evaluation/profiles/nsync.v1.json"
    client_alias: "nsync"
    execution_site: "nsync client repository"
    follow_up_profile: "Pin post-P0 commit; record whether profile scope includes working-tree TIED files."
    git_policy: "working-tree-only tied/ allowed; not a P0 prerequisite"
    hashed_project_id: "8cc4c7db8ac063e6"
    in_repo_plan: "docs/tied-3.0-alignment-sync-plan.md"
    language: "Go"
    p0:
      - acceptance: "each programmatically triggerable row has a UI-free composition test; each platform boundary has a named E2E reason"
        id: "binding-inventory"
        summary: "Add binding inventory rows for SDK, entry-point, mirror-delete, and cross-platform seams."
      - acceptance: "tied_validate_consistency passes on the intended project tree"
        id: "sidecar-index-linkage"
        summary: "Reconcile 19 working-tree sidecars and IMPL rows with index paths; make the intended TIED tree reproducible in the chosen workflow."
        targets:
          - "tied/implementation-decisions.yaml"
          - "tied/implementation-decisions/"
          - "tied/implementation-decisions/IMPL-*-pseudocode.md"
    p1:
      - acceptance: "block leads match literally across sidecar, tests, and production code"
        id: "three-way-alignment"
        summary: "Backfill ARCH/IMPL/REQ block leads and test backlinks; audit token registration drift."
      - acceptance: "composition tests fail when SDK or entry-point wiring is removed and pass after restore"
        id: "composition-proof"
        summary: "Validate modules independently before adding more E2E coverage."
    p2:
      - acceptance: "quality.command_results observed with exit codes and artifact references"
        id: "verification-manifest"
        summary: "Collect and attach verification evidence manifest on next behavior-changing change."
    pinned_commit: "07aeca0fb6326c6d9f30e217e95f6e7e735a94ed"
    residual_risks:
      - "Untracked tied/ at the pinned commit prevents reconstruction from git alone."
    tracker_status: "not_opened"
  panorama:
    baseline_profile: "working/evaluation/profiles/panorama.v1.json"
    client_alias: "panorama"
    execution_site: "panorama client repository"
    follow_up_profile: "Pin post-P0 commit; compare compatible structural fields only."
    hashed_project_id: "d5dba3d9186254ca"
    in_repo_plan: "docs/tied-3.0-alignment-sync-plan.md"
    language: "TypeScript"
    p0:
      - acceptance: "strict pseudocode_validate reports no applicable SHAPE-003 through SHAPE-006 gaps"
        id: "contract-precision"
        summary: "Add standalone PRE, POST, and EFFECTS clauses to changed Active blocks."
        targets:
          - "tied/implementation-decisions/"
          - "tied/implementation-decisions/IMPL-*-pseudocode.md"
      - acceptance: "traceability_gap_report passes or remaining rows have documented approved exceptions"
        id: "req-test-metadata"
        summary: "Backfill REQ rows with test metadata and resolve traceability gap."
        targets:
          - "tied/requirements.yaml"
          - "tied/requirements/"
    p1:
      - acceptance: "every inventory row names trigger, callee, arguments, effect, ordering, failure behavior, and composition test"
        id: "composition-inventory"
        summary: "Expand binding inventory and UI-free composition tests beyond the single product composition file."
      - acceptance: "QA matrix records applicability, rationale, evidence, owner, limitation, and any waiver"
        id: "risk-triggered-qa"
        summary: "Select assurance profiles for external-input, workspace, UI, and persistence boundaries."
    p2:
      - acceptance: "executable command results observed and linked to provenance"
        id: "evidence-chain"
        summary: "Collect verification manifest and regenerate profile."
    pinned_commit: "595d323e24e56642d83ed631124a0e14e70ace56"
    residual_risks:
      - "Large passing test count does not prove IMPL fidelity, binding completeness, or contract precision."
    tracker_status: "not_opened"
  treegrep:
    baseline_profile: "working/evaluation/profiles/treegrep.v1.json"
    client_alias: "treegrep"
    execution_site: "treegrep client repository"
    follow_up_profile: "Pin commit after sidecar migration; compare same structural fields and denominator fingerprint."
    hashed_project_id: "69cb84308c3d6924"
    in_repo_plan: "docs/tied-3.0-alignment-sync-plan.md"
    language: "Ruby"
    p0:
      - acceptance: "behavior-changing work has a CITDP record or policy-backed skip; no conflicting lifecycle docs"
        id: "citdp-policy-reconciliation"
        summary: "Align docs/citdp/ guidance with tied/docs/citdp-policy.md."
        targets:
          - "docs/citdp/"
      - acceptance: "no unresolved contract-shape findings for migrated blocks"
        id: "contract-precision"
        summary: "Add EFFECTS and applicable Layer-B clauses to changed Active blocks."
      - acceptance: "sidecar paths resolve, block leads present, strict pseudocode_validate passes for changed blocks"
        id: "sidecar-migration"
        summary: "Move largest behavior-bearing inline pseudo-code bodies into project sidecars."
        targets:
          - "tied/implementation-decisions.yaml"
          - "tied/implementation-decisions/"
          - "tied/implementation-decisions/IMPL-*-pseudocode.md"
    p1:
      - acceptance: "documented commands and options have matching executable evidence"
        id: "documentation-code-alignment"
        summary: "Reconcile CLI documentation with actual behavior and test documented paths."
      - acceptance: "missing or miswired trigger paths fail composition tests before integration"
        id: "cli-bindings"
        summary: "Add binding inventory rows and UI-free composition tests for CLI entry-point seams."
    p2:
      - acceptance: "methodology files match source snapshot without altering project-owned YAML"
        id: "methodology-snapshot-refresh"
        summary: "Refresh inherited methodology snapshot via documented bootstrap flow."
    pinned_commit: "47f1530ceaebe1e384d3fccc95a879c3bb1b9657"
    residual_risks:
      - "Inline pseudo-code, sparse bindings, and documentation drift obscure missing-spec vs implementation defects."
    tracker_status: "not_opened"
