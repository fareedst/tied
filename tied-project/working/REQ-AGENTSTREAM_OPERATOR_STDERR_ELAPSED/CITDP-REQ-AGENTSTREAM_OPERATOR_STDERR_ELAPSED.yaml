CITDP-REQ-AGENTSTREAM_OPERATOR_STDERR_ELAPSED:
  change_definition:
    success_criteria:
      - "SC-OSEL-COLOR"
      - "SC-OSEL-ORCH-CLOCK"
      - "SC-OSEL-PLAIN"
      - "SC-OSEL-PREFIX"
      - "SC-OSEL-TEST"
  current_behavior: "tied agentstream and WF trial shell scripts emit DEBUG: and DIAGNOSTIC: lines without elapsed-second prefix.\nOrchestrator and subprocess logs share no monotonic time axis.\nDEBUG vs DIAGNOSTIC differ only by token text.\n"
  desired_behavior: "Every agentstream-emitted DEBUG and DIAGNOSTIC line is prefixed with four-digit elapsed whole seconds from TIED_OPERATOR_EPOCH_MS (or process start when unset).\nWF orchestrators set and export one epoch for the full four-phase cell; child agentstream inherits it.\nTTY textured stderr colors offset (dim cyan) and category labels (DEBUG dim yellow; DIAGNOSTIC dim label) per REQ-TIED_CLI_OPERATOR_OUTPUT_TEXTURE.\nPlain mode and AGENTSTREAM_OPERATOR_ELAPSED=0 preserve chainable grep.\n"
  metadata:
    created:
      author: "refine-plan"
      date: "2026-11-17"
  related_tokens:
    - "REQ-AGENTSTREAM_OPERATOR_STDERR_ELAPSED"
    - "REQ-GOAGENT-FEATURESPEC-BATCH"
    - "REQ-TIED_CLI_OPERATOR_OUTPUT_TEXTURE"
    - "REQ-WF_TRIAL_ORCHESTRATOR_PROCESS_LOG"
  risk_analysis:
    adversarial_inquiry:
      assurance_profile: "baseline-functional"
      counterexamples:
        - "Bash and TS formatters drift"
        - "Buffered stderrAcc assigns wrong second to burst lines"
      depth_tier: "minimal"
      disconfirming_observations:
        - "T-OSEL-01..05 composition tests"
      gate_policy: "advisory"
    depth_tier: "minimal"
    gate_policy: "advisory"
    rationale: "Operator logging only; no security or data-plane mutation"
  risk_assessment:
    - mitigation: "Append-time formatting in live-executor"
      reversibility: "reversible"
      risk: "Exit-time rewrite would mis-time buffered lines"
    - mitigation: "Opt-out env; document rollover"
      reversibility: "reversible"
      risk: "Golden fixtures and readouts grep bare DIAGNOSTIC:"
  satisfaction_criteria:
    - "Interleaved WF trial shows monotonically increasing SSSS across phase banners and agentstream subprocess lines"
    - "operator-stderr-line.test.ts and run-traditional-four-phase-agentstream-sh.test.mjs cover plain prefix and opt-out"
  test_strategy:
    composition:
      - "tools/bootstrap/run-traditional-four-phase-agentstream-sh.test.mjs"
    unit:
      - "mcp-server/packages/agentstream/src/operator-stderr-line.test.ts"
  title: "Agentstream operator stderr elapsed offset"
