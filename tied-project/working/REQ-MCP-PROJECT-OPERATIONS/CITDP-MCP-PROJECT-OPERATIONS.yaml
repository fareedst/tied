      - boundary: "install copies bundled skill"
        module: "xlate_bootstrap"
        tests: "xlate-skill.test.ts or bootstrap extension"
      - boundary: "library imports only; no MCP recursion"
        module: "sponsor_questions"
        tests: "sponsor-questions.test.ts"
      - boundary: "preview default; apply with allowlist only"
        module: "git_hygiene"
        tests: "git-hygiene.test.ts"
      - boundary: "read-only aggregation under getBasePath()"
        module: "project_lint"
        tests: "project-lint.test.ts"
    summary: "RED unit tests per module; composition via allTools.find pattern; bootstrap xlate install assertion; mutation guards on apply."
