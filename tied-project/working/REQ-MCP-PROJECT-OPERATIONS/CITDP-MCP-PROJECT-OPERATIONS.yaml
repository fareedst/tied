CITDP-MCP-PROJECT-OPERATIONS:
  change_definition:
    current_behavior: "Agents call multiple MCP validators and ad-hoc git inspection; Touchpoint 1 vocab RESOLVE relies on manual @routing.md attachment; no bundled /xlate skill."
    desired_behavior: "Three read-mostly MCP tools (tied_project_lint, tied_git_hygiene, tied_sponsor_questions) plus bundled xlate skill; git hygiene preview-first with guarded apply; sponsor costly-choice extraction only."
    non_goals:
      - "Git commit/stage/reset/checkout or git clean"
      - "New PROC-* tokens"
      - "Replace tied_validate_consistency or tied_checklist_gate_validate authority"
    success_criteria:
      - "Composition tests register and invoke all three MCP tools"
      - "Git hygiene apply requires apply true and exact allowed_paths; rejects tracked deletion"
      - "Lint and sponsor tools never mutate project TIED YAML"
      - "tied_validate_consistency passes after token stack"
      - "xlate skill installs to .cursor/skills/xlate via bootstrap"
    unchanged_behavior:
      - "Existing validation MCP tools unchanged"
      - "tied_validate_consistency remains authoritative for gates"
  completion_criteria:
    activation:
      phase: "verification"
      request_token: "REQ-TIED_PROJECT_LINT"
      run_id: "close-out-project-lint-20261004"
    focused_tests: "project-operations/*.test.ts; project-operations-mcp.test.ts; xlate install test"
    lint: "cd mcp-server && npm test -- project-operations"
    persist_policy: "persist CITDP to tied-project/citdp/ on close-out"
    verification: "tied_validate_consistency; tied_verify when gated"
  impact_analysis:
    audited_project_mutation: "mcp-server project-operations modules; bootstrap skills; tied-project TIED tokens; vocab routing"
    files:
      - "mcp-server/src/project-operations/"
      - "mcp-server/src/tools/project-operations-mcp.ts"
      - "tied-project/requirements.yaml"
      - "tied-project/vocab/routing.md"
      - "tools/bootstrap/lib/skills.mjs"
      - "tools/bundled-xlate-skill/"
    modules:
      - "git_hygiene"
      - "project_lint"
      - "sponsor_questions"
      - "xlate_skill_bootstrap"
    tags:
      - "integrated-wave"
      - "mcp-project-operations"
  record_identity:
    author: "build-plan"
    batch: "mcp-project-operations-v2"
    change_request_id: "REQ-TIED_PROJECT_LINT"
    date: "2026-10-04"
    record_status: "closed"
    title: "MCP project operations + xlate skill"
  risk_analysis:
    adversarial_inquiry:
      assurance_profile: "baseline-functional"
      counterexamples:
        - "Git hygiene deletes tracked files without allowlist"
        - "Lint tool writes project YAML silently"
        - "Sponsor tool treats every Planned REQ as blocking"
      depth_selected_at: "2026-10-04T00:00:00Z"
      depth_tier: "integrated"
      disconfirming_observations:
        - "Apply path rejects tracked paths and requires exact allowlist"
        - "Composition tests assert no-write for lint/sponsor"
      evidence_references:
        - "tied-project/working/REQ-MCP-PROJECT-OPERATIONS/"
      gate_policy: "advisory"
      prior_depth_tier: null
    risks:
      - description: "ESM bridge from TS to bootstrap gitignore helpers diverges from bootstrap behavior."
        id: "RISK-PO-001"
        likelihood: "Medium"
        mitigation: "Dedicated parity unit test for managed block idempotence."
        severity: "Medium"
      - description: "Mis-attributed TIED_BASE_PATH during MCP writes."
        id: "RISK-PO-002"
        likelihood: "Low"
        mitigation: "tied_config_get_base_path at session start; tests use temp dirs."
        severity: "High"
