CITDP-REQ-TIED_MCP_JSON_CANONICAL_OUTPUT:
  change_definition:
    current_behavior: "refreshTiedMcpServersJson merges tied-yaml entries then writes JSON.stringify(cfg) preserving\nJavaScript object insertion order. env keys often appear non-alphabetically (e.g. TIED_CLIENT_PROJECT_PATH before TIED_CLIENT_BUNDLE_PATH).\nmcpServers and server entry property order depend on merge history and foreign server layout.\n"
    desired_behavior: "Before every TIED write of .cursor/mcp.json and .mcp.json, canonicalizeMcpJsonDocument sorts object keys\nalphabetically at root, mcpServers, each server entry, and nested env/headers maps; args arrays preserve order.\nValues and foreign server semantics unchanged; only deterministic serialization order.\n"
    non_goals:
      - "Canonicalizing non-bootstrap JSON (envelopes, gate receipts, MCP server API responses)"
      - "Global JSON canonicalizer for all TIED packages in this change"
      - "Modifying MCP read paths or env resolution semantics"
    success_criteria:
      - "Existing mcp-config regression tests pass (values)"
      - "Integration test proves on-disk mcp.json after refresh has sorted mcpServers and env keys"
      - "REQ/ARCH/IMPL + pseudo-code; bootstrap README documents policy"
      - "Unit tests prove canonicalizeMcpJsonDocument sort rules including args exception"
    unchanged_behavior: "Brownfield merge preserves foreign mcpServers and operator fields; path env migration and metrics env unchanged;\ncreate-only policies for unrelated files unchanged.\n"
