CITDP-REQ-KAIZEN-FEEDBACK-PILOT:
  change_definition:
    current_behavior: "Phases 4–6 provide read-only digest projection, review bridge, and outcome loop facets, but no bounded pilot module names a comparable cohort, emits denominator-aware pilot metrics, or documents stop criteria evaluation for local/export-only operation.\n"
    desired_behavior: "A feedback-pilot module resolves a named pilot cohort, composes closed-catalog named metrics with numerators and denominators from digest and outcome data, evaluates documented stop criteria (with transport-related criteria not_applicable while Phase 3 is deferred), and emits feedback-pilot.v1 analysis evidence without methodology promotion.\n"
    non_goals:
      - "Canonical REQ/ARCH/IMPL YAML writes from pilot orchestration"
      - "Treating pilot volume or metric thresholds as methodology change or REQ promotion"
      - "Universal improvement score or maturity index"
      - "Upstream transport or notification delivery (Phase 3 closed)"
    success_criteria:
      - "Golden fixtures pass for named metrics with denominators, stop criteria triggered and clear paths, transport criteria not_applicable under deferred transport, incompatible cohort rejection, and store immutability"
      - "promotion_rule analysis_evidence_until_separate_sponsor_tied_change on every report"
      - "Stop criteria documented in report: privacy_incident, notification_overload, transport_loss, classification_ambiguity_unresolved"
    unchanged_behavior:
      - "buildFeedbackDigest read-only semantics and store immutability (Phase 4)"
      - "Outcome loop append-only facets (Phase 6)"
      - "Phase 3 transport deferred; local append and export only"
      - "Review bridge and LEAP queue (Phase 5)"
  completion_criteria:
    activation:
      phase: "pre_implementation"
      request_token: "REQ-KAIZEN-FEEDBACK-PILOT"
      run_id: "kaizen-p7-preimpl-20261007"
    focused_tests: "feedback-kaizen-pilot.test.ts"
    lint: "npx tsc -b in mcp-server"
    persist_policy: "Persist to tied-project/citdp/ at close-out after build-plan"
    verification: "tied_validate_consistency; integrated close_out gates after build-plan"
  impact_analysis:
    depends_on:
      - "REQ-FEEDBACK_TO_TIED"
      - "REQ-KAIZEN-FEEDBACK-ANALYSIS"
      - "REQ-KAIZEN-OUTCOME-LOOP"
      - "REQ-KAIZEN-REVIEW-BRIDGE"
    files:
