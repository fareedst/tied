documented_gaps:
  - "behavior-catalog.yaml"
  - "claims.jsonl"
  - "component-catalog.yaml"
  - "docs/methodologies/"
  - "evaluation/evidence.jsonl"
  - "grade-report.json"
request_token: "REQ-TIED_EASAR_RECOVERY"
schema_version: "recovery-portable-map.v1"
slots:
  - canonical_source: "evidence/inventory.v1.json"
    portable_path: "inventory.json"
    required: true
    transform: "copy_json"
  - canonical_source: "evidence/reflexion-report.v1.json"
    portable_path: "evaluation/verification-report.json"
    required: true
    transform: "reflexion_to_verification_report"
  - canonical_source: "evidence/validation-cases.v1.yaml"
    portable_path: "evaluation/validation-cases.yaml"
    required: true
    transform: "copy_yaml"
  - canonical_source: "evidence/validation-results.v1.json"
    portable_path: "evaluation/validation-results.json"
    required: true
    transform: "copy_json"
  - canonical_source: "generated-from-manifest-receipt"
    portable_path: "manifest.yaml"
    required: true
    transform: "from_manifest_receipt"
  - canonical_source: "PLAN.md"
    portable_path: "scope.md"
    required: true
    transform: "markdown_excerpt"
  - canonical_source: "tied-bundle/reports/source-graph/source-graph-index.v1.json"
    portable_path: "structure.json"
    required: false
    transform: "copy_json"
