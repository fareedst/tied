CITDP-REQ-TIED_EASAR_RECOVERY:
  change_definition:
    current_behavior: "EASAR methodology is documented in docs/methodologies/evidence-assured-software-architecture-recovery.md §7, but there is no umbrella [REQ-TIED_EASAR_RECOVERY], no [PROC-EASAR_RECOVERY] composition token, and no versioned receipts for inventory.v1.json or reflexion-report.v1. Brownfield Mode B ([PROC-BROWNFIELD_INTENT_ELEVATION]) and Track C sidecars work in isolation; source graph (Phase 2 slice 1), claims review, adversarial inquiry, and request evidence envelope exist as separate REQs without Mode C orchestration or engagement facet on the Tracker."
    desired_behavior: "Mode C recovery engagement composes existing REQs via [PROC-EASAR_RECOVERY]: MVP slices 1–4 deliver inventory.v1.json, matrix code_graph receipt linkage, claims/matrix choreography with unified claim id ↔ matrix # mapping, and reflexion-report.v1 synthesis—under integrated depth with phase-aware inquiry gates. Tracker keeps brownfield_intent_elevation.mode and adds engagement: easar_full without duplicating checklist authority."
    non_goals:
      - "Blocking 85/100 portable rubric without sponsor costly choice"
      - "Merging adversarial finding-ledger.jsonl with claims-review ledgers"
      - "Multi-language source graph beyond current TS/JS static index"
      - "Portable recovery/ export serializer (slice 6) in first cycle"
      - "Replacing [PROC-AGENT_REQ_CHECKLIST] with a parallel full checklist"
      - "Repo-root recovery/ tree as git source of truth"
      - "SWE-QA validation task bank (EASAR slice 5 / Stage 7) in first cycle"
    success_criteria:
      - "SC-EASAR-CLAIMS — claim.id ↔ matrix # mapping documented and tested; claims output under working/{REQ}/claims-evidence-review/"
      - "SC-EASAR-ENROLL — REQ/ARCH/IMPL/PROC tokens enrolled; depends_on links to BFIE, SGC, CER, fidelity, inquiry, envelope REQs"
      - "SC-EASAR-GATES — integrated pre_implementation + per-slice verification gates with identity-bound activation (or governed waivers only)"
      - "SC-EASAR-GRAPH — matrix code_graph rows cite graph freshness + trace ids; BFIE validator allows proof type (code_graph already in intent-elevation.ts)"
      - "SC-EASAR-INV — evidence/inventory.v1.json receipt from scoped analysis normalization; envelope-indexed"
      - "SC-EASAR-PROC — [PROC-EASAR_RECOVERY] references existing slugs/tools; sequences Track C + fidelity prompts for Stage 3 without mega-prompt"
      - "SC-EASAR-REFLEX — reflexion-report.v1.json (or export-only adapter) separates ARCH detail divergence from adversarial ledger"
      - "SC-EASAR-TESTS — RED unit/composition per slice; no slice N+1 until slice N gate + receipt complete"
      - "SC-EASAR-TRACKER — checklist-tracker documents mode + engagement: easar_full; gate fixtures accept facet when mode is pilot or strict"
    unchanged_behavior:
      - "[REQ-TIED_BROWNFIELD_INTENT_ELEVATION] report-only validator and disposition rules"
      - "[REQ-TIED_SOURCE_GRAPH_COMPREHENSION] read-only graph MCP path"
      - "Methodology read-only tied-bundle/ boundary in client policy"
      - "Track C (IMPL sidecars only) and Mode B brownfield slugs when engagement is not easar_full"
