CITDP-REQ-TIED_SOURCE_GRAPH_COMPREHENSION:
  change_definition:
    current_behavior: "TIED impact discovery relies on scoped analysis, manual search, and fidelity structural helpers; there is no native deterministic source graph (refresh, map, symbol traversal, freshness) in mcp-server comparable to Trail-Code/Graft orientation tools. Phase 1 brownfield intent elevation is complete and accepts matrix rows with source_type code_graph only as vocabulary—no graph producer exists."
    desired_behavior: "Phase 2 (slice 1) enrolls [REQ-TIED_SOURCE_GRAPH_COMPREHENSION], [ARCH-TIED_SOURCE_GRAPH_EVIDENCE_MODEL], modular [IMPL-TIED_SOURCE_GRAPH_*] slices, and [PROC-TIED_SOURCE_GRAPH_COMPREHENSION]; implements native TypeScript tree-sitter-backed refresh, repository map, symbol caller/callee traversal, and freshness receipts under mcp-server—report-only evidence, no project TIED YAML mutation, no checklist gate authority, no REQ promotion from graph output."
    non_goals:
      - "Automatic promotion of graph observations into REQ/ARCH without sponsor matrix adjudication"
      - "External @nanonets/graft runtime dependency as authority path (compose-only reference)"
      - "graft ask/grep/skeleton/blast-radius in slice 1 (later modular slices after module validation)"
      - "LLM summaries, Trail brain sync, or GitHub App telemetry in slice 1"
      - "Replacing TIED vocabulary PRELOAD or checklist gate decisions"
    success_criteria:
      - "SC-SGC-ENROLL — Project REQ/ARCH/IMPL(+slices)/PROC enrolled with cross-links to Phase 1 [PROC-BROWNFIELD_INTENT_ELEVATION] and docs/comparisons/tied-vs-trail-code.md"
      - "SC-SGC-FRESHNESS — Freshness check compares index revision to working tree hash and emits advisory diagnostics"
      - "SC-SGC-MAP — Map API returns directory clusters, file/symbol counts, and hub metadata for a bounded repo root"
      - "SC-SGC-NO-MUTATION — All MCP tools on graph path do not write tied-project/*.yaml indexes or detail files"
      - "SC-SGC-REFRESH — Deterministic refresh builds/regenerates a versioned local index with content hash and explicit proof boundaries (static analysis limits)"
      - "SC-SGC-TESTS — Unit tests on fixture mini-repos; composition tests for MCP registration; no-mutation regression"
      - "SC-SGC-TRACE — Trace API returns caller/callee edges for a resolved symbol id within configured depth"
    unchanged_behavior:
      - "[REQ-TIED_BROWNFIELD_INTENT_ELEVATION] validator and matrix contract"
      - "Existing tied_scoped_analysis_run and structural-analysis proof-boundary patterns"
      - "Methodology read-only tied-bundle/ boundary"
