    current_behavior: "Brownfield intent elevation is documented in tied-bundle/docs/brownfield-intent-elevation.md and checklist slugs exist, but project REQ/ARCH/IMPL/PROC tokens are not enrolled, no normalized Markdown/YAML matrix contract is machine-validated, and no report-only MCP validator exists."
