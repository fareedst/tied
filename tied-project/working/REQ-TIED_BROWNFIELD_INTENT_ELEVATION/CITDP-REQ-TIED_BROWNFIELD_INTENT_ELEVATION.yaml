      disconfirming_observations:
        - "No-mutation regression test fails if yaml_index_update invoked from validate path"
        - "Fixture matrix with baseline mismatch yields blocking diagnostic in report"
      evidence_references:
        - "tied-bundle/docs/brownfield-intent-elevation.md"
        - "tied-bundle/templates/brownfield-evidence-to-intent-matrix.md"
        - "mcp-server/src/fidelity-research/structural-analysis.ts"
      falsification_questions:
        - "Does validate mutate any tied-project/*.yaml on disk?"
        - "Can an approved row target REQ without disposition approved?"
        - "Do pilot checklist steps run when mode is report_only?"
      gate_policy: "advisory"
      profile_depth: "minimal"
      research_profile: "read-only-research"
      rationale: "Report-only MCP validator and documentation enrollment; no auth/network/persistence surface in Phase 1; integrated inquiry deferred unless sponsor expands scope"
      sub_adversarial_inquiry_pass: "not_applicable"
    quality_evidence_matrix:
      - applicability: "applicable"
        attribute: "read-only-validation"
        command_or_test: "brownfield validator unit + no-mutation test"
        evidence_method: "automated"
        result: "pass"
        rationale: "Core authority boundary for elevation vs promotion"
        risk: "accidental YAML mutation"
        threshold: "validate path read-only; promotion only via separate checklist steps"
        owner: "build-plan"
        limitation: "Does not prove runtime behavior of observed code claims"
      - applicability: "applicable"
        attribute: "baseline-functional"
        command_or_test: "npm test --prefix mcp-server"
        evidence_method: "automated"
        result: "pass"
        rationale: "Regression on MCP tool surface"
        risk: "handler wiring regression"
        threshold: "exit 0"
        owner: "build-plan"
        limitation: "Composition fixture may not cover all Markdown edge cases"
  test_strategy:
    summary: "Strict TDD: RED unit tests for normalize/validate (Markdown + YAML), disposition and promotion rules, baseline identity, proof-boundary required fields; then composition test for MCP handler with scoped analysis + claims review fixture inputs; then enroll TIED stack and wire checklist metadata docs; final verification gate + tied_validate_consistency."
    matrix:
      - name: "normalize-markdown-matrix"
        kind: unit
        impl_block: "NORMALIZE_INTENT_ELEVATION_ARTIFACT"
        req: "REQ-TIED_BROWNFIELD_INTENT_ELEVATION"
        red: "table row missing disposition → structured error"
        green: "valid template matrix → normalized internal model"
      - name: "normalize-yaml-matrix"
        kind: unit
        impl_block: "NORMALIZE_INTENT_ELEVATION_ARTIFACT"
        req: "REQ-TIED_BROWNFIELD_INTENT_ELEVATION"
        red: "YAML field alias mismatch vs Markdown → equivalence failure"
        green: "equivalent YAML document → same normalized hash as Markdown"
      - name: "validate-promotion-rules"
        kind: unit
        impl_block: "VALIDATE_INTENT_ELEVATION_ROWS"
        req: "REQ-TIED_BROWNFIELD_INTENT_ELEVATION"
        red: "approved disposition with empty REQ target passes"
        green: "only approved rows may carry REQ/ARCH targets; observed rows forbidden promotion targets"
      - name: "validate-no-yaml-mutation"
        kind: unit
        impl_block: "BROWNFIELD_INTENT_EVIDENCE_VALIDATE"
        req: "IMPL-TIED_BROWNFIELD_VALIDATION"
        red: "handler touches requirements.yaml mtime"
        green: "validate returns receipt; project indexes unchanged"
      - name: "mcp-handler-composition"
        kind: composition
        impl_block: "BROWNFIELD_INTENT_EVIDENCE_VALIDATE"
        req: "IMPL-TIED_BROWNFIELD_VALIDATION"
        red: "handler not registered in tools index"
        green: "tied-cli/MCP invoke returns receipt linking scoped analysis + claims review evidence refs"
      - name: "checklist-mode-branch"
        kind: integration
        command: "checklist gate fixture or doc test for brownfield_intent_elevation.mode"
        req: "PROC-BROWNFIELD_INTENT_ELEVATION"
        red: "pilot mode skips baseline-lock"
        green: "pilot/strict require brownfield sub-flow before author-requirement; report_only skips blocking only"
  tdd_sequence:
    - "IMPL essence_pseudocode with token comments for all blocks"
    - "Unit RED → GREEN for normalize + validate"
    - "Composition RED → GREEN for MCP handler"
    - "TIED enrollment via tied-cli/MCP"
    - "Docs/vocab RECORD for stable contract names"
    - "Verification gate + consistency"
