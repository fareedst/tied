change_definition:
  current_behavior: |
    workflow-trial-agentstream materializes generic agent-preload-contract from template with empty
    language and test_framework; disposable clients have no package.json seed; refine-plan may lock
    Python unittest or TypeScript npm test for the same PROMPT-WF (e.g. WF-03 Claude Sonnet vs Cursor).
    PROMPT-WF-01 remainder invites TypeScript or Python.
  desired_behavior: |
    After orchestrator bootstrap (unless WF_TRIAL_SKIP_IMPLEMENTATION_STACK=1):
    seed_wf_trial_typescript_stack(WORKSPACE) copy-if-absent fixture files;
    materialize_wf_trial_preload_contract(WORKSPACE) copy-if-absent from
    tied-bundle/docs/wf-trial-agent-preload-contract.yaml with TypeScript + node-test fields set.
    traditional-four-phase-agentstream.yaml turn 2 references wf-trial-refine-plan-stack.md — stack
    pre-locked, PLAN Locked stack table, no language re-debate. Turn 1 inventory includes
    implementation_stack_id wf-trial-ts-node-test-v1. Facilitator catalog documents stack;
    PROMPT-WF-01 TypeScript-only remainder. record-wf-trial defaults verification to npm test.
  non_goals:
  - Locking product ambiguity (WF-02 duplicate policy, WF-07 null semantics)
  - Changing chainFromPrevious or four-turn skill names
  - Mandatory stack on manual test-new-tied-client without orchestrator
  - Vitest or Python as alternate matrix runners in v1
  success_criteria:
  - SC-WF-STACK-SEED through SC-WF-STACK-TEST in REQ detail (authored at build-plan)
  - Orchestrated wf-03 disposable has package.json + preload language TypeScript before turn 1
  unchanged_behavior: |
    materialize_disposable_preload_contract for non-WF paths; gold clients; methodology YAML read-only
    in clients; four-phase handoff and process log behavior unchanged.
