CITDP-REQ-TIED_SPONSOR_TWO_LANE_DELIVERY:
  record_identity:
    change_request_id: "REQ-TIED_SPONSOR_TWO_LANE_DELIVERY"
    recorded_at: "2026-10-25"
    title: "Sponsor two-lane delivery (charter + selection gates)"
    profile_depth: "minimal"
    depth_tier: "minimal"
    gate_policy: "advisory"
    record_status: "draft"
  change_definition:
    methodology_surface_change_class: "checklist_step"
    methodology_surface_experiment_link:
      experiment_id: "mle-demo-20261010-001"
      production_system_surface: "checklist_step"
      surface_ref: "agent-req-implementation-checklist.yaml#sponsor-two-lane-markers"
    methodology_surface_experiment_advisory:
      hypothesis: "Normative charter/selection lane markers reduce mid-RED sponsor Q&A without increasing silent costly defaults versus existing SAR reversible-choice defaults."
      baseline_ref: "tied-project/methodology-experiments.yaml#mle-demo-20261010-001.methodology_baseline"
    current_behavior: >
      Sponsor involvement is scattered across checklist steps (costly choice at end of turn,
      risk-tier playbook attention map, consequence ladder rungs 1–4). Agents may surface
      sponsor questions mid-RED/GREEN even when defaults exist, causing extra passes. Pre-code
      vs post-code decisions are implicit; selection among alternatives is not tied to
      verification or deployed product evidence.
    desired_behavior: >
      Normative two-lane strategy limits sponsor Q&A to charter gate (pre-code strategic
      decisions through pre_implementation) and selection gate (post-code preference among
      implemented options at verification through close_out). Mid-lane deferral uses documented
      defaults plus sponsor_charter_backlog / sponsor_selection_backlog with warn-only
      diagnostics (W3+). Selection options require selection_evidence (tests, demo, gate
      receipt). Methodology propagates in build waves across docs, checklist, MCP classifier,
      and contract tests. Reviewer rungs and costly-choice authority unchanged.
    non_goals:
      - "Removing reviewer confirmation, strict CITDP, or integrated inquiry when policy requires"
      - "Auto-approving costly or irreversible sponsor choices"
      - "Hard-blocking mid-lane backlog at gates in W3 (warn-only unless future REQ)"
      - "Replacing REQ-TIED_SPONSOR_RISK_TIER_PLAYBOOK or PRE_HANDOFF charter"
      - "Production deploy orchestration or CI merge bots"
      - "REQ-TIED_FEATURE_ORCHESTRATION scope (deferred unless sponsor re-approves)"
    success_criteria:
      - "SC-TLD-001: vocab + routing for charter lane, selection lane, mid-lane deferral"
      - "SC-TLD-002: tied-bundle/docs/sponsor-two-lane-delivery.md + client-development-index"
      - "SC-TLD-003: checklist MD/YAML parity at five slugs"
      - "SC-TLD-004: lane classifier + tied_sponsor_questions unit tests"
      - "SC-TLD-005: tied_validate_consistency + pseudocode Layer B/C"
    unchanged_behavior: "Consequence ladder taxonomy; hinge fields; LEAP routing; verification-gated tied_verify"
    sponsor_backlog_shapes:
      sponsor_charter_backlog:
        required_fields:
          - "decision_id"
          - "phase"
          - "lane"
          - "default_or_option"
          - "consequence_rung"
          - "disposition"
          - "evidence_refs"
        lane_value: "charter"
        notes: "Pre-code strategic items; locked or deferred-with-default at charter gate"
      sponsor_selection_backlog:
        required_fields:
          - "decision_id"
          - "phase"
          - "lane"
          - "default_or_option"
          - "consequence_rung"
          - "disposition"
          - "selection_evidence"
          - "evidence_refs"
        lane_value: "selection"
        selection_evidence_rule: "Every selectable option must cite at least one typed selection_evidence ref (test id, demo path, feature flag, gate receipt)"
  impact_analysis:
    modules_or_boundaries: >
      Pure lane classifier (mcp-server/src/relationship/sponsor-decision-lane.ts);
      checklist warn adapter (checklist-validator.ts); read-only MCP sponsor-questions.ts;
      tied-bundle/docs and vocab; agent-req-implementation-checklist MD/YAML; bootstrap doc tests
    impl_inventory:
