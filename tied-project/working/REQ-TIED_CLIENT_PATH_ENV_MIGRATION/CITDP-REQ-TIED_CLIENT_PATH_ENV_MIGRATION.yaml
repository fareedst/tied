CITDP-REQ-TIED_CLIENT_PATH_ENV_MIGRATION:
  change_definition:
    current_behavior: |
      Bootstrap refresh writes env.TIED_BASE_PATH and env.TIED_METHODOLOGY_BUNDLE_PATH on tied-yaml / tied-yaml-optin.
      MCP server, tied-cli, and agentstream preflight read those legacy names only (except process.cwd discovery).
      Sponsor vocabulary records canonical TIED_CLIENT_PROJECT_PATH / TIED_CLIENT_BUNDLE_PATH as chosen but not implemented.
    desired_behavior: |
      On every tied-install and --refresh MCP layer pass: write canonical client path env keys with absolute paths;
      strip legacy keys from tied-yaml entries while preserving non-path env and foreign mcpServers.
      New installs emit canonical keys only. Runtime dual-read: canonical env first, legacy fallback (process.env and mcp.json).
      tied-cli and MCP stdio child receive canonical exports; CI may keep TIED_BASE_PATH override until updated.
    non_goals:
      - Renaming TIED_STORE_ROOT or TIED_REPO_ROOT
      - Mass-editing historical tied-project/working evidence files
      - Auto-migrating shell profiles or CI outside mcp.json refresh
      - Breaking create-only foreign mcp.json policy
    success_criteria:
      - Bootstrap tests prove legacy-only brownfield mcp.json migrates to canonical-only on refresh
      - mcp-base-path tests prove CLI reads canonical or legacy mcp env and env override dual-read
      - yaml-loader tests prove getBasePath and bundle override dual-read
      - tiedpreflight accepts canonical-only mcp.json
      - tied_config_get_base_path exposes canonical env fields with documented legacy mirrors
      - REQ/ARCH/IMPL + IMPL pseudo-code block comments; tied_validate_consistency clean
    unchanged_behavior: |
      Path values still computed from resolveTiedLayout tiedDir and linked bundle resolution;
      TIED_STORE_ROOT semantics unchanged; fail-closed when no project path configured;
      foreign mcpServers and operator disabled/command fields preserved on refresh.
  delivery_record:
    close_out_evidence: null
    closed_at: null
    commit_sha: null
    plan_refine_pass: 1
    status: "planned"
  impact_analysis:
    impl_inventory_notes: |
      New tied-path-env.mjs + tied-path-env.ts; mcp-config path patch keys;
      LEAP extend IMPL-TIED_CLI_MCP_JSON_BASE_PATH pseudo-code or sibling IMPL sidecar.
    modules_or_boundaries: |
      tools/bootstrap/lib (mcp-config, mcp-base-path, layers/mcp);
      tools/bundled-tied-yaml-skill/scripts;
      mcp-server/src (yaml-loader, tools/index);
      mcp-server/packages/agentstream (tiedpreflight).
    tied_tokens_affected:
