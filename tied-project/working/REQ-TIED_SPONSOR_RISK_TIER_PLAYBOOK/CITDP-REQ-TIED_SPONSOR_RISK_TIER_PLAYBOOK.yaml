CITDP-REQ-TIED_SPONSOR_RISK_TIER_PLAYBOOK:
  change_definition:
    current_behavior: "Risk-scaled human touchpoints are described in comparison docs and sponsor–agent vocabulary but not as a single installable playbook tying assurance profiles and depth_tier to reviewer attention."
    desired_behavior: "One methodology playbook under tied-bundle/docs with advisory mapping tables, hinge-field reminders, and cross-links to Phase 1 pre-handoff charter; no new MCP authority."
    non_goals:
      - "Automated risk classification or merge automation"
      - "Mandatory PR-bot or zero-human merge paths"
      - "Phases 3-5 of Claude comparison"
    success_criteria:
      - "sponsor-risk-tier-playbook.md exists with proof boundary and review attention map"
      - "client-development-index.md links the playbook; Phase 1 charter cross-linked"
      - "Bootstrap test asserts playbook markers (SC-PLAYBOOK-TEST)"
      - "pre_implementation gate allowed; verification and close_out gates allowed at close-out"
      - "CITDP persisted under tied-project/citdp/; REQ/ARCH/IMPL Implemented"
    unchanged_behavior: "Checklist gates, tied_verify, DAE charter opt-in, and consequence ladder semantics unchanged."
  evidence:
    commands:
      - "node --test sponsor-risk-tier-playbook-doc.test.mjs"
      - "tied_validate_consistency"
      - "tied_checklist_gate_validate pre_implementation"
      - "run-close-out-gates.mjs --phase verification|close_out --envelope-blocking"
    proof_boundaries:
      - "documentation_and_install_surface_only"
      - "does_not_prove_sponsor_compliance_in_client_repos"
  impact_analysis:
    impl_inventory_notes: "Doc file + index link + one bootstrap test; IMPL pseudo-code sidecar for doc paths only."
    modules_or_boundaries: "tied-bundle/docs/ (methodology corpus refreshed by tied-install)."
