    promotion_rule: pilot stays analysis evidence until separate sponsor-approved TIED change
    program_steps:
      - id: P7-initiate
        disposition: pending
        action: CALL plan-new-feature scope Phase 7 only
      - id: P7-implement
        disposition: pending
        action: LOOP agent checklist through verification-gate
      - id: P7-close
        disposition: pending
        action: CALL plan-close-out; set program_phase closed; current_step EXIT

recovery:
  incomplete_child_tracker:
    action: Resume at child phase_tracker execution_evidence.completed last slug; do not reset program_phase
  leap_after_phase_close:
    action: Reopen only affected phase status in_progress; GOTO that phase P{n}-implement
  wrong_tied_base_path:
    action: Stop; fix .cursor/mcp.json TIED_BASE_PATH; do not write project YAML
  vocabulary_drift:
    action: RECORD in feedback-to-tied.md; VALIDATE at phase traceable-commit only
  phase_3_skipped_by_policy:
    action: Expected until transport hinge reopen; sequence P2-close goes to P4-initiate

execution_evidence:
  program_started_at: null
  program_closed_at: null
  phases_completed: [0, 1, 2, 4, 5, 6]
  last_session_handoff: tied-project/working/PLAN-TIED-KAIZEN-FEEDBACK-LOOP/evidence/agent-resume-handoff.md
  envelope_path: tied-project/working/PLAN-TIED-KAIZEN-FEEDBACK-LOOP/evidence/kaizen-program-envelope.v1.json
