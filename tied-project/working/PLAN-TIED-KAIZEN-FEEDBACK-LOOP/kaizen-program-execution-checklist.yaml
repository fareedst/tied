      - automatic canonical YAML write
    exit_evidence:
      - review required reject approve canonical-write attempt stale evidence proposal link
    program_steps:
      - id: P5-initiate
        disposition: complete
        action: CALL plan-new-feature scope Phase 5 only
      - id: P5-implement
        disposition: complete
        action: LOOP agent checklist through verification-gate
      - id: P5-close
        disposition: complete
