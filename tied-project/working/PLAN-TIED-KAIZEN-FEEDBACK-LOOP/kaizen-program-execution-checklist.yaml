    status: complete
    next_for_agent: false
    req_token: REQ-KAIZEN-REVIEW-BRIDGE
    proof_commit: 8437712
    close_out_evidence: tied-project/working/REQ-KAIZEN-REVIEW-BRIDGE/evidence/closeout-run-close-out-gates-final.json
    suggested_req_prefix: REQ-KAIZEN-REVIEW-BRIDGE
    phase_tracker: tied-project/working/REQ-KAIZEN-REVIEW-BRIDGE/checklist-tracker.yaml
    owns:
