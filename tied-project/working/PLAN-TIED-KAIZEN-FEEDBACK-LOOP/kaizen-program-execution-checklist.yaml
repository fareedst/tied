# Kaizen feedback loop — program execution checklist (central orchestrator)
#
# Purpose: One resume surface for Phases 0–7 after sponsor batch approval (2026-10-07).
# Each behavior-changing phase still runs its own per-REQ copy of
# tied-bundle/docs/agent-req-implementation-checklist.yaml under working/{REQ-TOKEN}/.
#
# This file is NOT the refine-pass tracker. Refine documentation steps live in
# checklist-tracker.yaml (request PLAN-TIED-KAIZEN-FEEDBACK-LOOP, doc-only pass).

schema_version: kaizen-program-execution.v1
last_updated: "2026-10-07T16:45:00-07:00"

program:
  label: Kaizen loop capability (Phases 0–7)
  program_request: PLAN-TIED-KAIZEN-FEEDBACK-LOOP
  linked_plan: docs/tied-kaizen-feedback-loop-plan.md
  vocabulary_preload:
    - tied-project/vocab/feedback-to-tied.md
    - tied-project/vocab/leap-proposal-queue.md
    - tied-project/vocab/quality-assurance.md
  refine_pass_tracker: tied-project/working/PLAN-TIED-KAIZEN-FEEDBACK-LOOP/checklist-tracker.yaml
  citdp_plan: tied-project/citdp/CITDP-PLAN-TIED-KAIZEN-FEEDBACK-LOOP.yaml

program_phase: in_progress
# ready_to_execute | in_progress | closed | paused_sponsor_hinge

execution_authority:
  mode: sponsor_pre_approved_batch
  sponsor_statement: >
    Entire linked plan is approved for execution when initiated; agents may proceed
    through Phases 1–7 under recorded policy without re-asking closed hinges.
  recorded_at: "2026-10-07"
  evidence_ref:
    kind: file_path
    path: tied-project/working/PLAN-TIED-KAIZEN-FEEDBACK-LOOP/evidence/sponsor-decisions-evidence.md

  pre_approved_hinges:
    upstream_transport_phase_1_2:
      decision: local_append_receipt_export_only
      blocks_until_changed: Phase 3 outbox and any upstream transport port
    privacy_tier_default:
      decision: operator_local
      blocks_until_changed: shareable_hashed or forbidden_export in production paths
    feedback_entry_type_shape:
      decision: three_enum_values_plus_observation_kind
      blocks_until_changed: fourth persisted feedback entry type

  reversible_choices_proceed_without_ask:
    - operational observation recorded before cause claims
    - feedback analysis appends facets; never overwrites observation text
    - empty or missing inputs use unknown, not_measured, or not_applicable
    - trends use named counts and denominators; no universal score
    - Phase 5 reuses ARCH-TIED_FEEDBACK_PROMOTION_BOUNDARY; no second queue
    - digest cites promotion status and LEAP status; no stored accepted or deferred status
    - depth_tier for each phase defaults integrated when external input or persistence matches (see phase_defaults)

  sponsor_interrupt_only_when:
    - hinge reopen via explicit sponsor change request and CITDP update
    - integrated_waiver for depth below integrated on Phase 1+ (owner, expiry, rationale required)
    - Phase 3 transport recipient, channel, or webhook scope
    - shareable_hashed export with named redaction owner and expiry
    - fourth feedback entry type or breaking schema version
    - Phase 7 pilot promotion into methodology (separate TIED change)
    - stop criteria triggered (privacy incident, notification overload, transport loss, unresolvable classification)
    - agency boundary: canonical REQ/ARCH/IMPL intent beyond delegated envelope

  do_not_re_ask:
    - the three 2026-10-07 costly choices while pre_approved_hinges remain in force
    - Kaizen vocabulary RESOLVE rows in feedback-to-tied.md for terms already mapped in the linked plan Refine table
    - whether Phase 0 naming pass is required (complete via refine pass)

flow_control:
  notation:
    - symbol: GOTO
      meaning: Jump to program step id; update current_step in this file
    - symbol: CALL
      meaning: Run a child workflow (plan-new-feature, build-plan, plan-close-out) then RETURN
    - symbol: LOOP
      meaning: Repeat child checklist until verification-gate and traceable-commit complete for that phase REQ
  ordering: strict_sequential_phases
  parallel_phases_allowed: false

resume_protocol:
  summary: >
    Read this file first. Set current_step from program_phase and phase status.
    Never restart a closed phase unless LEAP scope change requires it.
  steps:
    - id: R1
      action: Call tied_config_get_base_path; must equal this repo tied-project/
    - id: R2
      action: PRELOAD vocabulary_preload glossaries
    - id: R3
      action: Read linked_plan Implement section for selected phase module boundaries
    - id: R4
      action: IF phase.status is complete THEN GOTO next pending phase program step
    - id: R5
      action: IF phase.status is in_progress THEN open phase.phase_tracker and GOTO session-bootstrap on that tracker
    - id: R6
      action: IF phase.status is pending THEN run CALL plan-new-feature for that phase only
    - id: R7
      action: On child traceable-commit complete, set phase.status complete and persist phase close_out evidence path

current_step: P7-initiate
# Updated by executor when a phase closes or pauses

# Next agent: read agent_handoff first, then resume_protocol R1–R6 for Phase 7 (plan-new-feature only — do not start build-plan in close-out session).
agent_handoff:
  updated_at: "2026-10-08T00:30:00-07:00"
  intent: >
    Continue Kaizen program without pausing for closed hinges. Phase 3 transport
    stays deferred until a future explicit hinge reopen. Phase 6 outcome loop
    is closed; next is Phase 7 pilot via plan-new-feature only (do not start
    build-plan until Phase 7 REQ/ARCH/IMPL exist).
  next_session:
    program_step: P7-initiate
    phase_id: 7
    suggested_req_token: REQ-KAIZEN-FEEDBACK-PILOT
    workflow_sequence:
      - CALL plan-new-feature — scope Phase 7 only; mint REQ/ARCH/IMPL; copy checklist template to working/{REQ-TOKEN}/
      - refine-plan — only if Phase 7 CITDP/plan gaps remain before RED
      - build-plan — deferred until plan-new-feature completes
      - plan-close-out — after Phase 7 verification-gate (not in this session)
    linked_plan_anchor: docs/tied-kaizen-feedback-loop-plan.md — Implement § Later phases, Phase 7 row and exit evidence
    preload:
      - tied-project/vocab/feedback-to-tied.md
      - tied-project/vocab/leap-proposal-queue.md
      - tied-project/vocab/quality-assurance.md
    do_not:
      - Re-ask 2026-10-07 costly choices or transport policy (see sponsor_confirmations)
      - Start Phase 3 without hinge reopen on CITDP
      - Restart Phase 1–2 unless LEAP drift requires it
    may_proceed_without_ask:
      - Phases 4 → 5 → 6 → 7 in strict order after each phase close_out commit
      - integrated depth and advisory gate_policy per phase_defaults
  sponsor_confirmations:
    transport_hinge_2026_10_07_followup:
      decision: keep_closed_finish_phases_4_through_7
      recorded_at: "2026-10-07"
      meaning: >
        Finish analysis, review bridge, outcome loop, and pilot on local/export
        only; reopen upstream transport only when sponsor names recipient and channel.
      evidence: tied-project/working/PLAN-TIED-KAIZEN-FEEDBACK-LOOP/evidence/sponsor-decisions-evidence.md
  implementation_commits:
    phase_1:
      git: 229ab6b
      req_token: REQ-KAIZEN-OBSERVATION-CAPTURE
      close_out: tied-project/working/REQ-KAIZEN-OBSERVATION-CAPTURE/evidence/closeout-run-close-out-gates-final.json
    phase_2:
      git: c4cc94f
      req_token: REQ-KAIZEN-SOURCE-NORMALIZATION
      close_out: tied-project/working/REQ-KAIZEN-SOURCE-NORMALIZATION/evidence/closeout-run-close-out-gates-final.json
    phase_4:
      git: b9a092f
      req_token: REQ-KAIZEN-FEEDBACK-ANALYSIS
      close_out: tied-project/working/REQ-KAIZEN-FEEDBACK-ANALYSIS/evidence/closeout-run-close-out-gates-final.json
    phase_5:
      git: 8437712
      req_token: REQ-KAIZEN-REVIEW-BRIDGE
      close_out: tied-project/working/REQ-KAIZEN-REVIEW-BRIDGE/evidence/closeout-run-close-out-gates-final.json
    phase_6:
      git: pending
      req_token: REQ-KAIZEN-OUTCOME-LOOP
      close_out: tied-project/working/REQ-KAIZEN-OUTCOME-LOOP/evidence/closeout-run-close-out-gates-final.json
  optional_doc_commit:
    note: Plan/vocab bundle still uncommitted per evidence/commit-pass-handoff.md — not blocking Phase 4

phase_defaults:
  depth_tier: integrated
  depth_tier_waiver_token: integrated_waiver
  depth_inheritance_from_refine_pass: forbidden
  gate_policy: advisory
  research_profile: integrated-agent
  assurance_profile: baseline-functional
  per_phase_checklist_template: tied-bundle/docs/agent-req-implementation-checklist.yaml
  child_working_root_pattern: tied-project/working/{REQ-TOKEN}/

phases:
  - phase_id: 0
    module: Contract and vocabulary
    status: complete
    req_token: null
    proof: Refine pass; docs/tied-kaizen-feedback-loop-plan.md and feedback-to-tied.md aligned
    phase_tracker: tied-project/working/PLAN-TIED-KAIZEN-FEEDBACK-LOOP/checklist-tracker.yaml
    exit_criteria:
      - three sponsor hinges recorded with dated approval
      - Implement section forbids inheriting minimal depth into Phase 1

  - phase_id: 1
    module: Observation capture
    status: complete
    req_token: REQ-KAIZEN-OBSERVATION-CAPTURE
    proof_commit: 229ab6b
    close_out_evidence: tied-project/working/REQ-KAIZEN-OBSERVATION-CAPTURE/evidence/closeout-run-close-out-gates-final.json
    suggested_req_prefix: REQ-KAIZEN-OBSERVATION-CAPTURE
    phase_tracker: tied-project/working/REQ-KAIZEN-OBSERVATION-CAPTURE/checklist-tracker.yaml
    owns:
      - additive local append
      - receipt
      - idempotency
      - privacy tier operator_local at capture
    leaves_alone:
      - feedback analysis
      - upstream transport
      - promotion bridge
    exit_evidence:
      - unit tests valid incomplete malformed duplicate redacted idempotent retry
      - persistence atomic write and restart
      - receipt without required cause claim
    program_steps:
      - id: P1-initiate
        disposition: complete
        action: CALL plan-new-feature scope Phase 1 only; mint REQ/ARCH/IMPL; copy per_phase_checklist_template to phase_tracker
      - id: P1-implement
        disposition: complete
        action: LOOP agent checklist through verification-gate; depth_tier integrated unless integrated_waiver on CITDP
      - id: P1-close
        disposition: complete
        action: CALL plan-close-out; set phase_id 1 status complete; current_step P2-initiate

  - phase_id: 2
    module: Source normalization
    status: complete
    req_token: REQ-KAIZEN-SOURCE-NORMALIZATION
    proof_commit: c4cc94f
    close_out_evidence: tied-project/working/REQ-KAIZEN-SOURCE-NORMALIZATION/evidence/closeout-run-close-out-gates-final.json
    suggested_req_prefix: REQ-KAIZEN-SOURCE-NORMALIZATION
    phase_tracker: tied-project/working/REQ-KAIZEN-SOURCE-NORMALIZATION/checklist-tracker.yaml
    refine_plan:
      completed_at: "2026-10-07"
      evidence: tied-project/working/REQ-KAIZEN-SOURCE-NORMALIZATION/PLAN.md
    owns:
      - observation kind on adapters
      - workflow workaround baseline refs
      - caller-supplied feedback entry type wins
    leaves_alone:
      - raw observation text
      - analysis facets
    exit_evidence:
      - source fixtures incident metric test failure user report
      - provenance and privacy rejection
      - composition tests per adapter binding
    program_steps:
      - id: P2-initiate
        disposition: complete
        action: CALL plan-new-feature scope Phase 2 only
      - id: P2-implement
        disposition: complete
        action: LOOP agent checklist through verification-gate
      - id: P2-close
        disposition: complete
        action: CALL plan-close-out; set phase_id 2 status complete; current_step P4-initiate

  - phase_id: 3
    module: Outbox and notification policy
    status: deferred_until_sponsor_hinge
    sponsor_decision_2026_10_07: "keep_closed — proceed Phases 4–7; do not CALL plan-new-feature for Phase 3"
    req_token: null
    suggested_req_prefix: REQ-KAIZEN-FEEDBACK-OUTBOX
    phase_tracker: null
    deferral_reason: pre_approved_hinges.upstream_transport_phase_1_2 blocks transport until separate hinge reopen
    owns:
      - retry state
      - notification policy behind transport port
    sponsor_gate_before_start: upstream transport scope and recipients
    program_steps:
      - id: P3-initiate
        disposition: blocked
        action: IF hinge reopen recorded on CITDP THEN CALL plan-new-feature else GOTO P4-initiate without ask
      - id: P3-implement
        disposition: blocked
        action: LOOP agent checklist through verification-gate
      - id: P3-close
        disposition: blocked
        action: CALL plan-close-out; current_step P4-initiate

  - phase_id: 4
    module: Feedback analysis
    status: complete
    next_for_agent: false
    req_token: REQ-KAIZEN-FEEDBACK-ANALYSIS
    proof_commit: b9a092f
    close_out_evidence: tied-project/working/REQ-KAIZEN-FEEDBACK-ANALYSIS/evidence/closeout-run-close-out-gates-final.json
    suggested_req_prefix: REQ-KAIZEN-FEEDBACK-ANALYSIS
    phase_tracker: tied-project/working/REQ-KAIZEN-FEEDBACK-ANALYSIS/checklist-tracker.yaml
    owns:
