    program_steps:
      - id: P4-initiate
        disposition: complete
        action: CALL plan-new-feature scope Phase 4 only
      - id: P4-implement
        disposition: complete
        action: LOOP agent checklist through verification-gate
      - id: P4-close
        disposition: complete
