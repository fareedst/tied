  - phase_id: 6
    module: Outcome loop
    status: complete
    next_for_agent: false
    req_token: REQ-KAIZEN-OUTCOME-LOOP
    proof_commit: pending
    close_out_evidence: tied-project/working/REQ-KAIZEN-OUTCOME-LOOP/evidence/closeout-run-close-out-gates-final.json
