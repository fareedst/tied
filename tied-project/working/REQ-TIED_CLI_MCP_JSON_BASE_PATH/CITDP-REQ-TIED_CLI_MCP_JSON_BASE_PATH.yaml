CITDP-REQ-TIED_CLI_MCP_JSON_BASE_PATH:
  change_definition:
    current_behavior: "tied-cli.sh (and siblings) default TIED_BASE_PATH from REPO_ROOT derived by walking up from the script directory. Linked-install clients point stubs at the TIED store copy of the script, so CLI YAML writes can target the methodology/store tied-project/ while IDE MCP (mcp.json env) targets the client. Quick-start (clone, build-workspace, tied-install) does not set shell env vars.\n"
    desired_behavior: "From client cwd, resolve project_root (git toplevel or walk-up to repo containing .cursor/mcp.json or .mcp.json), read mcpServers.tied-yaml.env.TIED_BASE_PATH (and TIED_METHODOLOGY_BUNDLE_PATH when present) from those files, validate tied-project layout, and export to the MCP stdio child. Explicit TIED_BASE_PATH env remains an optional override for store/CI only. Missing mcp.json or missing TIED_BASE_PATH in config fails closed with DIAGNOSTIC (no silent wrong-tree writes).\n"
    non_goals:
      - "GF-16 disposable client product changes (REQ-RECONCILIATION_ENGINE)"
      - "Mutating existing client .cursor/mcp.json (create-only bootstrap policy)"
      - "Replacing tied_config_get_base_path pre-write check in IDE sessions"
      - "Requiring shell profile exports for normal client operators"
    success_criteria:
      - "Bootstrap tests: Claude .mcp.json only (no .cursor/mcp.json, no env) → same match"
      - "Bootstrap tests: Cursor .cursor/mcp.json only (no env) → tied_config_get_base_path matches mcp"
      - "Fail closed when neither mcp file exists or TIED_BASE_PATH missing in tied-yaml env block"
      - "Linked-layout regression: store script path + client cwd → client tied-project/"
      - "Store feedback.yaml entry for GF-16 proxy + tied_validate_consistency after REQ/ARCH/IMPL"
      - "When both mcp files exist with different TIED_BASE_PATH, CLI uses Cursor file (documented order)"
    unchanged_behavior: "IDE MCP per harness still receives env from that harness spawn; CLI reads install-managed mcp JSON (Cursor and/or Claude paths), not harness selection."
