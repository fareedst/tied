    - criterion: "SC-EDPC-FACET — edpc_full requires pilot|strict; easar_full deprecated alias diagnostic."
    - criterion: "SC-EDPC-PROC — PROC-EDPC_COMPREHENSION references existing slugs/tools only."
    - criterion: "SC-EDPC-ROUTE — tied_edpc_workflow_route deterministic for identical inputs."
    - criterion: "SC-EDPC-SCM — publish manifest lists gaps; EDPC minimum fields or gaps[]."
    - criterion: "SC-EDPC-SUPERSEDE — EASAR REQ linked superseded_by engagement naming; receipt tests green."
