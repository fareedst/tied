REQ-TIED_EDPC_COMPREHENSION:
  category: "Functional"
  description: "EDPC orchestration enrolls evidence_access_tier, file-based SCM shell, and MCP tools composing EASAR/brownfield/graph/claims/envelope without a claim-graph DB."
