  priority: "P1"
  rationale:
    benefits:
      - "Deterministic workflow routing and publish manifests with explicit gaps."
      - "Single umbrella for comprehension engagements with fail-closed tier caps."
    problems_solved:
      - "EDPC methodology documented but not enrolled in tied-project."
      - "No evidence_access_tier model or EDPC MCP validate/route/publish."
    why: "Bridge docs/methodologies/EDPC_Methodology_and_Workflows.md into executable TIED stack."
  related_requirements:
