REQ-TIED_JEV_LOCAL_DECISION_PROVIDER:
  category: "Functional"
  description: "Optional local subprocess bridge for jevDecide with provider routing and harness decision-backend readiness."
  name: "Jev local decision provider"
  priority: "P2"
  rationale:
    benefits:
      - "CI-safe fake bridge tests"
      - "Explicit egress policy on auto fallback"
    problems_solved:
      - "Harness fail-closed on missing key when local bridge configured"
      - "Remote-only jevDecide"
    why: "Privacy and latency for typed decisions without changing coprocessor authority."
  satisfaction_criteria:
    - criterion: "Auto respects skip, remote, and error fallback."
      id: "SC-AUTO-FALLBACK"
      metric: "decision-provider tests"
    - criterion: "Bridge stdin/stdout v1 contract validated."
      id: "SC-BRIDGE-CONTRACT"
      metric: "local-client tests"
    - criterion: "Default remote provider; existing remote tests pass."
      id: "SC-REMOTE-DEFAULT"
      metric: "jev.test.ts"
    - criterion: "Harness blocking path works with local backend without API key."
      id: "SC-HARNESS-LOCAL"
      metric: "harness-tool-guard.test.ts"
    - criterion: "Local provider never invokes HTTP."
      id: "SC-LOCAL-NO-EGRESS"
      metric: "unit fetch spy"
    - criterion: "Provider fields in decide trace context_meta."
      id: "SC-TRACE-META"
      metric: "decide-trace tests"
    - criterion: "Tied consistency and gates pass."
      id: "SC-TIED"
      metric: "tied_validate_consistency"
  status: "Planned"
