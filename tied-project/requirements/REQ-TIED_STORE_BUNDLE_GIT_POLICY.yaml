REQ-TIED_STORE_BUNDLE_GIT_POLICY:
  REQ-TIED_STORE_BUNDLE_GIT_POLICY:
    category: "Infrastructure"
    description: "Align TIED store repo git policy with two-folder model — track tied-bundle corpus except working/ and install.json; remove client-style whole-tree tied-bundle/ ignore; migrate tracked local working to fixtures or committed project evidence."
    name: "Store bundle git policy"
    priority: "P1"
    rationale:
      benefits:
        - "Local working stays on disk under tied-bundle/working/ but out of index"
        - "Removes contradictory tracked local working debt"
        - "Store commits methodology corpus in git"
      problems_solved:
        - "Client INSTALL MANAGED tied-bundle/ line on store repo"
        - "UNDIVIDED STORE MIRROR and !working/ holes"
        - "~238 git-tracked files under tied-bundle/working/"
      why: "Store is both methodology publisher and TIED client; git policy must differ from external clients while runtime paths stay the same."
    related_requirements:
      depends_on:
        - "REQ-TIED_TWO_FOLDER_LAYOUT"
        - "REQ-TIED_WORKING_ARTIFACT_PLACEMENT"
      related_to: []
      supersedes: []
    satisfaction_criteria:
      - criterion: "CI green; migration inventory documents moved pins."
        id: "SC-SBGP-FIXTURE-PARITY"
        metric: "test-all"
      - criterion: "git ls-files tied-bundle/working is empty."
        id: "SC-SBGP-ZERO-TRACKED-LOCAL"
        metric: "store-gitignore-policy invariant test"
      - criterion: "Managed STORE LOCAL WORKING block; INSTALL MANAGED without tied-bundle/ line; no UNDIVIDED MIRROR."
        id: "SC-SBGP-STORE-PROFILE"
        metric: "working-gitignore + store-gitignore-policy tests"
      - criterion: "tied-bundle/docs/ai-principles.md not ignored; corpus trackable."
        id: "SC-SBGP-CORPUS-VISIBLE"
        metric: "git check-ignore test"
      - criterion: "WAP + install matrix + asymmetric git docs updated."
        id: "SC-SBGP-DOCS"
        metric: "doc review"
      - criterion: "writeGitignoreBlock client behavior unchanged."
        id: "SC-SBGP-CLIENT-PARITY"
        metric: "gitignore-block.test.mjs"
    status: "In Progress"
    traceability:
      architecture:
        - "ARCH-TIED_STORE_BUNDLE_GIT_POLICY"
      implementation:
        - "IMPL-TIED_STORE_BUNDLE_GIT_POLICY"
