    - criterion: "Optional WF_TRIAL_STRICT_CLOSEOUT_PREFLIGHT=1 checks persisted CITDP YAML and verification gate receipt when build handoff claims verification."
      id: "SC-WF-PHG-05"
    - criterion: "wf_trial_resolve_product_req_token accepts table turn-1 handoffs and dirname fallback under working/REQ-*/; resolve failure emits working basenames and found-unparsed handoff DIAGNOSTICs."
      id: "SC-WF-PHG-06"
    - criterion: "WF_TRIAL_SKIP_PHASE_HANDOFF_GATE=1 documented beside WF_TRIAL_SKIP_PROOF_MANIFEST in wf-trial agentstream help."
      id: "SC-WF-PHG-03"
    - criterion: "workflow-trial-agentstream-sh.test.mjs covers gate failure and skip env."
      id: "SC-WF-PHG-04"
