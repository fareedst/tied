    - criterion: "Report pairs raw_before vs pruner_jev_on reduction and p95 latency."
      id: "SC-BEFORE-AFTER"
      metric: "context-pruning-benchmark.v1 aggregate section"
    - criterion: "Token audit and tied_validate_consistency pass."
      id: "SC-TRACE"
      metric: "tied_validate_consistency"
