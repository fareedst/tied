      metric: "link review"
    - criterion: "request-evidence-envelope.md examples use tied-project/working layout-aware paths."
      id: "SC-WAP-ENVELOPE-DOC"
      metric: "doc review"
    - criterion: "tied-bundle/docs/working-artifact-placement.md covers tiers, both working roots, tooling scratch, and gray zones."
      id: "SC-WAP-GUIDE"
      metric: "doc review"
