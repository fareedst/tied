REQ-TIED_RUNTIME_DISK_CONFIG:
  description: "Operator global paths and non-secret toggles are install-managed on disk (.tied/store.yaml, operator.local.yaml, client MCP JSON)—not shell exports. Secrets stay in env."
  metadata:
    last_updated:
      author: "close-out-e2e-pass4"
      date: "2026-11-03"
      reason: "SC-RDC-E2E-METRICS-ALIGN bootstrap-and-load operator seeding"
  REQ-TIED_RUNTIME_DISK_CONFIG:
    related_requirements:
      depends_on:
        - "REQ-TIED_CLI_MCP_JSON_BASE_PATH"
        - "REQ-TIED_ENVIRONMENT_VARIABLE_POLICY"
        - "REQ-TIED_LAYERED_CLIENT_INSTALL"
      related_to:
        - "REQ-TIED_SETUP"
        - "REQ-TIED_TWO_FOLDER_LAYOUT"
  satisfaction_criteria_append:
    - criterion: "bootstrap-and-load e2e seeds store operator yaml and asserts metrics env matches SC-RDC-OPERATOR-DISK precedence (disk over install shell when defined)."
      id: "SC-RDC-E2E-METRICS-ALIGN"
      metric: "cd mcp-server && npx tsx --test src/e2e/bootstrap-and-load.test.ts"
    - criterion: "Non-secret operator toggles resolve from store operator yaml and sync to mcp.json on refresh (collect_metrics, envelope_hooks, agentstream preflight); shell export ignored when disk defines the toggle."
      id: "SC-RDC-OPERATOR-DISK"
      metric: "node --test tools/bootstrap/lib/tied-runtime-config.test.mjs tools/bootstrap/lib/mcp-config.test.mjs tools/bootstrap/lib/layers/mcp-layer.test.mjs"
    - criterion: "Shared fixture catalog cases produce identical normalized resolve output from bootstrap .mjs and agentstream .ts resolvers."
      id: "SC-RDC-FIXTURE-PARITY"
      metric: "node --test tools/bootstrap/lib/tied-runtime-cross-runtime-parity.test.mjs"
    - criterion: "tied_config_get_base_path returns disk-resolved store_root, mcp_dist_path, and config_sources aligned with bootstrap resolver."
      id: "SC-RDC-MCP-INTROSPECTION"
      metric: "cd mcp-server && npm run build && npx tsx --test src/tied-runtime-introspection.test.ts"
