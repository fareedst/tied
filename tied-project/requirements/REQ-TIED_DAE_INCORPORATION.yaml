      - "charter-compliance-table.test.ts"
      - "checklist-validator.test.ts"
      - "citdp-express-lane.test.ts"
      - "closure-join-report.test.ts"
      - "diff-scoped-crap.test.ts"
      - "gate-check.test.ts"
      - "handoff-yaml.test.ts"
      - "ontology-rules.test.ts"
      - "pseudocode-leakage-lint.test.ts"
      - "tied-gate-check-cli.test.ts"
      - "tied-next.test.ts"
  validation_criteria:
    - "Doc-only wave slices use checklist pre_implementation gate + CITDP draft updates"
    - "Each wave closes with tied_validate_consistency and wave-specific automated tests before REQ status advances"
