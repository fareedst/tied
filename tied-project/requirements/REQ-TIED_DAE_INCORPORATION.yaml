REQ-TIED_DAE_INCORPORATION:
  category: "Methodology"
  description: "Multi-wave program to adopt Disciplined Agentic Engineering (DAE) enforcement patterns into TIED without replacing the REQ/ARCH/IMPL token graph, IMPL pseudo-code sidecars, or persisted CITDP. Delivers operator ergonomics (gate check, tied next), validation depth (closure joins, leakage lint), optional verification charter tools (mutation, gauntlet), and graph-integrity extensions—coordinated by docs/comparisons/dae-mechanisms-for-tied-improvement.md and executed via working/REQ-TIED_DAE_INCORPORATION/PLAN.md."
  metadata:
    created:
      author: "plan-new-feature"
      date: "2026-09-24"
    last_updated:
      author: "plan-close-out"
      date: "2026-09-24"
      reason: "W0-W5 program close-out"
  name: "DAE mechanism incorporation program"
  priority: "P2"
  rationale:
    benefits:
      - "Clear wave boundaries and dependencies on shipped gate/toolchain REQs"
      - "Deterministic Step-0-style exits on Node MCP/CLI"
      - "Preserves LEAP and IMPL-as-logic while adding enforcement scaffolding"
    problems_solved:
      - "Executable backlog duplicated in docs/comparisons"
      - "No single REQ-owned program for DAE→TIED adoption"
      - "Operators compose MCP gate tools manually without ergonomic CLI"
    why: "TIED already ships partial DAE-adjacent gates (checklist gate validate, evidence envelope, dual harness); remaining gaps are scattered across comparison docs without a linked plan, Tracker, or REQ traceability."
  related_requirements:
    depends_on:
      - "REQ-TIED_CHECKLIST_GATE_ENFORCEMENT"
      - "REQ-TIED_SETUP"
      - "REQ-TIED_UNIFIED_TOOLCHAIN"
    related_to:
      - "REQ-TIED_ADVERSARIAL_INQUIRY"
      - "REQ-TIED_CLAUDE_ADHERENCE_HOOKS"
      - "REQ-TIED_CLAUDE_HARNESS"
      - "REQ-TIED_DAE_VERIFICATION_CHARTER"
    supersedes: []
  satisfaction_criteria:
    - criterion: "Linked PLAN.md records six waves, non-goals, success criteria, and dependency REQs; coordinator guide links to PLAN without duplicating full backlog."
      id: "SC-DAE-WAVE-PLAN"
      metric: "working/REQ-TIED_DAE_INCORPORATION/PLAN.md (tracked); optional local coordinator under docs/comparisons/ (gitignored)"
    - criterion: "Wave 0 (maintain) documents shipped gate surface and regression ownership; no regression in tied_checklist_gate_validate or dual harness paths."
      id: "SC-DAE-WAVE0-MAINTAIN"
      metric: "Wave 0 checklist + existing gate tests"
    - criterion: "Wave 1 delivers unified gate check and/or tied next operator entry with non-zero exit on blocked gates (DAE Step 0 parity)."
      id: "SC-DAE-WAVE1-ERGONOMICS"
      metric: "@tied/cli or MCP wrapper tests + operator doc"
    - criterion: "Wave 2 ships at least branch hygiene check and pseudocode leakage lint (charter-flagged diff-scoped change-risk report / express lane may follow same wave)."
      id: "SC-DAE-WAVE2-QUICK-WINS"
      metric: "MCP or CLI tests + checklist slug hooks"
    - criterion: "Wave 3 publishes four-way closure join report and documents mechanical vs judgment split in pseudo-code validation guide."
      id: "SC-DAE-WAVE3-VALIDATION"
      metric: "pseudocode_analyze or sibling tool + doc update"
    - criterion: "Waves 4–5 remain charter-optional with explicit CITDP size/gate_profile fields; hard disjoint verifier and ontology extensions gated by project policy."
      id: "SC-DAE-WAVE4-5-CHARTER"
      metric: "CITDP template fields + verification-gate integration tests when adopted"
  status: "Implemented"
  traceability:
    architecture:
      - "ARCH-TIED_DAE_INCORPORATION"
    code_annotations: []
    implementation:
      - "IMPL-TIED_DAE_INCORPORATION"
    tests:
