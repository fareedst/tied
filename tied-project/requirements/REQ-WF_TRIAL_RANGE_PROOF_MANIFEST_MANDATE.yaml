REQ-WF_TRIAL_RANGE_PROOF_MANIFEST_MANDATE:
  acceptance_criteria:
    - "SC-RPM-01 through SC-RPM-08"
  description: "workflow-trial-agentstream default-on post-four-phase gate for proof-facet-manifest.v1 (all PROMPT-WF-01..12); WF_TRIAL_SKIP_PROOF_MANIFEST escape only."
  satisfaction_criteria:
    - criterion: "Four-phase non-zero exit preserved over gate."
      id: "SC-RPM-07"
    - criterion: "Gate applies to PROMPT-WF-01..12 when enabled."
      id: "SC-RPM-04"
    - criterion: "Gate rejects files[].path not found under workspace (FILE_EXISTS)."
      id: "SC-RPM-09"
    - criterion: "Help documents default-on gate and SKIP only."
      id: "SC-RPM-06"
    - criterion: "Missing manifest fails gate when four-phase exit 0."
      id: "SC-RPM-02"
    - criterion: "Scaffold seeds template at primary path when absent."
      id: "SC-RPM-08"
    - criterion: "Valid minimal manifest on fixture workspace passes gate."
      id: "SC-RPM-05"
    - criterion: "wf_trial_proof_manifest_gate_enabled true with no env; WF_TRIAL_REQUIRE_PROOF_MANIFEST absent from shell/docs."
      id: "SC-RPM-01"
    - criterion: "WF_TRIAL_SKIP_PROOF_MANIFEST=1 disables gate with DIAGNOSTIC."
      id: "SC-RPM-03"
    - criterion: "When src/**/*.test.ts count positive, files[] length must be >= test file count (FILE_COVERAGE)."
      id: "SC-RPM-10"
