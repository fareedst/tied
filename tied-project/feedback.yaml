    description: "Observed on client REQ-GLOSSARY_RENAME_CHECK (TIED-DEMO-04 greenfield): traceable-commit close-out split into machine pass (close_out gate allowed, envelope fail_on_error_gaps=0) while process contract and adherence ledger remained partial. run-close-out-gates.mjs failed before root VERSION existed; tied_adherence_reconcile_run failed with repo root not found when project_root was wrong; execution_evidence.close_out_evidence referenced gate receipt paths that were never written while older close_out receipts existed on disk; sub-close-out-evidence-sync stayed pending though feature shipped and handoff documented partial signals.\n\nProblem: Agents and sponsors lack a first-class, checklist-aligned path for \"close-out completion (Wave 5)\" when machine close-out succeeds early (often via MCP gate + envelope MCP) but sub-close-out-evidence-sync (disposition sync, reconcile, dual-write) does not. Today this becomes ad-hoc addendum prompts and ambiguous \"done\" (EXIT vs ship).\n\nRequested improvements (methodology + tooling):\n\n1) Checklist / prompt-shared: Document \"close-out completion pass\" as normative recovery within traceable-commit (not a new lifecycle phase): same REQ, CALL sub-close-out-evidence-sync, three completion signals must all pass before declaring EXIT. Provide a bundled prompt slug or handoff template (e.g. close-out-wave5-completion) linked from completion-signals-handoff.md.\n\n2) run-close-out-gates.mjs / sync-tracker-dispositions.mjs: Fail closed or block marking machine close-out complete when reconcile or disposition sync did not run; or emit explicit partial receipt with required follow-up slugs. Auto-detect git repo root vs TIED_BASE_PATH and pass project_root correctly to tied_adherence_reconcile_run. Align generated gate paths in tracker dual-write with files actually written in gates/.\n\n3) MCP tied_gate_check / tied_checklist_gate_validate: Return structured reasons when allowed=true but process_grade or tracker dual-write is incomplete (warn vs allow policy at minimal depth). request_evidence_envelope_validate could surface process-adherence gaps separately from blocking error gaps.\n\n4) tied-yaml skill: Add \"close-out recovery\" procedure: ordered CLI/MCP calls, correct project_root, re-run gates if tracker hash changes, tied_verify update, handoff three-signal update. Mention VERSION and other bootstrap deps before envelope tooling.\n\n5) tied_feedback_capture_observation: Optional kaizen hook when close_out allowed while sub-close-out-evidence-sync pending in tracker (inconsistency detector).\n\nEvidence: tied-project/working/REQ-GLOSSARY_RENAME_CHECK/evidence/close-out-handoff.md\nContext: TIED 4.0.0, depth_tier minimal, gate_policy advisory.\n\nStore ingest note: Items 1, 4, 5 are documentation/skill addendum (Track B LEAP); Wave 5 CITDP remains primary tooling owner."
