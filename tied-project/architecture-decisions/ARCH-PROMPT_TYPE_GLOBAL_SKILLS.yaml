ARCH-PROMPT_TYPE_GLOBAL_SKILLS:
  alternatives_considered:
    - cons:
        - "No versioned source of truth and high drift risk"
      name: "Copy skills directly into each client without a TIED canonical bundle"
      pros:
        - "Simple one-off installation"
      rejected_reason: "Duplicates maintenance across projects."
    - cons:
        - "Adds availability/versioning dependency to bootstrap"
      name: "Fetch skills from an external runtime package"
      pros:
        - "Centralized distribution outside git"
      rejected_reason: "TIED bootstrap should remain deterministic and repository-backed."
    - cons:
        - "Not reproducible across developers or TIED projects"
      name: "Keep skills only under ~/.cursor/skills/"
      pros:
        - "No repository changes"
      rejected_reason: "Does not satisfy ongoing shared development or client bootstrap needs."
  decision: "Maintain one git-tracked canonical prompt-type skill bundle in the TIED methodology repository and install its managed contents into each TIED client’s .cursor/skills/ directory through tied-install.sh."
  implementation_approach:
    details:
      - "close-out is the authorized prompt-type leaf for stage/commit after unified close_out; other leaves keep the no-git-mutation contract unless documented otherwise."
      - "Copy tied-bundle/docs/prompt-type-skills.md when missing so clients receive the distribution contract and maintenance guidance."
      - "Install only the managed prompt-type directories and prompt-shared directory; preserve unrelated client skills."
      - "Keep the 13 leaf SKILL.md files, prompt-type-router/SKILL.md, and the prompt-shared Markdown inventory enumerated in mcp-server/src/e2e/prompt-type-skills.test.ts SHARED_REFERENCES (includes traceable-commit-close-out.md and gitignore-close-out-hygiene.md)."
      - "Leaf skills take an invocation remainder; refine-plan and build-plan take a linked or in-message plan. Skills do not use a triple-colon payload delimiter or emit composer headers."
      - "Treat installed prompt skills as refreshable tooling artifacts, analogous to the bundled tied-yaml skill."
    summary: "Use tools/bundled-prompt-type-skills as the canonical source and copy its explicit managed file set into client .cursor/skills during tied-install.sh refresh."
  metadata:
    created:
      author: "AI Agent"
      date: "2026-08-12"
    last_updated:
      author: "AI Agent"
      date: "2026-09-10"
      reason: "Document fifteenth prompt-shared reference for gitignore close-out hygiene"
  name: "Hybrid Prompt-Type Skill Bundle"
  rationale:
    benefits:
      - "Relative ../prompt-shared links remain local and resolvable."
      - "Simple tied-install.sh rollout to existing and new clients."
      - "Unrelated client skills and existing MCP configuration remain outside the managed bundle."
      - "Versioned source of truth in the TIED repository."
    problems_solved:
      - "A project-local copy without a canonical TIED source can drift between clients."
      - "A remote or runtime dependency would make bootstrap less deterministic."
      - "Personal-only skill files are not reproducible across projects."
    why: "The prompt workflows are shared development tooling, while client-local installation is needed for Cursor to resolve relative shared references and for each project to receive a reproducible version."
  related_decisions:
    depends_on:
      - "ARCH-TIED_STRUCTURE"
    see_also:
      - "IMPL-TIED_FILES"
    supersedes: []
  status: "Active"
  traceability:
    architecture:
      - "ARCH-PROMPT_TYPE_GLOBAL_SKILLS"
    code_annotations:
      - "ARCH-PROMPT_TYPE_GLOBAL_SKILLS"
      - "IMPL-PROMPT_TYPE_GLOBAL_SKILLS"
      - "REQ-PROMPT_TYPE_GLOBAL_SKILLS"
    requirements:
      - "REQ-PROMPT_TYPE_GLOBAL_SKILLS"
    tests:
      - "mcp-server/src/e2e/prompt-type-skills.test.ts"
