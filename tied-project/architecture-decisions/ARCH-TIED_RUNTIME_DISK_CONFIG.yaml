ARCH-TIED_RUNTIME_DISK_CONFIG:
  ARCH-TIED_RUNTIME_DISK_CONFIG:
    decision: "Centralize runtime resolution in tools/bootstrap/lib/tied-runtime-config.mjs. Clients read .cursor/mcp.json (then .mcp.json) tied-yaml server entry; store mode reads .tied/store.yaml with store.local.yaml overlay. Install refresh writes store.local.yaml and MCP JSON env via installMcpLayer. MCP tied-layout.ts may implement a subset of layout.mjs store-runtime markers—document intentional gap; full parity deferred."
    implementation_approach:
      details:
        - "deriveStoreRootFromMcpDist from args[0]"
        - "Intentional subset: MCP layout introspection not required for SC-RDC-*"
        - "refreshStoreRuntimeConfig on store refresh"
      summary: "tied-runtime-config.mjs + mcp layer refresh; no shell path authority for global roots."
    name: "On-disk runtime config surfaces"
    rationale:
      benefits:
        - "Fail-closed diagnostics with RUNTIME_DIAGNOSTIC prefix"
        - "Store self-refresh allowSelfInstall composes with layered install"
      problems_solved:
        - "IMPL pseudo-code drift from shipped install refresh guards"
        - "Undocumented operator reliance on shell exports"
      why: "Single module tested with bootstrap; aligns CLI, MCP stdio child, and agentstream disk resolver."
    related_decisions:
      depends_on:
        - "ARCH-TIED_CLI_MCP_JSON_BASE_PATH"
        - "ARCH-TIED_LAYERED_CLIENT_INSTALL"
        - "ARCH-TIED_TWO_FOLDER_LAYOUT"
      related_to:
        - "ARCH-TIED_BOOTSTRAP_CROSS_PLATFORM"
    traceability:
      implementation:
        - "IMPL-TIED_RUNTIME_DISK_CONFIG"
      requirements:
        - "REQ-TIED_RUNTIME_DISK_CONFIG"
