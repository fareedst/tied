        - "IMPL-KAIZEN-OUTCOME-LOOP"
      requirements:
        - "REQ-KAIZEN-FEEDBACK-ANALYSIS"
        - "REQ-KAIZEN-OUTCOME-LOOP"
    name: "Kaizen outcome loop architecture"
    rationale:
      decisions:
        - "feedback-outcome-loop.ts orchestrates baseline, window, evidence validation, and append-only persist"
        - "outcome-observation.v1 schema stored under entry.context.outcome_observations"
        - "Regression returns structured facet for buildFeedbackDigest rerun; separate from LEAP canonical apply"
