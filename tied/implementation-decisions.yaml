  essence_pseudocode: "# [IMPL-GOAGENT-NON-COMPACT-HTML-FORMAT] [ARCH-GOAGENT-NON-COMPACT-HTML-FORMAT] [REQ-GOAGENT-NON-COMPACT-HTML-FORMAT]\n# Summary: When enabled, a single post-pipeline, post-ApplyPromptFilePreload pass reformats each string in Turn.Parts to non-compact UTF-8 HTML; ordering and ChainFromPrevious bits unchanged. Default: disabled.\n\n# [IMPL-GOAGENT-NON-COMPACT-HTML-FORMAT] [ARCH-GOAGENT-NON-COMPACT-HTML-FORMAT] [REQ-GOAGENT-NON-COMPACT-HTML-FORMAT] — CONTRACT: INPUT, OUTPUT, DATA, CONTROL\n# INPUT: turns ([]Turn from IMPL-GOAGENT-PIPELINE.Build, after ReadPromptFilePreload/ApplyPromptFilePreload in IMPL-GOAGENT-CLI-CMD); options { enabled: bool, stable_indent: int } from resolved Config; body fragments may be markdown or plain from prior checklist/tdd/feature text render.\n# OUTPUT: same []Turn length, order, and field shapes; only string elements in Parts are replaced when enabled.\n# DATA: []Turn, UTF-8 strings, determinism: identical logical input + same options => identical output string per part.\n# CONTROL: enabled is false on zero-args default; when false, this IMPL is a no-op. Does not re-parse YAML, change step ids, or call executor.\n\n# How: All REQ/ARCH behavior for the named transform lives here; other IMPLs do not embed HTML rules—only this procedure.\n\nprocedure APPLY_TO_TURNS(turns, options):\n  # [IMPL-GOAGENT-NON-COMPACT-HTML-FORMAT] [ARCH-GOAGENT-NON-COMPACT-HTML-FORMAT] [REQ-GOAGENT-NON-COMPACT-HTML-FORMAT]\n  # How: No-op if options.enabled is false; else in-place FORMAT; propagate any FORMAT err\n  if not options.enabled:\n    return turns, nil\n  for each turn in turns:\n    for i, part in enumerate(turn.Parts):\n      s, err := FORMAT_NON_COMPACT_HTML(part, options)\n      if err != nil:\n        return nil, err\n      turn.Parts[i] = s\n  return turns, nil\n\nprocedure FORMAT_NON_COMPACT_HTML(part, options):\n  # [IMPL-GOAGENT-NON-COMPACT-HTML-FORMAT] [ARCH-GOAGENT-NON-COMPACT-HTML-FORMAT] [REQ-GOAGENT-NON-COMPACT-HTML-FORMAT]\n  # How: map one part to stable line-broken form; pass-through when not options.enabled; empty part returns empty\n  if part == \"\":\n    return \"\", nil\n  if not options.enabled:\n    return part, nil\n  out := DETERMINISTIC_NON_COMPACT_HTML_FOR_PART(part, options)\n  return out, nil\n\nprocedure DETERMINISTIC_NON_COMPACT_HTML_FOR_PART(text, options):\n  # [IMPL-GOAGENT-NON-COMPACT-HTML-FORMAT] [ARCH-GOAGENT-NON-COMPACT-HTML-FORMAT] [REQ-GOAGENT-NON-COMPACT-HTML-FORMAT]\n  # How: UTF-8: break at adjacent tags; else newline after first \">\"; else append newline; if stable_indent>0 prefix continuation lines. (Go: htmlformat package.)\n\n# [IMPL-GOAGENT-NON-COMPACT-HTML-FORMAT] [ARCH-GOAGENT-NON-COMPACT-HTML-FORMAT] [REQ-GOAGENT-NON-COMPACT-HTML-FORMAT] and caller [IMPL-GOAGENT-CLI-CMD] [ARCH-GOAGENT-CLI] [REQ-GOAGENT-CLI-CONFIG] — INTEGRATE edge only.\nprocedure INTEGRATE_WITH_MAIN(cfg, turns, options):\n  if cfg is nil or turns is nil: return\n  if not (cfg has non-compact-HTML true): return\n  t2, err := APPLY_TO_TURNS(turns, options)\n  on err != nil: return error to main\n\n# [IMPL-GOAGENT-NON-COMPACT-HTML-FORMAT] [ARCH-GOAGENT-NON-COMPACT-HTML-FORMAT] [REQ-GOAGENT-NON-COMPACT-HTML-FORMAT] [ARCH-GOAGENT-CLI] [REQ-GOAGENT-CLI-CONFIG] — How: map ParseAndResolve `config` to CfgForIntegrate + options; no I/O. Go: applyPostPreloadNonCompactHTML (cmd); composition-tested; then INTEGRATE_WITH_MAIN.\nprocedure MAP_CONFIG_TO_HTMLFORMAT_OPTIONS(resolved_config, turns):\n  # How: build ic and o; delegate to INTEGRATE_WITH_MAIN (in-place `turns`)\n  ic = { non_compact: resolved_config.NonCompactHTML }\n  o = { enabled: resolved_config.NonCompactHTML, stable_indent: resolved_config.NonCompactHTMLStableIndent }\n  return INTEGRATE_WITH_MAIN(ic, turns, o)\n\n# [PROC-IMPL_CODE_TEST_SYNC] Phase H — E2E e2e_only boundary: [IMPL-GOAGENT-NON-COMPACT-HTML-FORMAT] [REQ-MODULE_VALIDATION] [PROC-TEST_STRATEGY] [PROC-AGENT_REQ_CHECKLIST] — no e2e_only blocks; string transform and CLI are unit + composition; phase_h_tests []; named platform UI constraint n/a. IMPL-ATDD-E2E-AGENT_STREAM is a separate ATDD subprocess scope.\n"
  implementation_approach:
