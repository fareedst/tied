  code_locations:
    files:
      - description: "Project-scoped Cursor Task subagent prompt wrappers for the 13 leaf prompt types"
        path: ".cursor/agents/"
      - description: "Static frontmatter, prompt contract, and TIED-source wrapper tests"
        path: "mcp-server/src/e2e/prompt-type-subagent.test.ts"
  cross_references:
    - "ARCH-PROMPT_TYPE_SUBAGENT"
    - "REQ-PROMPT_TYPE_GLOBAL_SKILLS"
    - "REQ-PROMPT_TYPE_SUBAGENT"
  description: "Thin foreground Cursor Task wrappers for all 13 leaf prompt types in the TIED source repository, plus a plan-refine-build sequencer that Task-launches those three leaves in order using invocation remainder then linked plans."
  detail_file: "implementation-decisions/IMPL-PROMPT_TYPE_SUBAGENT.yaml"
  essence_pseudocode: "# [IMPL-PROMPT_TYPE_SUBAGENT] [ARCH-PROMPT_TYPE_SUBAGENT] [REQ-PROMPT_TYPE_SUBAGENT]\n# Summary: Validate the explicit-only writable plan-new-feature Task wrapper and its clean-context workflow contract.\n\nContract:\n  INPUT: agent_markdown; canonical_skill_markdown; test_contract\n  PRE: agent_markdown is readable; canonical_skill_markdown exists; test_contract names required clauses\n  OUTPUT: pass or contract_violation diagnostics\n  POST: pass means frontmatter, delegation, workflow gates, safety boundary, and parent handoff contract are present\n  FAILURE_MODES: missing_agent; invalid_frontmatter; invalid_activation; missing_skill_reference; missing_gate; missing_safety_boundary; missing_return_contract\n  DATA: frontmatter; prompt_body; required_clauses\n  EFFECTS: IO\n  TERMINATION: total\n\nprocedure VALIDATE_PROMPT_TYPE_SUBAGENT_CONTRACT(agent_markdown, canonical_skill_markdown, test_contract):\n  # [IMPL-PROMPT_TYPE_SUBAGENT] [ARCH-PROMPT_TYPE_SUBAGENT] [REQ-PROMPT_TYPE_SUBAGENT] — How: verify the agent file is an explicit-only writable foreground wrapper around the canonical plan-new-feature skill.\n  Contract:\n    INPUT: agent_markdown; canonical_skill_markdown; test_contract\n    PRE: all inputs are readable text\n    OUTPUT: pass or contract_violation diagnostics\n    POST: pass means each required frontmatter and body clause is present\n    FAILURE_MODES: invalid_frontmatter; invalid_activation; missing_skill_reference; missing_gate; missing_safety_boundary; missing_return_contract\n    EFFECTS: IO\n    TERMINATION: total\n  PARSE frontmatter from agent_markdown\n  CHECK name equals plan-new-feature\n  CHECK readonly equals false\n  CHECK is_background equals false\n  CHECK description contains positive and negative activation guidance\n  CHECK description excludes proactive activation language\n  CHECK prompt_body references tools/bundled-prompt-type-skills/plan-new-feature/SKILL.md\n  CHECK prompt_body orders Refine before Plan before Implement\n  CHECK prompt_body blocks Plan until ambiguity is cleared\n  CHECK prompt_body blocks code until token-commented IMPL pseudo-code and test strategy exist\n  CHECK prompt_body forbids clipboard and automatic Git mutation\n  CHECK prompt_body requires explicit TIED applicability and parent-visible validation evidence\n  RETURN pass or diagnostics\n\nprocedure REPORT_PROMPT_TYPE_SUBAGENT_RESULT(execution_evidence):\n  # [IMPL-PROMPT_TYPE_SUBAGENT] [ARCH-PROMPT_TYPE_SUBAGENT] [REQ-PROMPT_TYPE_SUBAGENT] — How: return auditable workflow evidence to the parent without overstating completion.\n  Contract:\n    INPUT: execution_evidence\n    PRE: execution_evidence records completed gates and validation outcomes\n    OUTPUT: parent_handoff\n    POST: parent_handoff names resolved terms, Tracker, CITDP status, tests, validation, and remaining risks\n    EFFECTS: pure\n    TERMINATION: total\n  INCLUDE resolved terms and vocabulary status\n  INCLUDE per-request Tracker path\n  INCLUDE CITDP path or deferred status\n  INCLUDE tests and validation results\n  INCLUDE remaining risks and blocked gates\n  IF verification-gate or tied_validate_consistency failed:\n    MARK completion as incomplete\n  RETURN parent_handoff\n"
  implementation_approach:
    details:
      - "Description is explicit-only and includes neighboring prompt-type exclusions without proactive activation language."
      - "Each body directly names the canonical skill, vocabulary preload, type-specific gates, forbidden operations, and return evidence."
      - "Frontmatter sets is_background false; readonly is false for implementing and close-out wrappers and true for question and other."
      - "Prompt-type Task wrappers remain under .cursor/agents/ in the TIED source repository only; copy_files.sh installs skills, not agents, into client projects."
      - "Static contract tests parse frontmatter and assert required clauses for each TIED-source wrapper."
    summary: "Validate and maintain one TIED-source agent per leaf prompt type whose prompt delegates to the canonical skill, carries clean-context gates and parent handoff requirements, while client projects use skills instead."
  metadata:
    created:
      author: "AI Agent"
      date: "2026-08-12"
    last_updated:
      author: "AI Agent"
      date: "2026-08-13"
      reason: "DISPATCH_PROMPT_TYPE_SEQUENCE uses invocation remainder and linked plan"
    last_validated:
      author: "AI Agent"
      date: "2026-08-12"
      result: "pass"
  name: "Prompt-Type Task Subagent Contract"
  rationale:
    benefits:
      - "Deterministic contract coverage for a Markdown agent definition."
      - "Parent agents receive auditable completion evidence."
      - "Single workflow source remains the bundled plan-new-feature skill."
    problems_solved:
      - "The absence of tests permits contract drift."
      - "The one-line body is not a reliable skill include."
      - "The readonly stub cannot implement."
    why: "The Task wrapper must preserve the canonical skill workflow while making write permissions, safety gates, and parent-visible evidence explicit in an isolated context."
