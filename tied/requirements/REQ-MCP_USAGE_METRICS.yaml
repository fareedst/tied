REQ-MCP_USAGE_METRICS:
  category: "Functional"
  detail_file: "requirements/REQ-MCP_USAGE_METRICS.yaml"
  metadata:
    created:
      author: "AI Agent"
      date: "2026-06-25T00:00:00.000Z"
    last_updated:
      author: "AI Agent"
      date: "2026-08-23"
      reason: "Add bounded signature coverage and aggregate schema-error acceptance criteria for deferred-stats Phase 2"
    last_validated:
      date: "2026-06-25T00:00:00.000Z"
      result: "pass"
      validator: "AI Agent"
  name: "Opt-in local MCP tool usage metrics"
  priority: "P2"
  rationale:
    benefits:
      - "Frequency and latency stats per tool and client surface (IDE MCP vs tied-cli)"
      - "Offline analysis informs MCP/API improvements and tied_feedback_add reports"
      - "Sanitized arg summaries reveal common call patterns without logging full payloads"
    problems_solved:
      - "No visibility into how agents use TIED YAML MCP tools in practice"
      - "tied-cli and headless runs are invisible to Cursor hook logs"
    why: "Teams need optional, local-first instrumentation to learn which MCP tools are used, how often, and with what intent—without enabling collection by default or exporting data off-machine."
  related_requirements:
    depends_on:
      - "REQ-TIED_SETUP"
    related_to:
      - "REQ-FEEDBACK_TO_TIED"
    supersedes: []
  satisfaction_criteria:
    - criterion: "Aggregate output must not report schema_errors=0 when any accepted input report contains a schema error"
      metric: "analyze_tied_mcp_metrics_test.rb negative multi-file schema-error fixture"
    - criterion: "Aggregate schema_errors equals the sum of schema_errors from every input report while parse_errors remain separately accounted"
      metric: "analyze_tied_mcp_metrics_test.rb asserts two files with one schema error each produce aggregate schema_errors=2"
    - criterion: "Bootstrap seeds metrics environment fields only for an absent .cursor/mcp.json when TIED_MCP_COLLECT_METRICS is exactly 1"
      metric: "bootstrap-and-load.test.ts verifies basename and explicit client labels, non-1 opt-in behavior, and existing configuration preservation"
    - criterion: "Env vars and JSONL path documented in tied/vocab/tied-yaml-mcp.md"
    - criterion: "Every MCP tools/call records tool name, client, duration, ok, sanitized args"
      metric: "usage-metrics.test.ts passes; large essence_pseudocode omitted from args_summary"
    - criterion: "Metrics collection is off unless TIED_MCP_COLLECT_METRICS is set locally"
      metric: "No JSONL append when env unset; append when set to 1 or true"
    - criterion: "Offline aggregator reports tool counts, failures, and top arg signatures"
      metric: "analyze_tied_mcp_metrics_test.rb passes"
    - criterion: "Offline reports expose deterministic SIGNATURE_BOUND=50 signature_coverage as exact_within_bound when a file has 0 or 50 distinct signatures and an aggregate visible candidate union is at most 50 with every input exact"
      metric: "analyze_tied_mcp_metrics_test.rb asserts positive 0/50 per-file boundaries and exact aggregate coverage"
    - criterion: "Offline reports expose signature_coverage as approximate when a file has 51 distinct signatures, visible aggregate candidates exceed 50, or any per-file input was already approximate; aggregate rows must not claim hidden candidates are globally ranked"
      metric: "analyze_tied_mcp_metrics_test.rb asserts negative 51-signature, visible-overflow, per-file-truncation, and reversed-input-order cases including deterministic sample selection"
    - criterion: "tied-cli tags client as tied-cli when metrics enabled"
      metric: "tied-cli.sh exports TIED_MCP_METRICS_CLIENT=tied-cli"
  status: "Implemented"
  traceability:
    architecture:
      - "ARCH-MCP_USAGE_METRICS"
      - "ARCH-TIED_PROJECT_IDENTITY"
    code_annotations:
      - "ARCH-MCP_USAGE_METRICS"
      - "IMPL-MCP_USAGE_METRICS"
      - "REQ-MCP_USAGE_METRICS"
    implementation:
      - "IMPL-MCP_USAGE_METRICS"
      - "IMPL-TIED_PROJECT_IDENTITY"
    tests:
      - "analyze_tied_mcp_metrics_test.rb"
      - "project-identity.test.ts"
      - "usage-metrics.test.ts"
  validation_criteria:
    - coverage: "analyze_tied_mcp_metrics.rb fixture aggregation"
      method: "Ruby smoke test"
    - coverage: "usage-metrics module and wrapToolHandler"
      method: "Unit tests"
