  name: "Opt-in local MCP tool usage metrics"
  priority: "P2"
  rationale:
    benefits:
      - "Frequency and latency stats per tool and client surface (IDE MCP vs tied-cli)"
      - "Offline analysis informs MCP/API improvements and tied_feedback_add reports"
      - "Sanitized arg summaries reveal common call patterns without logging full payloads"
    problems_solved:
      - "No visibility into how agents use TIED YAML MCP tools in practice"
      - "tied-cli and headless runs are invisible to Cursor hook logs"
    why: "Teams need optional, local-first instrumentation to learn which MCP tools are used, how often, and with what intent—without enabling collection by default or exporting data off-machine."
  related_requirements:
    depends_on:
      - "REQ-TIED_SETUP"
    related_to:
      - "REQ-FEEDBACK_TO_TIED"
    supersedes: []
  satisfaction_criteria:
    - criterion: "Bootstrap seeds metrics environment fields only for an absent .cursor/mcp.json when TIED_MCP_COLLECT_METRICS is exactly 1"
      metric: "bootstrap-and-load.test.ts verifies basename and explicit client labels, non-1 opt-in behavior, and existing configuration preservation"
    - criterion: "Env vars and JSONL path documented in tied/vocab/tied-yaml-mcp.md"
    - criterion: "Every MCP tools/call records tool name, client, duration, ok, sanitized args"
      metric: "usage-metrics.test.ts passes; large essence_pseudocode omitted from args_summary"
    - criterion: "Metrics collection is off unless TIED_MCP_COLLECT_METRICS is set locally"
      metric: "No JSONL append when env unset; append when set to 1 or true"
    - criterion: "Offline aggregator reports tool counts, failures, and top arg signatures"
      metric: "analyze_tied_mcp_metrics_test.rb passes"
    - criterion: "tied-cli tags client as tied-cli when metrics enabled"
      metric: "tied-cli.sh exports TIED_MCP_METRICS_CLIENT=tied-cli"
  status: "Implemented"
  traceability:
    architecture:
      - "ARCH-MCP_USAGE_METRICS"
