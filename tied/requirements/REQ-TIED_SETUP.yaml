REQ-TIED_SETUP:
  category: "Functional"
  description: "TIED setup provides a deterministic client bootstrap: it creates the TIED structure, installs managed skills and the 13 leaf prompt-type Task wrappers, preserves attributes with cp -p/cp -pR, normalizes only client-copy mtimes to each source item's local calendar-date midnight, and warns before replacing destinations whose mtimes are not midnight."
  detail_file: "requirements/REQ-TIED_SETUP.yaml"
  implementation_approach:
    details:
      - "Bootstrap managed artifacts preserve copy attributes where supported, leave source files unchanged, normalize only client-copy mtimes to each source item's local calendar-date midnight, and warn when an existing managed destination has a non-midnight mtime before refresh."
      - "The canonical .cursor/agents/<prompt-type>.md Task wrappers for all 13 leaf prompt types are installed in clients with the managed prompt-type distribution and receive destination-only source-date midnight normalization."
    summary: "Provide deterministic TIED client bootstrap with source-preserving copies, destination-only local-midnight metadata, and non-midnight modification detection."
  metadata:
    created:
      author: "AI Agent"
      date: "2025-11-08T00:00:00.000Z"
    last_updated:
      author: "AI Agent"
      date: "2026-08-13"
      reason: "Install all 13 leaf prompt-type Task wrappers during bootstrap"
    last_validated:
      date: "2026-02-06T00:00:00.000Z"
      result: "pass"
      validator: "AI Agent"
  name: "TIED Methodology Setup"
  priority: "P0"
  rationale:
    benefits:
      - "AI-friendly documentation structure"
      - "Complete traceability from requirements to code"
      - "Consistent development methodology"
    problems_solved:
      - "Difficulty tracking requirements through architecture to implementation"
      - "Inconsistent documentation practices across projects"
      - "Loss of intent during development lifecycle"
    why: "To ensure traceability of intent from requirements to code and to maintain a consistent development process"
  related_requirements:
    depends_on: []
    related_to: []
    supersedes: []
  satisfaction_criteria:
    - criterion: "./tied/ directory exists with proper structure"
    - criterion: "All required documentation files exist and are populated from templates"
      metric: "requirements.yaml, architecture-decisions.yaml, implementation-decisions.yaml, semantic-tokens.yaml, semantic-tokens.md, processes.md all present"
    - criterion: "Base files properly configured"
      metric: ".cursorrules contains TIED rules, AGENTS.md contains canonical AI agent instructions"
    - criterion: "copy_files.sh seeds tied/vocab/ when client tied/vocab/ is missing or empty (minimum domain-references.md and tied-methodology.md)"
      metric: "After bootstrap, tied/vocab/*.md present; existing client vocab files never overwritten"
    - criterion: "Detail directories exist"
      metric: "requirements/, architecture-decisions/, implementation-decisions/ directories present"
    - criterion: "Domain vocabulary for TIED layout (project YAML, semantic token, TIED base path) is defined in tied/vocab/tied-methodology.md; naming uses sub-vocabulary-sync RESOLVE/RECORD per [PROC-VOCABULARY_INDEX]"
    - criterion: "The vocabulary layer is an agent-control layer that applies RESOLVE, PRELOAD, RECORD, and VALIDATE across TIED work"
      metric: "Canonical vocabulary rows and checklist/process references use the same terms"
    - criterion: "YAML validation uses the tied-yaml-canonical-v1 profile through scripts/yaml_tool.sh or lint_yaml per [PROC-YAML_EDIT_LOOP]"
      metric: "Recursive lexical map ordering, ordered-list key exceptions, string-only list sorting, scalar-type preservation, and opaque block policy are documented and tested"
    - criterion: "Existing clients can follow tied/docs/methodology-migration.md when adopting a newer methodology snapshot"
      metric: "Migration guide is installed when missing and preserves client-owned project YAML and customized documentation"
    - criterion: "copy_files.sh --merge-vocab adds absent glossary basenames without overwriting existing client vocabulary"
      metric: "Existing client glossary contents remain unchanged while missing canonical glossaries are added"
    - criterion: "Refreshing inherited methodology preserves project YAML and installs promoted quality detail files and pseudo-code sidecars"
      metric: "tied/methodology/ matches the current template snapshot and stale inherited files are pruned"
    - criterion: "When .cursor/mcp.json already exists, copy_files.sh preserves its exact bytes and does not initialize or merge tied-yaml into it"
      metric: "Bootstrap E2E refresh fixture compares the pre-existing MCP config byte-for-byte after refresh"
    - criterion: "Managed bootstrap artifacts preserve supported attributes, retain source content, normalize only client-copy mtimes to each source item's local calendar-date midnight, and warn before replacement when an existing destination mtime is not midnight"
      metric: "Prompt skill/bootstrap tests verify cp flags, source immutability, destination midnight mtime, and warning output"
    - criterion: "copy_files.sh installs the canonical .cursor/agents/<prompt-type>.md wrappers for all 13 leaf prompt types into clients"
      metric: "Installed agent content is byte-identical to the source and refresh restores an edited copy"
  status: "Implemented"
  traceability:
