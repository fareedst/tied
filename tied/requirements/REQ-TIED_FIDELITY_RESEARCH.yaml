    - criterion: "Candidate findings retain lifecycle, evidence, provenance, and proof-boundary information."
    - criterion: "Deterministic reruns link duplicates without inflating defect counts."
    - criterion: "Specification change, implementation lag, missing specification, and implementation defect remain distinct outcomes."
  status: "Active"
  traceability:
    architecture:
      - "ARCH-TIED_FIDELITY_RESEARCH"
    code_annotations:
