      - "mcp-server/src/fidelity-research/deterministic-rerun.test.ts"
      - "mcp-server/src/fidelity-research/fidelity-audit.test.ts"
      - "mcp-server/src/fidelity-research/finding-ledger.test.ts"
      - "mcp-server/src/fidelity-research/first-slice.test.ts"
      - "mcp-server/src/fidelity-research/manifest.test.ts"
      - "mcp-server/src/fidelity-research/pilot.test.ts"
