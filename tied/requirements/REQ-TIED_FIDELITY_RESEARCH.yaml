REQ-TIED_FIDELITY_RESEARCH:
  category: "Functional"
  description: "Provide a read-only research capability that measures fidelity and defect origin across domain vocabulary, REQ, ARCH, IMPL pseudo-code, tests, code, and documentation."
  metadata:
    last_updated:
      author: "AI Agent"
      date: "2026-08-09"
      reason: "Record first vertical slice implementation and test traceability"
  name: "TIED Fidelity Research"
  priority: "P1"
  rationale:
    benefits:
      - "Read-only defect-origin analysis"
      - "Reproducible evidence and provenance"
      - "Separate research findings from remediation"
    problems_solved:
      - "Agent observations can be mistaken for confirmed product defects."
      - "Specification changes can be misclassified as regressions."
      - "Structural consistency does not establish runtime correctness."
    why: "Distinguish behavioral correctness from translation fidelity and preserve evidence about where meaning diverges across the TIED chain."
  related_requirements:
