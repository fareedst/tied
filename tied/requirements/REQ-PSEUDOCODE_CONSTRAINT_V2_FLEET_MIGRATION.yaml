REQ-PSEUDOCODE_CONSTRAINT_V2_FLEET_MIGRATION:
  category: "Functional"
  description: "Every TIED client repository SHALL migrate through controlled, evidence-backed phases until fleet-migrated-client or a time-bounded migration waiver. Phase 1 establishes product contract and governance schemas. Phase 2 establishes analyzer and template readiness at G1 advisory. Phase 3 validates pilot migration workflow (stdd wave 1 + external scan), REQ-PSEUDOCODE_MIGRATION_TOOLING, G2 receipts, and rollback. Phase 4 migrates OD-P4-3 enrolled clients (stdd + four externals) in G3 fleet waves with full inventory, wave partition, waiver registry, stop/go, and dashboard—without G4 CI defaults or Phase 5 constraint-enforced bootstrap for new clients."
  name: "Fleet constraint-language v2 migration program"
  priority: "P1"
  rationale:
    benefits:
      - "Falsifiable per-client migration states and proof boundaries"
      - "Machine-readable inventory and waiver schemas"
      - "Phase 2 qualification and receipt-backed analyzer readiness before pilot migration"
      - "Phase 4 G3 fleet wave machinery with five-repo technical exit set"
      - "Traceable phase gates from policy through enforcement"
    problems_solved:
      - "Clients may remain header-only-v2 while being misread as fully migrated"
      - "Fleet rollout lacks shared migration states, waiver contract, and gate promotion timeline"
      - "Grammar v2 default REQ scope stops at new-project headers without an orchestrated migration roadmap"
      - "Phase 3 pilot workflow did not prove fleet completeness for enrolled clients"
      - "Qualification harness and migration receipts were not fleet-pinned or REQ-traceable before Phase 2"
    why: "Header-only v2 is necessary but not sufficient for full constraint-language v2; the fleet program supersedes prior mass-migration non-goals with phased governance, Phase 2 readiness, Phase 3 pilot proof, and Phase 4 G3 wave execution for the enrolled five-repo exit set."
  related_requirements:
    depends_on:
      - "REQ-PSEUDOCODE_CONSTRAINT_LANGUAGE"
      - "REQ-PSEUDOCODE_GRAMMAR_V2_DEFAULT"
      - "REQ-TIED_SETUP"
    related_to:
      - "REQ-PSEUDOCODE_MIGRATION_TOOLING"
      - "REQ-PSEUDOCODE_STATIC_ANALYSIS"
      - "REQ-REQUEST_EVIDENCE_ENVELOPE"
    supersedes: []
  satisfaction_criteria:
    - criterion: "Active waiver registry with expiry; G3 waiver_policy satisfied on annotated loci"
      id: "SC-FLEET-P4-004"
      metric: "working/fleet-constraint-v2/migration-waiver-registry.v1.yaml; migration-waiver.v1.schema.json"
    - criterion: "ARCH or linked plan references constraint-migration-receipt.v1 with Layer A/B/C, typed_flow, constraint_flow, and unknown_summary fields"
      id: "SC-FLEET-P2-001"
      metric: "ARCH-PSEUDOCODE_FLEET_MIGRATION_GOVERNANCE governance_artifacts; working/fleet-constraint-v2/constraint-migration-receipt.v1.schema.json; docs/pseudocode-constraint-v2-fleet-migration-phase-2-plan.md § Evidence schema"
    - criterion: "Authoring template demonstrates contract precision and at least one Tier-3 exemplar pattern per OD-P2-5 (≥3 profiles under working/fleet-constraint-v2/exemplars/)"
      id: "SC-FLEET-P2-002"
      metric: "templates/impl-essence-pseudocode-template.md; working/fleet-constraint-v2/exemplars/ (contract-only, refinement, alias/mutation)"
    - criterion: "Each client migration state defines a falsifiable evidence boundary independent of grammar_v2_header alone"
      id: "SC-FLEET-001"
      metric: "REQ and ARCH text plus docs/pseudocode-constraint-v2-fleet-migration-phase-1-plan.md state machine"
    - criterion: "Each in-scope wave sidecar has schema-valid constraint-migration-receipt with gate_stage G2"
      id: "SC-FLEET-P3-002"
      metric: "working/fleet-constraint-v2/pilots/stdd/receipts/*.receipt.json"
    - criterion: "Each migrated external client has client-owned migration REQ evidence in client working/{REQ}/ (orchestrator cannot satisfy alone)"
      id: "SC-FLEET-P4-005"
      metric: "Client-local REQ-*-PSEUDOCODE_MIGRATION checklists and evidence; pattern working/REQ-PSEUDOCODE_MIGRATION_PILOT_1789177584/"
    - criterion: "F11 and false-positive thresholds documented, measured, and satisfied; recorded in gate-promotion-stages.v1.yaml G1 prerequisites evidence pointers"
      id: "SC-FLEET-P2-004"
      metric: "working/fleet-constraint-v2/f11-fp-thresholds.v1.yaml; working/fleet-constraint-v2/gate-promotion-stages.v1.yaml G1 prerequisites"
    - criterion: "Fleet dashboard aggregate reconciles inventory counts, last_receipt_path, and waiver IDs; F11/FP stop criteria referenced on wave halt"
      id: "SC-FLEET-P4-006"
      metric: "working/fleet-constraint-v2/fleet-dashboard.v1.yaml; f11-fp-thresholds.v1.yaml on stop/go regression"
    - criterion: "Full fleet inventory instance validates against client-inventory-manifest.v1 and includes every Phase 4 in-scope enrolled client with falsifiable aggregate_migration_state"
      id: "SC-FLEET-P4-001"
      metric: "working/fleet-constraint-v2/client-inventory-manifest.v1.yaml (stdd-fleet-inventory-v1); phase_4_enrollment on enrolled five-repo set per OD-P4-3"
    - criterion: "G2 verification-blocking exercise and pilot rollback recorded"
      id: "SC-FLEET-P3-006"
      metric: "working/fleet-constraint-v2/rollback-exercise-G2-pilots.v1.json"
    - criterion: "G3 receipts for all sidecars in completed waves; schema-valid with gate_stage G3 and waiver/disclosure rules for unknowns"
      id: "SC-FLEET-P4-003"
      metric: "working/fleet-constraint-v2/waves/*/receipts/*.receipt.json; G3 waiver_policy on gate-promotion-stages.v1.yaml"
    - criterion: "Gate promotion stages G0–G4 are documented and linked from REQ/ARCH with OD-2 verification-first blocking for constraint_gate_errors"
      id: "SC-FLEET-003"
      metric: "gate-promotion-stages.v1.yaml and Phase 1 plan Annex A align"
    - criterion: "Governance ARCH references frozen client-inventory-manifest.v1 and migration-waiver.v1 schema identities"
      id: "SC-FLEET-002"
      metric: "ARCH-PSEUDOCODE_FLEET_MIGRATION_GOVERNANCE cross-references working/fleet-constraint-v2/*.v1.* paths"
    - criterion: "Migration tooling supports dry-run, apply, receipt emit, and revert with deterministic dry_run_content_hash"
      id: "SC-FLEET-P3-003"
      metric: "working/PSEUDOCODE-CONSTRAINT-STUDY/qualification/scripts/run-pilot-inventory-scan.ts; pilot-migration-workflow.v1.md"
    - criterion: "No satisfaction criterion equates grammar_v2_header pass with fleet-migrated-client"
      id: "SC-FLEET-004"
      metric: "Falsification questions in CITDP and REQ satisfaction criteria"
    - criterion: "Phase 1–5 exit criteria are traceable from REQ without requiring sidecar migration in Phase 1"
      id: "SC-FLEET-005"
      metric: "Grand plan phase exit criteria referenced from REQ rationale and linked plan docs"
    - criterion: "Pilot inventory manifest instance validates and lists every Phase 3 pilot without header-only migrated inference"
      id: "SC-FLEET-P3-001"
      metric: "working/fleet-constraint-v2/client-inventory-manifest.pilots.v1.yaml; docs/pseudocode-constraint-v2-fleet-migration-phase-3-plan.md"
    - criterion: "Product tests remain green for pseudocode-only migration commits in pilot scope"
      id: "SC-FLEET-P3-005"
      metric: "mcp-server build + harness pilot-p3; no runtime product code changes in Phase 3 wave 1"
    - criterion: "Qualification manifest re-baseline at 48d1fbb+ shows green tier A/B gates per Phase 2 definition (zero new gate failures vs baseline; stdd tier B zero regression)"
      id: "SC-FLEET-P2-003"
      metric: "working/PSEUDOCODE-CONSTRAINT-STUDY/qualification/fleet-g1/summary.json qualification_green; manifest baseline_anchor_commit"
    - criterion: "Rollback exercise demonstrates G1 advisory restoration without analyzer code revert (config/receipt-only revert)"
      id: "SC-FLEET-P2-005"
      metric: "working/fleet-constraint-v2/rollback-exercise-G1.v1.json; qualification/fleet-g1/rollback-exercise/ receipts"
    - criterion: "stdd wave 1 completes before external pilot apply commits"
      id: "SC-FLEET-P3-004"
      metric: "working/fleet-constraint-v2/pilots/stdd/receipts/summary.json before external apply; OD-P3-1 ordering"
    - criterion: "Wave partition documents risk-based order and pins; each completed wave has stop/go record and zero blocking evidence gaps for enrolled clients"
      id: "SC-FLEET-P4-002"
      metric: "working/fleet-constraint-v2/fleet-wave-partition.v1.yaml; working/fleet-constraint-v2/wave-stop-go.v1.json"
  status: "Planned"
  traceability:
    architecture:
      - "ARCH-PSEUDOCODE_FLEET_MIGRATION_GOVERNANCE"
    code_annotations:
      - "REQ-PSEUDOCODE_CONSTRAINT_V2_FLEET_MIGRATION"
    implementation:
