REQ-FEAT_IDEMPOTENT_CREATION:
  category: "Functional"
  description: "Create a feature idempotently for an explicit request key, returning the original result for repeats and a deterministic collision error for conflicting requests."
  metadata:
    last_updated:
      author: "AI Agent"
      date: "2026-09-27"
      reason: "W3 residuality LEAP P0+P1 batches (PLAN-TIED-RESIDUALITY-ANALYSIS)"
  name: "Idempotent feature creation"
  priority: "P0"
  rationale:
    benefits:
      - "Auditable request identity"
      - "Safe retries"
      - "Stable collision diagnostics"
    problems_solved:
      - "Ambiguous concurrent allocation"
      - "Duplicate features from retries"
      - "Silent request-key collisions"
    why: "Retries and concurrent callers must not create duplicate feature packages."
  satisfaction_criteria:
    - criterion: "A reused request key with different normalized input returns a deterministic collision error."
    - criterion: "After an unknown outcome (timeout or ambiguous response), a retry with the same request key returns the same feature reference or a deterministic in-progress state — never a second allocation."
      residuality_facet:
        ledger_disposition: "candidate_requirement"
