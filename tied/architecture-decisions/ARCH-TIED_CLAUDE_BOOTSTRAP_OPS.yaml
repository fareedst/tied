      - "SPIKE_CLAUDE_ADHERENCE_HOOKS yields bridge or not_applicable receipt."
    summary: "B1-first TDD: RED Windows smoke asserts, GREEN + proof note, then symlink gate tests; optional re-root owned by REQ-TIED_CLAUDE_SKILLS_REROOT; adherence spike, comparison-doc refresh at bootstrap ops close-out."
