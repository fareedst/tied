    - "REQ-GOAGENT-FEATURESPEC-BATCH"
  decision: "Add a task-graph input/adapter boundary beside existing feature-spec batch loading; share executor and dry-run rendering primitives without changing legacy ordering semantics."
  description: "The agentstream adapter consumes the canonical scheduler projection and delegates execution through existing Turn and executor surfaces while retaining the ordered feature-spec batch path unchanged."
