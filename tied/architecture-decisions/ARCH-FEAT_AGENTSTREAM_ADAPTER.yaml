        - "One input"
      rejected_reason: "REQ-GOAGENT-FEATURESPEC-BATCH requires ordered behavior to remain supported."
  cross_references:
    - "ARCH-GOAGENT-EXECUTOR"
    - "ARCH-GOAGENT-YAML-FEATURESPEC"
