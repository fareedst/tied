    details:
      - "Dry-run and live execution consume one schedule projection."
      - "Keep CLI/process wiring thin and module-testable."
      - "Preserve existing feature-spec batch behavior byte-for-byte where inputs use that mode."
    summary: "Adapter maps scheduled task groups to governed turns and execution evidence."
  name: "Additive agentstream task adapter"
