ARCH-EVIDENCE_CHAIN_REPORT:
  alternatives_considered:
    - cons:
        - "Mixes generator and aggregator satisfaction criteria"
        - "Profile CITDP already lists cross-project aggregation as a non-goal"
      name: "Extend REQ-EVIDENCE_CHAIN_PROFILE"
      pros:
        - "Fewer tokens"
      rejected_reason: "Keep the smallest honest token set that remains independently testable."
    - cons:
        - "Mutates the read-only boundary and couples to repo layout"
      name: "Live client-root traversal"
      pros:
        - "No manifest"
      rejected_reason: "Inputs are explicit artifacts only."
    - cons:
        - "Aggregator lives in TIED mcp-server, not client methodology"
      name: "Promote report REQ/ARCH/IMPL into templates"
      pros:
        - "Clients inherit tokens"
      rejected_reason: "Report tokens stay source-repo-only; the guide and profile-generator tokens may still be client-distributed."
    - cons:
        - "Erases denominators and proof boundaries"
      name: "Universal rollup score"
      pros:
        - "Simple ranking"
      rejected_reason: "Locked non-goal."
  cross_references:
    - "ARCH-EVIDENCE_CHAIN_PROFILE"
    - "IMPL-EVIDENCE_CHAIN_REPORT"
    - "PROC-EVIDENCE_CHAIN"
    - "REQ-EVIDENCE_CHAIN_PROFILE"
    - "REQ-EVIDENCE_CHAIN_REPORT"
  decision: "Ship a TIED-source offline aggregator that reads an evidence-chain-report-inputs.v1 manifest and already-generated evidence-chain-profile.v1 files, partitions compatible client cohorts, and emits evidence-chain-statistics-report.v1 (default) or v2 YAML plus deterministic Markdown. v2 adds denominator_fingerprint on each accepted input and sub-cohort partitions inside compatibility_key when denominators differ. Do not traverse client repositories or write project YAML."
  implementation_approach:
    details:
      - "CLI default mode is strict"
      - "include_absolute_paths defaults false"
      - "Reuse NORMALIZE_EVIDENCE_CHAIN_PROFILE validation rules without calling generateEvidenceChainProfile"
      - "TIED_MCP_COLLECT_METRICS remains optional tool-usage metrics only"
      - "v1 does not sum or average derived-field values"
      - "v2 default remains v1; --report-version v2 enables denominator_fingerprint and sub-cohort partition"
      - "v2 suppresses cohort-level incompatible-denominator residual risks when sub-cohorts isolate the mismatch"
    key_components:
      - "compatibility_key schema_version|profile_depth"
      - "denominator subcohort partition inside compatibility_key"
      - "denominator_fingerprint stable hash of derived and structural denominators"
      - "evidence-chain-report-inputs.v1"
      - "path-privacy artifact refs"
      - "strict and partial modes"
      - "v1 and v2 count-only named statistics"
    summary: "Add evidence-chain-report.ts plus a CLI that validates artifacts, partitions cohorts and v2 sub-cohorts, counts named statistics, and writes caller-selected YAML and Markdown."
  name: "Evidence chain statistics report architecture"
  rationale:
    benefits:
      - "Stable identity via hashed project_id with optional client alias"
      - "Testable aggregator versus generator boundary"
    problems_solved:
      - "Deferred cross-project tool had no contract"
      - "Risk of mixing incompatible depths or inventing scores"
    why: "Aggregation is a different actor and proof boundary from one-client profile generation."
  related_requirements:
    - "REQ-EVIDENCE_CHAIN_PROFILE"
    - "REQ-EVIDENCE_CHAIN_REPORT"
  status: "Accepted"
