  decision: "TIED-owned glossaries are installed under tied/methodology/vocab/ and refreshed as a read-only snapshot; client glossaries remain under tied/vocab/. Client routing.md and domain-references.md are handoff indexes that point to both layers."
  description: "Use separate methodology and client vocabulary trees with an explicit client discovery handoff."
  implementation_approach:
    details:
      - "Classify all non-source-only canonical TIED glossaries as methodology-owned in the source repository."
      - "Keep tied/vocab/ client-owned and create missing routing/catalog handoffs only."
      - "Refresh tied/methodology/vocab/ by replacement with stale-file pruning."
