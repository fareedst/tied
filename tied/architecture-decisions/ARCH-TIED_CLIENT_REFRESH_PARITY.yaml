ARCH-TIED_CLIENT_REFRESH_PARITY:
  cross_references:
    - "ARCH-TIED_BOOTSTRAP_CROSS_PLATFORM"
    - "REQ-TIED_CLIENT_REFRESH_PARITY"
    - "REQ-TIED_SETUP"
  decision: "Add a bootstrap parity gate that compares source templates and DOCS_TO_COPY hashes to the client tree; distinct from client-root G4 grammar audit and from tied_validate_consistency structural validation."
  implementation_approach:
    details:
      - "Bootstrap invokes gate after existing verify* functions; default fail on methodology drift, warn on doc drift unless --strict-refresh"
      - "Parity A: templates/ mapped to tied/methodology/ with METHODOLOGY_TEMPLATE_ONLY allowlist"
      - "Parity B: manifest DOCS_TO_COPY sha256 source tied/docs vs client"
    summary: "Node module under tools/bootstrap/lib with JSON report schema v1; optional Ruby compare_yaml_dirs for semantic YAML dirs when hash insufficient."
  name: "Client refresh parity proof boundary"
  rationale:
    benefits:
      - "Clear separation: G4 grammar, TIED consistency, parity gate"
    problems_solved:
      - "Green G4 while client docs stale"
      - "No machine-readable refresh receipt"
    why: "Operators need fail-closed methodology drift detection and explicit doc drift reporting without conflating proof boundaries."
  status: "Active"
  traceability:
    implementation:
      - "IMPL-TIED_CLIENT_REFRESH_PARITY"
      - "IMPL-TIED_FILES"
    requirements:
      - "REQ-TIED_CLIENT_REFRESH_PARITY"
    tests:
      - "tools/bootstrap/lib/client-refresh-parity.test.mjs"
