ARCH-TIED_YAML_CANONICAL_PROFILE:
  alternatives_considered:
    - cons:
        - "Different scalar semantics"
        - "Policy divergence"
      name: "Keep yq and Ruby serializers independent"
      pros:
        - "Small immediate changes"
      rejected_reason: "Cannot prove cross-surface parity"
    - cons:
        - "Breaks ordered workflow lists"
      name: "Serialize all lists"
      pros:
        - "Simple implementation"
      rejected_reason: "Ordered-list keys are semantically meaningful"
  cross_references:
    - "ARCH-MODULE_VALIDATION"
    - "ARCH-TIED_STRUCTURE"
    - "REQ-TIED_SETUP"
    - "REQ-TIED_YAML_CANONICALIZATION"
    - "REQ-TIED_YAML_STYLE_CONFIGURATION"
  decision: "All TIED YAML write surfaces delegate to one typed canonicalizer with profile id tied-yaml-canonical-v1. The canonicalizer recursively orders mapping keys and eligible all-string lists using case-insensitive-primary, locale-independent lexical ordering with the original value as a case-sensitive tie-breaker; it preserves scalar types, opaque block text, ordered-list order, and writes atomically while returning stable yaml_format metadata. Compatibility frontends delegate to the same profile while retaining historical flags."
  detail_file: "architecture-decisions/ARCH-TIED_YAML_CANONICAL_PROFILE.yaml"
  implementation_approach:
    details:
      - "Canonicalize token rename substitutions before replacement and preserve originals on failure"
      - "Compatibility sorter reporting: yaml_list_sorter and yaml_tool --sort-lists emit normal stdout only for modified paths, retain validation and modification summaries for those paths, and keep failure diagnostics on stderr; unchanged paths remain silent."
      - "Preserve object and mixed list order"
      - "Return yaml_format metadata from every successful writer"
      - "Sort only all-string lists unless owning key matches order, order_*, *_order, or *_order_*"
      - "Treat block scalar bodies and IMPL sidecars as opaque text"
      - "Use case-insensitive-primary locale-independent lexical ordering with original-value lexical tie-breaking for map keys and eligible string lists"
    summary: "Pure typed canonicalizer plus atomic file writer shared by MCP and compatibility frontends"
  metadata:
    created:
      author: "AI Agent"
      date: "2026-08-06"
    last_updated:
      author: "AI Agent"
      date: "2026-08-07"
      reason: "LEAP: propagate compatibility sorter path reporting contract from IMPL through ARCH to REQ"
  name: "Shared typed canonical YAML profile"
  rationale:
    benefits:
      - "Atomic failure behavior"
      - "One auditable profile"
      - "Stable metadata for clients"
    problems_solved:
      - "Divergent MCP and CLI serialization"
      - "Silent data-type changes"
      - "Unsafe partial writes on serialization failure"
    why: "Independent yq and Ruby policies create semantic drift and can rewrite typed values or ordered lists incorrectly."
  related_decisions:
    depends_on:
      - "ARCH-MODULE_VALIDATION"
      - "ARCH-TIED_STRUCTURE"
    informs:
      - "IMPL-TIED_YAML_CANONICALIZER"
    see_also: []
  status: "Active"
  token_coverage:
    code_files:
      - "mcp-server/src/tools/index.ts"
      - "mcp-server/src/yaml-canonicalizer.ts"
      - "scripts/yaml_tool.sh"
    tests:
      - "mcp-server/src/tools/yaml-canonicalization-mcp.test.ts"
      - "mcp-server/src/yaml-canonicalizer.test.ts"
      - "scripts/yaml_list_sorter_test.rb"
  traceability:
    architecture:
      - "ARCH-TIED_YAML_CANONICAL_PROFILE"
    code_annotations:
      - "ARCH-TIED_YAML_CANONICAL_PROFILE"
    requirements:
      - "REQ-TIED_YAML_CANONICALIZATION"
    tests: []
