    - "ARCH-TIED_STRUCTURE"
    - "REQ-TIED_SETUP"
    - "REQ-TIED_YAML_CANONICALIZATION"
    - "REQ-TIED_YAML_STYLE_CONFIGURATION"
  decision: "All TIED YAML write surfaces delegate to one typed canonicalizer with profile id tied-yaml-canonical-v1. The canonicalizer recursively orders mapping keys and eligible all-string lists using case-insensitive-primary, locale-independent lexical ordering with the original value as a case-sensitive tie-breaker; recognized record lists and heterogeneous map lists use tier-0/tier-1 sorting (strings, arrays, and keyless maps before keyed maps; registry and heuristic map lists sort by fieldName.fieldValue); it preserves scalar types, opaque block text, ordered-list order, and writes atomically while returning stable yaml_format metadata. Compatibility frontends delegate to the same profile while retaining historical flags."
  description: "A single typed tied-yaml-canonical-v1 profile governs recursive map and eligible phrase-list ordering, ordered-list exceptions, scalar preservation, opaque text, atomic writes, and yaml_format metadata. Lexical ordering is case-insensitive-primary with original-value tie-breaking and no locale dependence."
  detail_file: "architecture-decisions/ARCH-TIED_YAML_CANONICAL_PROFILE.yaml"
  implementation_approach:
    details:
      - "Canonicalize token rename substitutions before replacement and preserve originals on failure"
      - "Compatibility sorter reporting: yaml_list_sorter and yaml_tool --sort-lists emit normal stdout only for modified paths, retain validation and modification summaries for those paths, and keep failure diagnostics on stderr; unchanged paths remain silent."
      - "Record-list registry: satisfaction_criteria → criterion; validation_criteria → method; alternatives_considered → name; files → description, path; functions → description, name; risks → description, mitigation; whole-block sorting preserves optional fields attached to each record"
      - "Return yaml_format metadata from every successful writer"
      - "Sort only all-string lists unless owning key matches order, order_*, *_order, or *_order_*"
      - "Tier-0/tier-1 heterogeneous list sorting: strings, arrays, and keyless maps precede keyed maps; unregistered homogeneous map lists infer the lexicographically first string-valued key"
      - "Treat block scalar bodies and IMPL sidecars as opaque text"
      - "Use case-insensitive-primary locale-independent lexical ordering with original-value lexical tie-breaking for map keys and eligible string lists"
  metadata:
    created:
      author: "AI Agent"
      date: "2026-08-06"
    last_updated:
      author: "AI Agent"
      date: "2026-08-24"
      reason: "LEAP: add record-list registry and whole-block sorting contract for recognized mapping-record lists"
  name: "Shared typed canonical YAML profile"
  status: "Active"
  type: "ARCH"
