  description: "Provide one resolver and serializer options contract for all typed YAML writes, plus optional client_formatter hook resolution and fail-closed runner for presentation-only post-canonical styling. Repository .tied-yaml.yaml overrides TIED_YAML_STYLE and XDG global configuration; unconfigured repositories use unwrapped. Wrapped uses double-quoted strings only and preserves typed booleans, numbers, and nulls. Opaque block scalars and IMPL pseudo-code sidecars retain existing preservation rules."
  implementation_approach:
    details:
      - "Add resolveClientFormatter and validateFormatterDeclaration to yaml-style-config.ts."
      - "Add yaml-client-formatter.ts with runClientFormatterHook, guardProjectTiedPath, and reportStylingEvidence."
      - "Add yaml-style-config.ts beside yaml-canonicalizer.ts with scalar_style validation, repository-root discovery, and precedence resolution."
      - "Expose tied_client_yaml_styling_apply MCP tool; writers remain baseline-canonical only."
      - "Extend canonical profile metadata with scalar_style and style_source."
      - "Reject invalid repository configuration without falling back to global values; preserve atomic failure behavior."
      - "Route yaml_tool and --sort-lists through the same CLI resolver contract and canonical output."
      - "Use js-yaml forceQuotes and quotingType double only for wrapped string serialization; never stringify typed scalars."
    summary: "Resolve style once per operation from repository root, pass it into the canonicalizer and yaml-dump, and expose the effective style and source in yaml_format metadata."
