        description: 'Integration: applyPostPreloadNonCompactHTML after ApplyPromptFilePreload (IMPL-GOAGENT-CLI-CMD + IMPL-GOAGENT-NON-COMPACT-HTML-FORMAT composition)'
      - path: tools/agentstream/cmd/agentstream/compose_noncompact.go
        description: 'MAP_CONFIG_TO_HTMLFORMAT_OPTIONS + call IntegrateWithMain; REQ/ARCH/IMPL: IMPL-GOAGENT-NON-COMPACT-HTML-FORMAT; CLI via config.Config'
      - path: tools/agentstream/config/config.go
        description: NonCompactHTML, NonCompactHTMLStableIndent; --non-compact-html / --non-compact-html-indent (ARCH-GOAGENT-CLI / REQ-GOAGENT-CLI-CONFIG)
      - path: tools/agentstream/htmlformat/htmlformat.go
        description: 'APPLY_TO_TURNS, FormatNonCompactHTML, addNonCompactLineBreaks, applyStableIndentLines, IntegrateWithMain (htmlformat); REQ/ARCH/IMPL: IMPL-GOAGENT-NON-COMPACT-HTML-FORMAT'
