    desired_behavior: "Skills and agents name invocation remainder and linked plan. plan-new-feature treats remainder as the requirement. refine-plan and build-plan require a linked or in-message plan and stop if none is present. plan-refine-build passes remainder then linked plans to its children. Composer emit-header and Improve the plan below closers are not procedure steps."
