CITDP-REQ-TIED_YAML_CANONICALIZATION:
  change_definition:
    current_behavior: "The shared TypeScript canonicalizer compares strings with case-sensitive lexical ordering while the Ruby compatibility sorter lowercases without an original-value tie-break, so equal-folded values can diverge across surfaces; unchanged sorter paths also reported zero modifications on normal stdout."
    requested_change: "Use one case-insensitive-primary, locale-independent comparator with original-value lexical tie-breaking for recursive map keys and eligible all-string lists across TypeScript and Ruby compatibility paths, and omit unchanged paths from normal sorter stdout."
    scope_in:
      - "ARCH canonical profile and process documentation"
      - "atomic writes"
      - "canonical ordering vocabulary and CHANGELOG"
      - "format metadata operation"
      - "IMPL canonicalizer and style-resolver pseudo-code metadata"
      - "MCP index/detail/rename writes"
      - "mcp-server/src/yaml-canonicalizer.test.ts"
      - "mcp-server/src/yaml-canonicalizer.ts"
      - "scripts/yaml_list_sorter.rb"
      - "scripts/yaml_list_sorter_test.rb"
      - "unchanged path reporting and modified path reporting"
      - "yaml_semantic_compare ordered-list semantics"
      - "yaml_tool default lint"
    scope_out:
      - "Changing canonical ordering semantics beyond the documented comparator contract"
      - "Changing ordered-list semantics"
      - "Changing scalar-type preservation or opaque-text boundaries"
      - "Migration of historical YAML bytes unrelated to touched writers"
      - "UI behavior or a separate E2E surface"
    summary: "Align canonical map-key and eligible phrase-list ordering across the shared typed profile and compatibility frontend, while keeping unchanged compatibility paths silent."
  change_id: "REQ-TIED_YAML_CANONICALIZATION"
  completion_criteria:
    - "Changed TIED YAML passes lint and tied_validate_consistency."
    - "IMPL pseudo-code, ARCH/REQ traceability, source comments, tests, vocabulary, and CHANGELOG describe the same comparator and output-reporting contract."
    - "Modified paths retain normal stdout summaries while unchanged paths emit no normal stdout."
    - "Ordered-list keys remain in document order and scalar/opaque-text behavior remains unchanged."
    - "TypeScript and Ruby produce Apple, apple, Banana, zebra in the same order for mixed-case values."
    - "Unit, composition, and compatibility validation pass; E2E is explicitly not applicable."
  evidence:
    commands:
      - "cd mcp-server && npm test — tsc build plus 159 tests passed, 0 failed"
      - "MCP pseudocode_validate(IMPL-TIED_YAML_CANONICALIZER) — Layer B ok with 9 blocks and no diagnostics"
      - "MCP tied_validate_consistency — ok true"
      - "MCP tied_verify dry_run — no status changes required"
      - "MCP yaml_index_validate — requirements, architecture, implementation, and semantic-tokens valid"
      - "ruby -c scripts/yaml_list_sorter.rb — Syntax OK"
      - "ruby scripts/yaml_list_sorter_test.rb — all assertions passed, including unchanged stdout suppression"
      - "scripts/yaml_tool.sh --check — all changed TIED YAML passed"
    manifest_reference: "~"
    proof_boundaries:
      - "No UI E2E is applicable because the changed behavior is pure canonicalization plus CLI/MCP writer composition."
      - "Runtime tests prove repository fixtures and shared writer behavior, not every possible Unicode locale or external YAML producer."
