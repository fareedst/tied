      - "Quality profiles, vocabulary, and dedicated IMPL ownership are documented and traceable."
      - "TIED consistency and YAML lint pass."
      - "Validators report reproducible structural diagnostics and proof boundaries."
    unchanged_behavior: "IMPL pseudo-code before RED, RED before GREEN, module validation, composition-first wiring, justified E2E, LEAP, and TIED consistency remain mandatory."
