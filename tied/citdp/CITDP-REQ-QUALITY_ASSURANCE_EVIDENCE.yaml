    current_behavior: "TIED provides TDD, module validation, composition, LEAP, and consistency checks, but quality applicability and evidence provenance are not represented by one bounded contract."
    desired_behavior: "Select quality profiles before design, record evidence/N/A rationale/owner/expiry, and expose deterministic Layer B, binding inventory, evidence manifest, test adequacy, security, and command collection validators with explicit proof boundaries."
    non_goals:
      - "Full dashboard, chaos platform, generalized compliance engine, or CI rewrite"
      - "Runtime certification or complete product correctness"
      - "Universal quality ceremony"
    success_criteria:
