    desired_behavior: "Six-phase MODULE_VALIDATION_LIFECYCLE with COMPOSITION_BINDING_VALIDATION: binding inventory + UI-free composition evidence before integration; E2E only for named platform constraints. Guide composition-coverage.md; LEAP into REQ/ARCH/IMPL; vocab terms binding inventory and composition evidence; agentstream composition coverage tests; yaml_list_sorter skips order/*_order/order_*/_*order_* lists; checklist coerces quoted bools."
