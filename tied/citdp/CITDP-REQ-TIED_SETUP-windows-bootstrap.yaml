    current_behavior: "copy_files.sh (~1122 lines bash) is the sole BOOTSTRAP_TIED implementation; Windows developers need bash."
    desired_behavior: "Shared Node engine under tools/bootstrap/ implements BOOTSTRAP_TIED; copy_files.cmd and thin copy_files.sh delegate to copy-files.mjs with manifest-driven lists."
