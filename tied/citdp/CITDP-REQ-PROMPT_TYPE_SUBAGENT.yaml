      - "Runtime evaluation of the LLM"
    success_criteria:
      - "copy_files.sh installs all 13 canonical agents into client .cursor/agents/<prompt-type>.md with byte-identical content."
      - "Each agent body names the canonical skill, type-specific gates, forbidden operations, and parent handoff fields."
      - "Each agent description positively identifies its prompt type and excludes neighboring types without proactive activation language."
      - "Implementing and close-out wrappers are writable; question and other are readonly."
      - "Static contract tests pass for all 13 wrappers and are included in the package test command."
    unchanged_behavior: "The canonical bundled skills remain the workflow source of truth; client bootstrap preserves unrelated skills and existing MCP configuration while installing the managed Task wrappers."
