CITDP-REQ-MCP_USAGE_METRICS:
  change_definition:
    current_behavior_prior: "No unified, opt-in instrumentation for TIED YAML MCP tool calls. Cursor hook logs miss tied-cli/headless stdio; no sanitized arg signatures for offline clustering."
    desired_behavior: "When TIED_MCP_COLLECT_METRICS is 1 or true, every MCP tools/call appends one sanitized JSONL v1 record (tool, client, duration, ok, args_summary, args_signature). Default off. tied-cli sets TIED_MCP_METRICS_CLIENT=tied-cli. Offline Ruby aggregator reports counts, failures, durations, top signatures."
    non_goals:
      - "Always-on collection or off-machine export"
      - "Logging full essence_pseudocode or record bodies"
      - "Storing metrics in tied/feedback.yaml or project git"
    references:
      - "tied/architecture-decisions/ARCH-MCP_USAGE_METRICS.yaml"
      - "tied/implementation-decisions/IMPL-MCP_USAGE_METRICS-pseudocode.md"
      - "tied/implementation-decisions/IMPL-MCP_USAGE_METRICS.yaml"
      - "tied/requirements/REQ-MCP_USAGE_METRICS.yaml"
      - "tied/vocab/tied-yaml-mcp.md"
    success_criteria:
      - "No JSONL append when env unset; append when set to 1 or true"
      - "REQ/ARCH/IMPL stack consistent under tied_validate_consistency"
      - "tied-cli.sh exports TIED_MCP_METRICS_CLIENT=tied-cli when collection enabled"
      - "usage-metrics.test.ts and analyze_tied_mcp_metrics_test.rb pass"
    summary: "Add opt-in local MCP tool usage metrics: registration-time wrapToolHandler, sanitized JSONL under ~/.cursor/logs (or override), tied-cli client tag, offline Ruby aggregator."
    unchanged_behavior: "When TIED_MCP_COLLECT_METRICS is unset, handlers and I/O paths are unchanged (zero metrics file I/O). Feedback.yaml and project TIED YAML writes are unaffected."
  completion_criteria:
    verification_gate_notes: "mcp-server TypeScript tests; Ruby analyzer smoke; tied_validate_consistency with include_pseudocode; REQ-MCP_USAGE_METRICS satisfaction criteria covered by named tests."
  impact_analysis:
