    modules_or_boundaries: "usage-metrics: env gate, sanitizeArgs, recordToolCall, wrapToolHandler. index.ts: registration wiring only. tied-cli: env export before stdio client. analyze_tied_mcp_metrics.rb: offline streaming aggregator. Boundaries: append-only JSONL outside project tied/; non-fatal IO; no per-handler edits."
