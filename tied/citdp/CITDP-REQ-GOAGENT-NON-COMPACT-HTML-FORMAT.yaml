CITDP-REQ-GOAGENT-NON-COMPACT-HTML-FORMAT:
  change_definition:
    current_behavior_prior: |
      Checklist- and TDD-generated turn bodies were not given a first-class, testable "non-compact HTML" mode;
      log/diff review of long single-line HTML was the primary pain.
    desired_behavior: |
      When --non-compact-html (and optional --non-compact-html-indent) is resolved true, a single post-preload
      pass replaces Part strings with FORMAT_NON_COMPACT_HTML output; when off, bytes are unchanged.
    non_goals:
      - Replace the Ruby agent-stream runner; Go-only feature in tools/agentstream
      - Require authors to hand-edit HTML inside YAML step files
    references:
      - tied/architecture-decisions/ARCH-GOAGENT-NON-COMPACT-HTML-FORMAT.yaml
