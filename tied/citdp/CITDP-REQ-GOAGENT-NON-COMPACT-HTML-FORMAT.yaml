    success_criteria:
      - REQ satisfaction criteria and ARCH/IMPL tests documented; REQ status Implemented
      - tools/agentstream tests pass; tied_validate_consistency ok for project tied/
    summary: |
      Add an opt-in, explicit CLI/config-controlled pass that reformats each Turn part string to deterministic,
      multi-line UTF-8 HTML after the pipeline and preload, without changing YAML step identity, turn order,
      or downstream executor contract.
    unchanged_behavior: |
      Default and non-selected code paths: markdown/plain and prior pipeline behavior unchanged. No change to
      step slugs, ChainFromPrevious, or agent executor invocation order.
