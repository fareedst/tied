risk_analysis:
  risks:
    - id: "RISK-001"
      description: "Users or agents treat proposal text as authoritative REQ/ARCH/IMPL without applying\nLEAP through yaml_index_* / detail writers and validation, causing drift or wrong edits.\n"
      likelihood: "Medium"
      mitigation: "Document that proposals live under leap-proposals/ only; require explicit MCP YAML edits,\nlint_yaml, and tied_validate_consistency before marking applied. tied_leap_proposal_approve\ndoes not write tied/*.yaml. Workflow in docs/leap-proposal-queue.md lists apply-then-mark_applied.\n"
      severity: "High"
      tied_token_references:
        - "ARCH-LEAP_PROPOSAL_QUEUE"
        - "IMPL-MCP_LEAP_PROPOSAL_QUEUE"
        - "REQ-LEAP_PROPOSAL_QUEUE"
    - id: "RISK-002"
      description: "queue.json or audit-log.jsonl grows without bound or is corrupted (partial write, disk full),\nbreaking list/approve flows or losing audit history.\n"
      likelihood: "Low"
      mitigation: "Operational: rotate or archive leap-proposals/ periodically in large repos; rely on JSON\nparse errors surfacing as tool errors. Future hardening could add size caps or rotation (out of scope).\n"
      severity: "Medium"
      tied_token_references:
        - "IMPL-MCP_LEAP_PROPOSAL_QUEUE"
        - "REQ-LEAP_PROPOSAL_QUEUE"
    - id: "RISK-003"
      description: "Concurrent MCP clients or processes write queue.json simultaneously, leading to lost updates\nor inconsistent queue state.\n"
      likelihood: "Low"
      mitigation: "Single-writer expectation for the MCP server process; avoid parallel proposal writers against\nthe same project root. Document serial use for automation.\n"
      severity: "Medium"
      tied_token_references:
        - "IMPL-MCP_LEAP_PROPOSAL_QUEUE"
    - id: "RISK-004"
      description: "extractDiffProposalCandidates fails or returns { error } (git unavailable, not a repo, diff errors);\nusers assume proposals were created when none were.\n"
      likelihood: "Medium"
      mitigation: "Tool returns structured result with error field; callers must check ok/error. Unit tests cover\nfailure paths; IMPL pseudo-code documents non-throwing error return.\n"
      severity: "Medium"
      tied_token_references:
        - "IMPL-MCP_LEAP_PROPOSAL_QUEUE"
        - "REQ-LEAP_PROPOSAL_QUEUE"
    - id: "RISK-005"
      description: "Session import or diff extraction produces low-quality or misleading line-level hints that\npollute the queue and waste review time.\n"
      likelihood: "Medium"
      mitigation: "Reject workflow and manual update; explicit_opt_in required for extract/import; no auto-approval.\n"
      severity: "Low"
      tied_token_references:
        - "ARCH-LEAP_PROPOSAL_QUEUE"
        - "REQ-LEAP_PROPOSAL_QUEUE"
    - id: "RISK-006"
      description: "Project root resolves to an unexpected cwd (MCP server cwd), so leap-proposals/ is written\nbeside the wrong tree or proposals are read from the wrong repo.\n"
      likelihood: "Medium"
      mitigation: "Document that paths are relative to configured project root / cwd; integrators pass explicit\nprojectRoot where supported. Verify leap-proposals/ location before bulk operations.\n"
      severity: "Medium"
      tied_token_references:
        - "ARCH-LEAP_PROPOSAL_QUEUE"
        - "IMPL-MCP_LEAP_PROPOSAL_QUEUE"
    - id: "RISK-007"
      description: "safeLeapCall / JSON error envelope swallows sync fs or git exceptions into { ok: false, error },\nmaking root causes harder to see in logs than a thrown stack.\n"
      likelihood: "Medium"
      mitigation: "Error strings propagate to clients; DEBUG/TRACE logging can be added at call sites if needed.\nAcceptable tradeoff for MCP JSON contract stability.\n"
      severity: "Low"
      tied_token_references:
        - "IMPL-MCP_LEAP_PROPOSAL_QUEUE"
    - id: "RISK-008"
      description: "Users skip tied_leap_proposal_mark_applied after editing TIED YAML, leaving proposals \"approved\"\nbut not linked to completed LEAP work, confusing queue hygiene.\n"
      likelihood: "Medium"
      mitigation: "Document final step in docs/leap-proposal-queue.md; list view shows status; periodic manual cleanup.\n"
      severity: "Low"
      tied_token_references:
        - "REQ-LEAP_PROPOSAL_QUEUE"
    - id: "RISK-009"
      description: "implementation-decisions.yaml (monolithic index) and implementation-decisions/IMPL-*.yaml\ndetail files drift: essence_pseudocode updated in one place but not the other, so agents,\nvalidators, or humans read conflicting intent (e.g. after partial merges or copy/paste).\n"
      likelihood: "Medium"
      mitigation: "After edits, run persist-implementation-records-style sync (copy authoritative essence into index or vice versa per policy),\nthen lint_yaml per file. Spot-check with a short script comparing parsed essence strings for tokens\nthat must be identical; prefer one authoritative source and automate copy where feasible.\n"
      severity: "Medium"
      tied_token_references:
        - "ARCH-TIED_STRUCTURE"
        - "IMPL-MCP_LEAP_PROPOSAL_QUEUE"
        - "IMPL-TIED_FILES"
        - "REQ-TIED_SETUP"
    - id: "RISK-010"
      description: "Coding agent applies yaml_index_* / yaml_detail_* MCP tools against the wrong TIED base path\n(e.g. workspace A while the checklist targets repo B), silently mutating unrelated project YAML\nor appearing to succeed while stdd tied/ is unchanged.\n"
      likelihood: "Medium"
      mitigation: "At session start call tied_config_get_base_path (or equivalent) and confirm it matches the repo\nunder change; set TIED_BASE_PATH explicitly for CLI validation. When MCP cannot target the intended\ntree, document TIED_YAML_BYPASS and use direct edits only under the correct absolute paths, then\nlint_yaml those paths.\n"
      severity: "High"
      tied_token_references:
        - "IMPL-TIED_FILES"
        - "REQ-TIED_SETUP"
    - id: "RISK-011"
      description: "lint_yaml / yq -i -P canonicalization changes block chomping (e.g. |- vs |) or whitespace so the\non-disk scalar parses differently (trailing newline, blank lines), breaking byte-for-byte parity\nchecks between index and detail even when intent is unchanged.\n"
      likelihood: "Medium"
      mitigation: "Compare parsed YAML values (semantic equality) after lint, not raw text only; standardize on |\nwhere a trailing newline must match detail files; re-run comparison after every lint pass touching\nessence_pseudocode.\n"
      severity: "Low"
      tied_token_references:
        - "IMPL-MCP_FEEDBACK_TOOLS"
        - "IMPL-MCP_LEAP_PROPOSAL_QUEUE"
    - id: "RISK-012"
      description: "Broad edits across many IMPL-* records in one change increase merge conflicts, review fatigue,\nand the chance a block loses required REQ/ARCH/IMPL token comments or references wrong tokens.\n"
      likelihood: "Medium"
      mitigation: "Prefer smaller, token-scoped commits; run tied_validate_consistency and pseudo-code validation\n(gate-pseudocode-validation) before persisting; use grep or MCP token scans to ensure bracket tokens resolve in\nsemantic-tokens and indexes.\n"
      severity: "Medium"
      tied_token_references:
        - "IMPL-ATDD-E2E-AGENT_STREAM"
        - "IMPL-GOAGENT-CLI-CMD"
        - "IMPL-GOAGENT-EXECUTOR"
        - "IMPL-GOAGENT-PIPELINE"
  summary: "Risks center on mistaking non-canonical proposals for TIED truth, unbounded on-disk\nartifacts, git/session extraction edge cases, and operational confusion when MCP cwd\ndiffers from the intended project root. Design explicitly avoids writing project TIED YAML\nfrom queue tools, which mitigates the highest-severity class of accidental canonical corruption.\nAdditional risks (RISK-009–RISK-012): monolithic implementation-decisions index vs detail-file\ndrift, agents editing one repo's tied/ while MCP resolves another, YAML pretty-print changing\nblock-scalar parsing, and merge/review load when many IMPL records change together.\n"
