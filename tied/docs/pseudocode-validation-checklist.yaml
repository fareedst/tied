checklist:
  - category: "tied_data"
    evidence:
      - "or equivalent documented manual review only when MCP is unavailable and project policy allows"
      - "tied_validate_consistency report with pseudocode section for the token"
    id: "TIED-POE-001"
    required: "true"
    severity_on_failure: "error"
    title: "TIED data validation passes for changed IMPL essence (merged pseudo-code)"
    verify:
      - "do not use this checklist in isolation when TIED is available; qualify sidecar or merged text with TIED first"
      - "for the affected IMPL, tied_validate_consistency returns ok with include_pseudocode (default) so merged essence from IMPL-TOKEN-pseudocode.md meets TIED token comment and token-ref rules"
  - category: "parsing"
    evidence:
      - "parse failures include source location"
      - "parse result exists for each block"
    id: "PARSE-001"
    required: "true"
    severity_on_failure: "error"
    title: "Every pseudo-code block parses successfully"
    verify:
      - "malformed syntax is rejected"
      - "parsing produces a normalized internal representation"
      - "the block conforms to the project grammar"
  - category: "executable_layer_b"
    evidence:
      - "diagnostics include source line and block where applicable"
      - "proof_boundary states structural validation only"
      - "pseudocode_validate result with schema_version layer-b-pseudocode-validator.v1"
    id: "EXEC-001"
    required: "true"
    severity_on_failure: "error"
    title: "Layer B validator runs deterministically after Layer A"
    verify:
      - "do not interpret structural success as runtime correctness or complete behavioral coverage"
      - "require_behavioral_coverage remains false or N/A before RED with rationale; test-dependent evidence is supplied after RED"
      - "run pseudocode_validate after tied_validate_consistency for changed IMPL pseudo-code"
      - "validate blocks, contracts, token linkage, symbol closure, and dependency graph"
  - category: "parsing"
    evidence:
      - "each diagnostic includes block identifier"
      - "line and column are present when the parser provides them"
    id: "PARSE-002"
    required: "true"
    severity_on_failure: "error"
    title: "Source locations are preserved for diagnostics"
    verify:
      - "diagnostics can identify the exact block and step"
      - "line and column are attached where available"
  - category: "schema"
    evidence:
      - "no missing required fields"
      - "section inventory per block kind"
    id: "SHAPE-001"
    required: "true"
    severity_on_failure: "error"
    title: "Required sections exist for each block kind"
    verify:
      - "block headers and tags follow naming rules"
      - "required sections are present for the declared block kind"
      - "section order follows project conventions if order is significant"
  - category: "schema"
    evidence:
      - "declaration table matches block references"
    id: "SHAPE-002"
    required: "true"
    severity_on_failure: "error"
    title: "Inputs outputs and data declarations are internally consistent"
    verify:
      - "duplicate declarations are rejected unless explicitly allowed"
      - "identifiers are declared before use"
      - "output variants are structurally valid"
  - category: "schema"
    evidence:
      - "contract field inventory per Active procedure block (PRE POST EFFECTS INPUT OUTPUT)"
    id: "SHAPE-003"
    required: "true"
    severity_on_failure: "error"
    title: "Active procedure blocks declare PRE POST and EFFECTS"
    verify:
      - "N/A allowed for status Template stubs or unchanged legacy Active blocks with rationale pre-contract-grammar"
      - "PRE true is used only when the block is genuinely unconstrained and the choice is documented"
      - "new or changed Active non-stub procedure blocks declare PRE POST and EFFECTS alongside INPUT and OUTPUT"
  - category: "schema"
    evidence:
      - "FAILURE_MODES set vs OUTPUT error variants and step-level error names"
    id: "SHAPE-004"
    required: "true"
    severity_on_failure: "error"
    title: "FAILURE_MODES closed set when errors are possible"
    verify:
      - "FAILURE_MODES is present when OUTPUT includes error or steps use ON error or fallible returns"
      - "N/A when the block has no error OUTPUT and no fallible error paths"
      - "every error name used in steps appears in FAILURE_MODES"
  - category: "schema"
    evidence:
      - "DATA_TRANSITION present when DATA mutates or EFFECTS includes State"
    id: "SHAPE-005"
    required: "true"
    severity_on_failure: "error"
    title: "DATA_TRANSITION when mutable DATA or State effects"
    verify:
      - "DATA_TRANSITION states before-to-after rules when DATA is mutated or EFFECTS includes State"
      - "N/A when DATA is absent or read-only and EFFECTS does not include State"
  - category: "schema"
    evidence:
      - "TERMINATION declared for recursion WHILE or open wait"
    id: "SHAPE-006"
    required: "true"
    severity_on_failure: "error"
    title: "TERMINATION when recursion WHILE or open-ended wait"
    verify:
      - "N/A when no recursion WHILE or open-ended wait (or document TERMINATION total)"
      - "TERMINATION total or may_diverge with justification when recursion WHILE or open-ended wait is present"
      - "prefer TERMINATION total when the block is clearly total"
  - category: "unit_test_spec"
    evidence:
      - "exactly one target symbol is resolved"
    id: "TEST-UNIT-001"
    required: "true"
    severity_on_failure: "error"
    title: "Each unit-test block declares exactly one subject under test"
    verify:
      - "helper references do not create ambiguity about the subject"
      - "the unit-test block targets one routine or one block"
  - category: "unit_test_spec"
    evidence:
      - "normalized phase map exists for each unit-test block"
    id: "TEST-UNIT-002"
    required: "true"
    severity_on_failure: "error"
    title: "Unit-test phases are explicit or inferable"
    verify:
      - "act exists"
      - "assertion or expected outcome exists"
      - "error expectation is explicit when failure behavior is tested"
      - "setup exists"
  - category: "integration_test_spec"
    evidence:
      - "collaborator list resolves against the application symbol table"
    id: "TEST-INT-001"
    required: "true"
    severity_on_failure: "error"
    title: "Integration-test blocks declare participating collaborators"
    verify:
      - "all directly involved blocks or routines are named"
      - "external boundaries are identified when present"
      - "undeclared collaborators are rejected"
  - category: "integration_test_spec"
    evidence:
      - "dependency graph analysis for each integration test"
    id: "TEST-INT-002"
    required: "true"
    severity_on_failure: "error"
    title: "Integration-test boundaries follow architecture rules"
    verify:
      - "collaborator usage matches architecture constraints"
      - "forbidden layers are not crossed"
      - "only allowed dependency directions are used"
  - category: "symbol_resolution"
    evidence:
      - "symbol table with unique bindings"
    id: "RESOLVE-001"
    required: "true"
    severity_on_failure: "error"
    title: "Every referenced symbol resolves uniquely"
    verify:
      - "names are not ambiguous"
      - "referenced blocks exist"
      - "referenced routines exist"
      - "referenced tags exist"
  - category: "symbol_resolution"
    evidence:
      - "duplicate report reviewed and resolved"
    id: "RESOLVE-002"
    required: "true"
    severity_on_failure: "error"
    title: "Duplicate identifiers are controlled"
    verify:
      - "duplicate block identifiers are rejected unless intentionally versioned"
      - "duplicate requirement or implementation tags are explainable"
  - category: "contract_validation"
    evidence:
      - "PRE clauses vs test setup"
      - "contract comparison result for each test target"
    id: "CONTRACT-001"
    required: "true"
    severity_on_failure: "error"
    title: "Test inputs conform to target block contracts"
    verify:
      - "preconditions are satisfied by setup"
      - "test inputs match the declared input names and shapes"
      - "test setup satisfies declared PRE predicates"
      - "undeclared inputs are rejected"
  - category: "contract_validation"
    evidence:
      - "POST and FAILURE_MODES vs assertions"
      - "output and error expectation comparison report"
    id: "CONTRACT-002"
    required: "true"
    severity_on_failure: "error"
    title: "Expected outputs and errors conform to target block contracts"
    verify:
      - "assertions refer only to observable behavior"
      - "expected errors match declared FAILURE_MODES names and error POST where stated"
      - "expected errors match declared error types or failure modes"
      - "expected success results match a declared output variant and success POST where stated"
  - category: "contract_validation"
    evidence:
      - "POST invariants mapped to tests"
      - "mapping from safety clauses to test assertions"
    id: "CONTRACT-003"
    required: "true"
    severity_on_failure: "warning"
    title: "Safety and invariant claims are testable where required"
    verify:
      - "POST invariants are asserted where stated"
      - "invariants are asserted where the project requires them"
      - "prohibited behaviors are explicitly checked when relevant"
      - "safety constraints stated in the target spec are reflected in tests"
  - category: "dependency_graph"
    evidence:
      - "graph validation report"
    id: "GRAPH-001"
    required: "true"
    severity_on_failure: "error"
    title: "The application dependency graph is valid"
    verify:
      - "allowed cycles are classified and documented"
      - "every dependency edge connects known nodes"
      - "forbidden cycles are rejected"
  - category: "dependency_graph"
    evidence:
      - "unit-test collaborator audit"
    id: "GRAPH-002"
    required: "true"
    severity_on_failure: "warning"
    title: "Unit tests do not silently depend on undeclared collaborators"
    verify:
      - "hidden integration behavior is flagged"
      - "unit-test blocks use only the declared subject and allowed helpers"
  - category: "behavioral_coverage"
    evidence:
      - "coverage map from implementation block to success-path tests"
    id: "COVER-001"
    required: "true"
    severity_on_failure: "error"
    title: "Each implementation block has success-path coverage"
    verify:
      - "at least one test exercises the intended success result"
  - category: "behavioral_coverage"
    evidence:
      - "FAILURE_MODES names used in failure-path assertions"
      - "coverage map from failure modes to tests"
    id: "COVER-002"
    required: "true"
    severity_on_failure: "error"
    title: "Each implementation block has failure-path coverage when failure is possible"
    verify:
      - "declared errors and FAILURE_MODES are exercised by tests"
      - "failure-path assertions use names from FAILURE_MODES and check the expected error shape"
  - category: "behavioral_coverage"
    evidence:
      - "edge-case coverage inventory"
    id: "COVER-003"
    required: "false"
    severity_on_failure: "warning"
    title: "Boundary and edge cases are covered"
    verify:
      - "empty inputs are tested where meaningful"
      - "malformed or extreme values are tested where relevant"
      - "minimal valid inputs are tested"
  - category: "traceability"
    evidence:
      - "requirement-to-test matrix"
    id: "TRACE-001"
    required: "true"
    severity_on_failure: "error"
    title: "Every requirement tag has at least one test"
    verify:
      - "each requirement identifier maps to one or more test blocks"
      - "orphan requirements are reported"
  - category: "traceability"
    evidence:
      - "implementation-to-test matrix"
    id: "TRACE-002"
    required: "true"
    severity_on_failure: "error"
    title: "Every implementation tag has corresponding validation coverage"
    verify:
      - "each implementation identifier maps to unit or integration tests"
      - "untested implementation blocks are reported"
  - category: "traceability"
    evidence:
      - "architecture-to-integration-test matrix"
    id: "TRACE-003"
    required: "false"
    severity_on_failure: "warning"
    title: "Architecture relationships are reflected in integration tests"
    verify:
      - "architecture-level dependencies are exercised by one or more integration tests"
      - "missing integration coverage is reported"
  - category: "linting"
    evidence:
      - "lint findings for ambiguous steps"
    id: "LINT-001"
    required: "false"
    severity_on_failure: "warning"
    title: "Pseudo-code steps use precise verbs and avoid ambiguous phrasing"
    verify:
      - "assertions are explicit rather than implied"
      - "vague terms are flagged unless refined by context"
  - category: "linting"
    evidence:
      - "fixture and mock declaration audit"
    id: "LINT-002"
    required: "false"
    severity_on_failure: "warning"
    title: "Test blocks declare fixtures mocks and helpers explicitly"
    verify:
      - "hidden setup is not assumed"
      - "mock or stub usage matches actual collaborators"
  - category: "linting"
    evidence:
      - "read IMPL-TOKEN-pseudocode.md; compare to script/extract_test_pseudocode_to_impl_sidecars.py output"
    id: "LINT-MD-001"
    required: "false"
    severity_on_failure: "info"
    title: "IMPL Markdown sidecar matches agreed heading structure when extract-generated"
    verify:
      - "a single H1 for the file intro with IMPL/ARCH/REQ bracket tokens (methodology order when all three appear); per coverage section H2 with a Source line when using the Comrak extract path"
  - category: "linting"
    evidence:
      - "NORM in src/tests vs impl sidecar; tied/docs/pseudocode-writing-and-validation.md"
    id: "LINT-MD-002"
    required: "false"
    severity_on_failure: "info"
    title: "Rust NORM line comments keep structured NORM; optional /* */ is narrative"
    verify:
      - "// lines carry FILE/TEST/contract and bracket tokens as required by the project"
      - "optional /* */ preface in the pre-test span is narrative; not a substitute for // tokens unless policy and extract tooling allow"
  - category: "semantic_simulation"
    evidence:
      - "symbolic validation report"
    id: "SIM-001"
    required: "false"
    severity_on_failure: "warning"
    title: "Test pseudo-code is semantically coherent under symbolic interpretation"
    verify:
      - "assertions are reachable"
      - "expected results do not contradict the target contract POST or OUTPUT"
      - "setup can satisfy target PRE / preconditions"
  - category: "generation_readiness"
    evidence:
      - "generation feasibility report"
    id: "GEN-001"
    required: "false"
    severity_on_failure: "warning"
    title: "Test pseudo-code can be translated into executable tests"
    verify:
      - "assertions are machine-translatable"
      - "each step maps to a supported test framework primitive"
      - "fixtures can be materialized"
      - "unresolved natural language steps are reported"
  - category: "reporting"
    evidence:
      - "diagnostic output sample"
    id: "DIAG-001"
    required: "true"
    severity_on_failure: "error"
    title: "Findings are emitted with severity message and source location"
    verify:
      - "all findings include a concise explanation"
      - "all findings include severity"
      - "all findings point to block and source location when available"
description: "Reusable checklist for projects whose IMPL pseudo-code blocks describe implementation intent, unit and\nintegration tests, traceability, and (optionally) generation-readiness. Canonical definition and grammar\n(language-agnostic TIED vocabulary, block-format sync to tests and code, LEAP when scope changes): see\ntied/docs/pseudocode-writing-and-validation.md § Definition; sidecar body template: templates/impl-essence-pseudocode-template.md.\n\nIMPL essence_pseudocode is language-agnostic: it uses INPUT/OUTPUT/DATA/CONTROL, precision fields\nPRE/POST/EFFECTS/FAILURE_MODES/DATA_TRANSITION/TERMINATION, and procedure steps—not host-language source.\nFull token lines use IMPL, ARCH, REQ bracket order when all three appear (see implementation-decisions.md).\nEach logical block (e.g. Markdown ## section) is synchronized to tests and production code via literal block\nleads (and optional full-block copy per project policy). Edits that change behavior or requirement/architecture\nscope require [PROC-LEAP] validation (IMPL, then ARCH and REQ)—Layer A and Layer B do not replace that propagation.\n\nContract precision (SHAPE-003..006): required for new/changed Active procedure blocks; N/A for Template stubs;\nN/A rationale pre-contract-grammar only for unchanged legacy Active blocks until next edit. CONTROL remains\noptional (env/flags/ordering) and is distinct from EFFECTS (effect row).\n\nIn TIED IMPL layout, the canonical on-disk source for the pseudo-code body is\ntied/implementation-decisions/IMPL-{TOKEN}-pseudocode.md (UTF-8). TIED merges that file into the logical\nessence_pseudocode field for yaml_detail_read and for tied_validate_consistency (include_pseudocode: true\nby default). Run that TIED gate to qualify the external file against index and token-reference rules before\nor alongside the PARSE/SHAPE/... categories in this file.\n\nThe sidecar is Markdown. Layer A (tied_validate_consistency) still inspects the merged string; bracket\n[IMPL-*/ARCH-*/REQ-*] tags may appear on any line, not a fixed comment prefix. When a project (e.g. Comrak)\nhas no custom pseudo-code grammar parser, treat each section between ## headings in IMPL-*-pseudocode.md as\none logical \"block\" for manual Layer B review. Optional items LINT-MD-001 and LINT-MD-002 below help reviewers\nalign with the extract-generated sidecar pattern where that script is used.\n"
minimum_gating_rules:
  - "all required checks pass"
  - "DATA_TRANSITION when mutable DATA or EFFECTS includes State (SHAPE-005)"
  - "diagnostics include source locations where available"
  - "every declared failure mode has coverage when failure is possible"
  - "every implementation block has success-path coverage"
  - "every requirement tag is covered by at least one test"
  - "FAILURE_MODES closed set when errors are possible (SHAPE-004); failure-path tests use those names"
  - "new or changed Active procedure blocks declare PRE POST and EFFECTS (SHAPE-003)"
  - "no unresolved symbols remain"
  - "TERMINATION when recursion WHILE or open-ended wait (SHAPE-006)"
  - note: "Full rules above assume pseudo-code drives or coexists with executable tests. Before RED tests, gate-pseudocode-validation applies a structural subset only—see tied/docs/pseudocode-writing-and-validation.md § Validation layers (Pre-RED vs post-test). N/A for Template stubs; N/A rationale pre-contract-grammar only for unchanged legacy Active blocks; new/changed Active blocks may not use pre-contract-grammar."
name: "application_pseudocode_validation_checklist"
recommended_validation_order:
  - "tied_data"
  - "parsing"
  - "schema"
  - "symbol_resolution"
  - "contract_validation"
  - "dependency_graph"
  - "behavioral_coverage"
  - "traceability"
  - "linting"
  - "semantic_simulation"
  - "generation_readiness"
  - "reporting"
tailoring:
  notes:
    - "SHAPE-003..006 contract precision: do not weaken requiredness for new/changed Active blocks; pre-contract-grammar N/A is only for unchanged legacy Active blocks until next edit"
    - "add custom coverage thresholds per block kind if needed"
    - "add domain-specific safety rules under contract_validation"
    - "add generation backend constraints if pseudo-code drives test generation directly"
    - "add project architecture constraints under dependency_graph"
    - "add project-specific block kinds under the schema category"
    - "for Comrak-style Markdown sidecars, optional LINT-MD-001 and LINT-MD-002 align manual Layer B with extract_test_pseudocode_to_impl_sidecars.py; mark N/A when the IMPL is purely procedural and not test-catalog-driven"
usage:
  how_to_apply:
    - "for Comrak extract-generated IMPL-*-pseudocode.md, use script/extract_test_pseudocode_to_impl_sidecars.py as the source of truth for what a “block” is (H1 file intro, H2 per test, Source line, then list/blockquote body); do not re-invent a different block boundary without a project reason"
    - "for IMPL, ingest the same text TIED uses—read IMPL-TOKEN-pseudocode.md, or the merged essence_pseudocode from yaml_detail_read; they are equivalent when the sidecar is present"
    - "parse each pseudo-code block into a normalized internal representation"
    - "record findings with severity and source location"
    - "run Layer A (tied_validate_consistency) before relying on Layer B rows; resolve LEAP (IMPL to ARCH/REQ) when edits change scope—not only checklist passes"
    - "run each validation pass in the recommended order (tied_data first, then application categories below)"
    - "run tied_validate_consistency (Layer A) so the external or merged pseudo-code is qualified for repository traceability rules; Layer A and this checklist (Layer B) are complementary—traceability vs. contracts/structure"
    - "treat required checks as gating unless explicitly waived"
  intended_for:
    - "projects that require REQ, ARCH, and IMPL traceability and LEAP-aligned updates when pseudocode scope changes"
    - "projects where pseudo-code drives unit-test and integration-test definitions and literal block linkage to code"
    - "projects with IMPL pseudo-code as the primary specification for behavior (language-agnostic contracts and steps)"
  result_severities:
    - "error"
    - "info"
    - "warning"
