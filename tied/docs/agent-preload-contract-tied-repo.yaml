preload_instructions: "Treat agent_preload as authoritative context. If a value is present, do not spend\ntool calls rediscovering it unless a later tool result or user message contradicts it.\nPrefer preload facts over filesystem discovery. Do not search for MCP schema, server\nmetadata, `.cursor/mcp.json`, or pause to confirm MCP unavailability — especially when\nthe session is driven by Go tools/agentstream (MCP preflight there is optional; copy_files.sh\ninstalls `.cursor/skills/tied-yaml/` only). Do not search project layout or target file\nexistence unless needed to resolve a contradiction. When tied_paths.TIED_BASE_PATH and\nproject_yaml_writable_globs are set,\nalign MCP TIED_BASE_PATH with them (use \".\" for this repo unless tied_config_get_base_path\nsays otherwise). Methodology in this repository lives under methodology_source_glob\n(templates/**), not client tied/methodology/**. Keep preload narrow and accurate; wrong\npreload costs more than one discovery call.\n"
