agent_preload:
  active_user_intent:
    checklist_step_id: ""
    checklist_token: ""
    primary_query_summary: ""
  discovery_already_done:
    gemfile_present: "false"
    grep_patterns_satisfied:
      repo_layout_scan: "false"
      token_scan_in_sources: "false"
    ruby_files_present: "false"
    ruby_test_files_present: "false"
    semantic_tokens_present: "false"
  implementation_contract:
    citdp_artifact_paths: []
    invalid_input: ""
    language: ""
    language_version: ""
    target_source_paths: []
    test_cohabit_code: "false"
    test_framework: ""
  methodology_vs_project:
    methodology_readonly: "true"
    project_tokens_only_writable: "true"
  session_bootstrap_docs:
    agent_req_checklist_path: "./tied/docs/agent-req-implementation-checklist.md"
    ai_principles_path: "./tied/docs/ai-principles.md"
    architecture_decisions_index: "./tied/architecture-decisions.yaml"
    detail_files_schema: "./tied/docs/detail-files-schema.md"
    implementation_decisions_guide: "./tied/docs/implementation-decisions.md"
    implementation_decisions_index: "./tied/implementation-decisions.yaml"
    processes_path: "./tied/docs/processes.md"
    requirements_index: "./tied/requirements.yaml"
    semantic_tokens_guide: "./tied/docs/semantic-tokens.md"
    semantic_tokens_index: "./tied/semantic-tokens.yaml"
  tied_mcp:
    base_path_resolved: "false"
    tied_cli_stdio_ok_without_cursor_mcp: "false"
    yaml_detail_batch_done: "false"
  tied_paths:
    TIED_BASE_PATH: ""
    mcp_tied_yaml_verified_this_session: "false"
    methodology_readonly_glob: "methodology/**"
    project_yaml_writable_globs:
      - "*.yaml"
      - "architecture-decisions/*.yaml"
      - "implementation-decisions/*.yaml"
      - "requirements/*.yaml"
  workspace:
    cwd: ""
    project_summary: ""
    top_level_entries: []
    vcs_present: "false"
preload_instructions: "Treat agent_preload as authoritative context. If a value is present, do not spend\ntool calls rediscovering it unless a later tool result or user message contradicts it.\nPrefer preload facts over filesystem discovery. Do not search for MCP schema, server\nmetadata, `.cursor/mcp.json`, or pause to confirm MCP unavailability — especially when\nthe session is driven by Go tools/agentstream (MCP preflight there is optional; copy_files.sh\ninstalls `.cursor/skills/tied-yaml/` only). Lack of Cursor MCP tools does not block tied-cli.sh\nwhen Node and TIED_MCP_BIN (built mcp-server/dist/index.js) are available — see tied-yaml SKILL.md. Do not search project layout or target file\nexistence unless needed to resolve a contradiction. When tied_paths.TIED_BASE_PATH and\nproject_yaml_writable_globs are set,\nalign MCP TIED_BASE_PATH with them; never treat methodology_readonly_glob paths as\nwritable. Keep preload narrow and accurate; wrong preload costs more than one\ndiscovery call.\n"
